<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Costos y Propuesta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Dark theme (default) ── */
  :root {
    --bg:          #0c0e14;
    --card:        #111520;
    --inp-bg:      #0f1420;
    --inp-bdr:     #253347;
    --btn-bg:      #131825;
    --btn-bdr:     #253347;
    --btn-text:    #C0CEDF;
    --border:      #1e2a3a;
    --border2:     #182030;
    --text:        #F4F7FB;
    --text2:       #C0CEDF;
    --text3:       #8094B4;
    --text4:       #607898;
    --header-bg:   #0d1019;
    --header-bdr:  #1e2a3a;
    --active-bg:   #2D8FCC;
    --active-text: #ffffff;
    --active-bdr:  #2D8FCC;
    --inactive-bg: #131825;
    --inactive-text:#C0CEDF;
    --inactive-bdr:#253347;
    --tab-wrap:    #0d1019;
    --tab-on-bg:   #1e2a3a;
    --tab-on-text: #F4F7FB;
    --tab-off-text:#8094B4;
    --cta-bg:      #2D8FCC;
    --cta-text:    #ffffff;
    --tgl-btn:     #1e2a3a;
    --tgl-icon:    #C0CEDF;
    /* sidebar stays dark in both themes */
    --sb-bg:       #0d1019;
    --sb-text:     #F4F7FB;
    --sb-text2:    #8094B4;
    --sb-text3:    #607898;
    --sb-bdr:      #1e2a3a;
    --sb-acc:      #2D8FCC;
    --sb-btn-bg:   #111520;
    --sb-btn-text: #C0CEDF;
  }
  /* ── Light theme ── */
  :root[data-theme="light"] {
    --bg:          #f4f3f0;
    --card:        #ffffff;
    --inp-bg:      #faf9f7;
    --inp-bdr:     #dedbd5;
    --btn-bg:      #f0eee9;
    --btn-bdr:     #dedbd5;
    --btn-text:    #4a4741;
    --border:      #dedbd5;
    --border2:     #efedea;
    --text:        #1b1a18;
    --text2:       #4a4741;
    --text3:       #86817b;
    --text4:       #6f6b64;
    --header-bg:   #ffffff;
    --header-bdr:  #dedbd5;
    --active-bg:   #1b1a18;
    --active-text: #f4f3f0;
    --active-bdr:  #1b1a18;
    --inactive-bg: #f0eee9;
    --inactive-text:#4a4741;
    --inactive-bdr:#dedbd5;
    --tab-wrap:    #f0eee9;
    --tab-on-bg:   #ffffff;
    --tab-on-text: #1b1a18;
    --tab-off-text:#7a756e;
    --cta-bg:      #1b1a18;
    --cta-text:    #f4f3f0;
    --tgl-btn:     #f0eee9;
    --tgl-icon:    #4a4741;
    --sb-bg:       #1b1a18;
    --sb-text:     #f4f3f0;
    --sb-text2:    #b8b3ac;
    --sb-text3:    #8f8a83;
    --sb-bdr:      #3a3833;
    --sb-acc:      oklch(0.78 0.11 200);
    --sb-btn-bg:   #2d2c29;
    --sb-btn-text: #f4f3f0;
  }
  @media print {
    :root { /* always light for print */
      --bg:#fff; --card:#fff; --inp-bg:#fff; --border:#e6e2da; --border2:#efedea;
      --text:#1b1a18; --text2:#4a4741; --text3:#86817b; --text4:#6f6b64;
    }
    .noprint { display: none !important; }
    html, body { background: #fff !important; }
    .print-sheet { box-shadow: none !important; border: 0 !important; margin: 0 !important; width: 100% !important; padding: 0 !important; }
    .wrap-grid { padding: 0 !important; }
  }
  html, body { margin: 0; padding: 0; background: var(--bg); font-family: 'IBM Plex Sans', Helvetica, Arial, sans-serif; color: var(--text); transition: background .2s, color .2s; }
  * { box-sizing: border-box; }
  a { color: oklch(0.50 0.09 220); text-decoration: none; }
  input, textarea, button, select { font-family: inherit; color: inherit; }
  input:focus, textarea:focus, select:focus { outline: 2px solid oklch(0.50 0.09 220); outline-offset: -1px; }
  @media (max-width: 1240px) {
    .wrap-grid { grid-template-columns: minmax(0, 1fr) !important; }
    .sidebar { position: static !important; }
  }
  .sidebar span { white-space: nowrap; }
  .sidebar > div > span:first-child { white-space: normal; min-width: 0; }
  .toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 16px; background: var(--active-bg); color: var(--active-text); border-radius: 8px; font-size: 13px; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .theme-toggle { display:flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--tgl-btn);background:var(--tgl-btn);border-radius:7px;cursor:pointer;font-size:16px;color:var(--tgl-icon);transition:background .15s; }
  .theme-toggle:hover { filter:brightness(1.15); }
</style>
</head>
<body>

<div id="app" style="min-height:100vh;"></div>
<div id="toast" class="toast"></div>

<script>
// ── Theme init (before render) ─────────────────────────────────────────────
(function(){
  const saved = localStorage.getItem("fs-theme") || "dark";
  document.documentElement.setAttribute("data-theme", saved);
})();
function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme") || "dark";
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("fs-theme", next);
  render();
}
function isDark() { return (document.documentElement.getAttribute("data-theme") || "dark") === "dark"; }
</script>

<script>
// ─── Config ─────────────────────────────────────────────────────────────────
const PROPS = {
  simboloMoneda: "Gs.",
  decimales: 0,
  empresa: "The Wealt Group Export Import S.A.",
  empresaBajada: "Propuesta Técnica Comercial de TWG S.A.\nFull Service",
  empresaRubro: "Construcción, mantenimiento, servicios y productos para la construcción",
  empresaContacto: "WhatsApp 595971235799 · contacto@fullservice.com.py",
  whatsappPropio: "595971235799",
  correoPropio: "contacto@fullservice.com.py",
  canalWhatsapp: "Automático",
  nroPresupuesto: "P-2026-001",
  condiciones: "Los precios se mantienen dentro del plazo de validez indicado y están sujetos a la disponibilidad de materiales al momento de la aceptación. No se incluyen trabajos, materiales ni gestiones que no figuren en el alcance. Cualquier adicional se cotiza por separado y por escrito antes de ejecutarse."
};

// ─── URL param ──────────────────────────────────────────────────────────────
const presupuestoId = new URLSearchParams(location.search).get("id") || "";

// ─── Helpers ────────────────────────────────────────────────────────────────
const N = (v) => { const n = parseFloat(String(v ?? "").replace(/\s/g,"").replace(",",".")); return isFinite(n) ? n : 0; };
const money = (n) => (n < 0 ? "-" : "") + PROPS.simboloMoneda + " " + Math.abs(n).toLocaleString("es-PY",{minimumFractionDigits:PROPS.decimales,maximumFractionDigits:PROPS.decimales});
const pct = (v) => N(v).toLocaleString("es-PY",{maximumFractionDigits:2}) + "%";

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

// ─── Default state ──────────────────────────────────────────────────────────
const rubroBase = (nombre) => ({
  id: Date.now() + Math.random(),
  nombre,
  mats: [{ id: 1, desc: "", unidad: "un", cant: "0", costo: "0", desp: "0", marg: "25" }],
  mos: [{ id: 1, desc: "", pers: "1", horas: "0", vh: "0", marg: "30" }],
  flete: "0", equipos: "0", subcontratos: "0", varios: "0",
  overhead: "12", margen: "25", descMat: "", descMo: "",
  incluir: true, medida: "", unidad: "m2"
});

let S = {
  tab: "costos",
  activo: 0,
  mostrarMO: false,
  mostrarOtros: false,
  rubros: [{
    id: 1, nombre: "Albañilería",
    mats: [
      { id: 1, desc: "Cemento portland x 50 kg", unidad: "bolsa", cant: "40", costo: "45000", desp: "5", marg: "20" },
      { id: 2, desc: "Arena gruesa", unidad: "m3", cant: "6", costo: "180000", desp: "8", marg: "18" },
      { id: 3, desc: "Ladrillo hueco 18", unidad: "un", cant: "1200", costo: "3500", desp: "6", marg: "22" },
    ],
    mos: [{ id: 1, desc: "Albañilería", pers: "3", horas: "160", vh: "25000", marg: "30" }],
    flete: "0", equipos: "0", subcontratos: "0", varios: "0",
    overhead: "12", margen: "25", descMat: "", descMo: "",
    incluir: true, medida: "", unidad: "m2"
  }],
  descuento: "0", iva: "10",
  cliente: "", obra: "", domicilio: "", contacto: "",
  firmaNombre: "Ing. Edgar Mendez", firmaCargo: "Ejecutivo Comercial",
  waDestino: "", mailDestino: "",
  plazo: "45 días corridos desde el anticipo",
  validez: "15 días",
  pago: "40% de anticipo, 40% contra avance de obra, 20% a la entrega",
  alcance: "Provisión de materiales, mano de obra y dirección de los trabajos descriptos, incluyendo limpieza final de obra y retiro de escombros."
};

// ─── Save/Load ──────────────────────────────────────────────────────────────
let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToAPI, 1500);
}

async function saveToAPI() {
  if (!presupuestoId) return;
  try {
    const stateToSave = JSON.parse(JSON.stringify(S));
    delete stateToSave._saving;
    await fetch("/api/presupuestos/" + presupuestoId, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ costosData: stateToSave })
    });
    showToast("Guardado");
  } catch(e) {
    showToast("Error al guardar");
  }
}

async function loadFromAPI() {
  if (!presupuestoId) return;
  try {
    const res = await fetch("/api/presupuestos/" + presupuestoId);
    if (!res.ok) return;
    const data = await res.json();
    const cd = data.costosData;
    if (cd && typeof cd === "object" && cd.rubros && Array.isArray(cd.rubros) && cd.rubros.length > 0) {
      S = Object.assign({}, S, cd);
    }
    // Pre-fill client info from presupuesto record
    if (data.customer && typeof data.customer === "object") {
      const cu = data.customer;
      if (!S.cliente && cu.name) S.cliente = cu.name;
      if (!S.contacto && cu.email) S.contacto = cu.email;
    }
    if (data.code && !S.nroPresupuesto) PROPS.nroPresupuesto = data.code;
    if (data.code) PROPS.nroPresupuesto = data.code;
  } catch(e) {}
}

// ─── Calculations ────────────────────────────────────────────────────────────
function costoMat(r) { return N(r.cant) * N(r.costo) * (1 + N(r.desp) / 100); }
function costoMo(r) { return Math.max(N(r.pers), 1) * N(r.horas) * N(r.vh); }

function calcRubro(R) {
  const oh = 1 + N(R.overhead) / 100;
  const usarMO = !!S.mostrarMO;
  const materiales = R.mats.reduce((a,r) => a + costoMat(r), 0);
  const manoObra = usarMO ? R.mos.reduce((a,r) => a + costoMo(r), 0) : 0;
  const otros = S.mostrarOtros ? (N(R.flete) + N(R.equipos) + N(R.subcontratos) + N(R.varios)) : 0;
  const costoDirecto = materiales + manoObra + otros;
  const montoOverhead = costoDirecto * N(R.overhead) / 100;
  const costoTotal = costoDirecto + montoOverhead;
  const precioMateriales = R.mats.reduce((a,r) => a + costoMat(r) * oh * (1 + N(r.marg) / 100), 0);
  const precioManoObra = usarMO ? R.mos.reduce((a,r) => a + costoMo(r) * oh * (1 + N(r.marg) / 100), 0) : 0;
  const precioOtros = otros * oh * (1 + N(R.margen) / 100);
  const precioRubro = precioMateriales + precioManoObra + precioOtros;
  return { materiales, manoObra, otros, costoDirecto, montoOverhead, costoTotal, precioMateriales, precioManoObra, precioOtros, precioRubro, montoMargen: precioRubro - costoTotal };
}

function calcGlobal(porRubroFiltrado) {
  const costoTotal = porRubroFiltrado.reduce((a,x) => a + x.costoTotal, 0);
  const subtotalCliente = porRubroFiltrado.reduce((a,x) => a + x.precioRubro, 0);
  const montoDescuento = subtotalCliente * N(S.descuento) / 100;
  const neto = subtotalCliente - montoDescuento;
  const montoIva = neto * N(S.iva) / 100;
  return { costoTotal, subtotalCliente, montoDescuento, neto, montoIva, totalFinal: neto + montoIva, ganancia: neto - costoTotal };
}

function getRubro() { return S.rubros[Math.min(S.activo, S.rubros.length - 1)] || rubroBase("Rubro"); }
function incluido(r, calc) { return r.incluir !== false && calc.precioRubro > 0; }

// ─── State mutation ──────────────────────────────────────────────────────────
function setState(patch) {
  if (typeof patch === "function") { const p = patch(S); S = Object.assign({}, S, p); }
  else S = Object.assign({}, S, patch);
  render(); scheduleSave();
}

function patchRubro(patch) {
  setState(p => {
    const arr = p.rubros.slice();
    const i = Math.min(p.activo, arr.length - 1);
    arr[i] = Object.assign({}, arr[i], patch);
    return { rubros: arr };
  });
}

function editRow(key, i, field, value) {
  const R = getRubro();
  const arr = R[key].slice();
  arr[i] = Object.assign({}, arr[i], { [field]: value });
  patchRubro({ [key]: arr });
}

function delRow(key, i) { patchRubro({ [key]: getRubro()[key].filter((_,j) => j !== i) }); }

// ─── Text correction ─────────────────────────────────────────────────────────
async function corregir(key, scope) {
  const texto = String((scope === "rubro" ? getRubro()[key] : S[key]) || "").trim();
  if (!texto || S["busy_" + key]) return;
  setState({ ["busy_" + key]: true, ["err_" + key]: "" });
  try {
    if (window.claude && window.claude.complete) {
      const out = await window.claude.complete({
        system: "Sos un corrector de textos técnicos de construcción en español paraguayo. Corregís ortografía, gramática y puntuación, y mejorás la redacción para que suene profesional en un presupuesto de obra. No inventás datos, precios, materiales ni plazos que no estén en el texto. No agregás comentarios ni comillas: devolvés únicamente el texto corregido.",
        messages: [{ role: "user", content: texto }]
      });
      const limpio = String(out || "").trim().replace(/^["'"]|["'"]$/g, "");
      if (limpio) { if (scope === "rubro") patchRubro({ [key]: limpio }); else setState({ [key]: limpio }); }
    } else {
      setState({ ["err_" + key]: "IA no disponible" });
    }
  } catch(e) { setState({ ["err_" + key]: "No se pudo corregir" }); }
  finally { setState({ ["busy_" + key]: false }); }
}

// ─── Resumen texto ───────────────────────────────────────────────────────────
function resumenTexto(idxIncluidos, porRubro, G) {
  const L = [];
  L.push(PROPS.empresa.trim());
  L.push("Presupuesto " + PROPS.nroPresupuesto + " — " + new Date().toLocaleDateString("es-PY"));
  L.push("");
  if (S.cliente) L.push("Cliente: " + S.cliente);
  if (S.obra) L.push("Obra: " + S.obra);
  if (S.domicilio) L.push("Domicilio: " + S.domicilio);
  L.push("");
  idxIncluidos.forEach((i, k) => {
    const r = S.rubros[i];
    L.push(String(k + 1).padStart(2, "0") + ". " + (r.nombre || "Rubro") + " — " + money(porRubro[i].precioRubro));
    const d = (r.descMat || "").trim();
    if (d) L.push("   " + d);
  });
  L.push("");
  L.push("Subtotal: " + money(G.subtotalCliente));
  if (N(S.descuento) > 0) L.push("Descuento " + pct(S.descuento) + ": -" + money(G.montoDescuento));
  L.push("IVA " + pct(S.iva) + ": " + money(G.montoIva));
  L.push("TOTAL: " + money(G.totalFinal));
  L.push("");
  if (S.plazo) L.push("Plazo de entrega: " + S.plazo);
  if (S.pago) L.push("Forma de pago: " + S.pago);
  if (S.validez) L.push("Validez de la oferta: " + S.validez);
  L.push("");
  L.push(S.firmaNombre + " — " + S.firmaCargo);
  L.push(PROPS.whatsappPropio + " · " + PROPS.correoPropio);
  return L.join("\n");
}

// ─── Style helpers ───────────────────────────────────────────────────────────
function tabStyle(on) {
  return "padding:7px 14px;font-size:12.5px;font-weight:500;border:0;border-radius:6px;cursor:pointer;background:" + (on?"var(--tab-on-bg)":"transparent") + ";color:" + (on?"var(--tab-on-text)":"var(--tab-off-text)") + ";box-shadow:" + (on?"0 1px 3px rgba(0,0,0,0.18)":"none") + ";";
}
function rubroTabStyle(on) {
  return "padding:7px 14px;font-size:12.5px;font-weight:" + (on?"600":"500") + ";border-radius:7px;cursor:pointer;white-space:nowrap;color:var(" + (on?"--active-text":"--text2") + ");background:var(" + (on?"--active-bg":"--btn-bg") + ");border:1px solid var(" + (on?"--active-bdr":"--border") + ");";
}
function btnIAStyle(busy) {
  return "padding:8px 12px;font-size:11.5px;font-weight:500;white-space:nowrap;border-radius:6px;cursor:" + (busy?"default":"pointer") + ";color:" + (busy?"var(--text3)":"oklch(0.42 0.09 220)") + ";background:" + (busy?"var(--btn-bg)":"oklch(0.96 0.014 220)") + ";border:1px solid " + (busy?"var(--border)":"oklch(0.86 0.03 220)") + ";";
}

// ─── DOM helper ─────────────────────────────────────────────────────────────
function el(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) {
    Object.entries(attrs).forEach(([k,v]) => {
      if (k === "style" && typeof v === "string") e.style.cssText = v;
      else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "class") e.className = v;
      else if (k === "for") e.htmlFor = v;
      else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v);
    });
  }
  children.flat(Infinity).forEach(c => {
    if (c == null || c === false) return;
    if (typeof c === "string" || typeof c === "number") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}
function inp(value, attrs, onChange) {
  const input = el("input", Object.assign({ value }, attrs));
  input.addEventListener("input", onChange);
  return input;
}
function ta(value, attrs, onChange) {
  const t = el("textarea", attrs);
  t.value = value;
  t.addEventListener("input", onChange);
  return t;
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const R = getRubro();
  const porRubro = S.rubros.map(r => calcRubro(r));
  const v = calcRubro(R);
  const idxIncluidos = S.rubros.map((_,i) => i).filter(i => incluido(S.rubros[i], porRubro[i]));
  const G = calcGlobal(idxIncluidos.map(i => porRubro[i]));

  const detalleMats = (r) => r.mats.filter(x => x.desc).map(x => x.desc).join(" · ") || "Según detalle de planilla";
  const detalleMos = (r) => r.mos.filter(x => x.desc).map(x => x.desc).join(" · ") || "Según detalle de planilla";

  const app = document.getElementById("app");
  const newApp = el("div", { style: "min-height:100vh;" },

    // ── HEADER ────────────────────────────────────────────────────────────
    el("div", { class: "noprint", style: "position:sticky;top:0;z-index:20;display:flex;align-items:center;flex-wrap:wrap;gap:12px 22px;padding:13px 26px;background:var(--header-bg);border-bottom:1px solid var(--header-bdr);" },
      el("div", { style: "display:flex;flex-direction:column;gap:1px;" },
        el("div", { style: "font-size:15px;font-weight:700;letter-spacing:-0.01em;color:var(--text);" }, PROPS.empresa),
        el("div", { style: "font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.09em;text-transform:uppercase;color:var(--text3);" }, "Costos y presupuestos")
      ),
      el("button", { style: "padding:9px 14px;font-size:13px;font-weight:500;color:var(--btn-text);background:var(--btn-bg);border:1px solid var(--btn-bdr);border-radius:7px;cursor:pointer;white-space:nowrap;", onclick: () => { (window.top || window).location.href = "/admin/presupuestos"; } }, "← Solicitudes"),
      el("div", { style: "display:flex;gap:4px;padding:3px;background:var(--tab-wrap);border-radius:8px;" },
        el("button", { style: tabStyle(S.tab === "costos"), onclick: () => setState({tab:"costos"}) }, "Planilla de costos"),
        el("button", { style: tabStyle(S.tab === "propuesta"), onclick: () => setState({tab:"propuesta"}) }, "Hoja de propuesta")
      ),
      el("div", { style: "flex:1;" }),
      el("div", { style: "display:flex;align-items:baseline;gap:10px;padding:7px 14px;background:var(--btn-bg);border-radius:8px;border:1px solid var(--btn-bdr);" },
        el("span", { style: "font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.09em;text-transform:uppercase;color:var(--text3);" }, "Total al cliente"),
        el("span", { style: "font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;letter-spacing:-0.02em;white-space:nowrap;color:var(--text);" }, money(G.totalFinal))
      ),
      el("button", { class:"theme-toggle noprint", onclick: toggleTheme }, isDark() ? "☀️" : "🌙"),

          )
        )
      ),
      // Footer info
      el("div",{style:"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;padding:28px 0;margin-top:24px;border-top:1px solid #e6e2da;border-bottom:1px solid #e6e2da;"},
        infoBlock("Plazo de entrega", S.plazo),
        infoBlock("Forma de pago", S.pago),
        infoBlock("Validez de la oferta", S.validez)
      ),
      // Conditions
      el("div",{style:"padding:22px 0 0;"},
        el("div",{style:"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:#86817b;margin-bottom:8px;"}, "Condiciones"),
        el("div",{style:"font-size:11.5px;line-height:1.7;color:#6f6b64;white-space:pre-wrap;"}, PROPS.condiciones)
      ),
      // Signatures
      el("div",{style:"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:60px;padding-top:62px;"},
        el("div",{style:"display:flex;flex-direction:column;gap:7px;"},
          el("div",{style:"border-top:1px solid #1b1a18;"}),
          el("div",{style:"font-size:12.5px;font-weight:600;padding-top:2px;"}, S.firmaNombre),
          el("div",{style:"font-size:11.5px;color:#6f6b64;"}, S.firmaCargo),
          el("div",{style:"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:#86817b;padding-top:2px;"}, "Por " + PROPS.empresa)
        ),
        el("div",{style:"display:flex;flex-direction:column;gap:7px;"},
          el("div",{style:"border-top:1px solid #1b1a18;"}),
          el("div",{style:"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:#86817b;"}, "Conformidad del cliente")
        )
      )
    ),

    // Bottom actions
    el("div", { class: "noprint", style: "display:flex;flex-direction:column;gap:14px;align-items:center;margin:26px auto 0;max-width:820px;" },
      el("div",{style:"display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;"},
        el("button",{style:"padding:11px 20px;font-size:13px;font-weight:600;color:var(--cta-text);background:var(--cta-bg);border:0;border-radius:8px;cursor:pointer;",onclick:()=>window.print()}, "Imprimir / Guardar PDF"),
        el("button",{style:"padding:11px 20px;font-size:13px;font-weight:600;color:#ffffff;background:oklch(0.58 0.15 155);border:0;border-radius:8px;cursor:pointer;",onclick:()=>enviarWhatsapp(idxIncluidos, porRubro, G)}, S.waAviso||"Enviar por WhatsApp"),
        el("button",{style:"padding:11px 20px;font-size:13px;font-weight:600;color:#ffffff;background:oklch(0.52 0.16 255);border:0;border-radius:8px;cursor:pointer;",onclick:()=>enviarCorreo(idxIncluidos, porRubro, G)}, "Enviar por correo"),
        el("button",{style:"padding:11px 18px;font-size:13px;font-weight:500;color:var(--btn-text);background:var(--btn-bg);border:1px solid var(--btn-bdr);border-radius:8px;cursor:pointer;",onclick:()=>copiarResumen(idxIncluidos, porRubro, G)}, S.copiado?"Resumen copiado":"Copiar resumen")
      ),
      el("div",{style:"display:flex;align-items:center;gap:10px;font-size:12px;color:#86817b;text-align:center;"},
        el("span",{}, "El mensaje va con el resumen del presupuesto."),
        el("a",{href:"#",onclick:e=>{e.preventDefault();setState({tab:"costos"});}}, "Volver a la planilla")
      )
    )
  );
}

function rowPrint(label, color, value, topBorder) {
  return el("div",{style:"display:flex;align-items:baseline;justify-content:space-between;padding:6px 0;font-size:12.5px;" + (topBorder?"border-top:1px solid #e6e2da;":"")},
    el("span",{style:"color:"+color+";"},label),
    el("span",{style:"font-family:'IBM Plex Mono',monospace;white-space:nowrap;"},value)
  );
}

function infoBlock(label, value) {
  return el("div",{style:"display:flex;flex-direction:column;gap:4px;"},
    el("div",{style:"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:#86817b;"}, label),
    el("div",{style:"font-size:12.5px;"}, value || "—")
  );
}

function enviarWhatsapp(idxIncluidos, porRubro, G) {
  const txt = resumenTexto(idxIncluidos, porRubro, G);
  const q = "text=" + encodeURIComponent(txt);
  const url = "https://api.whatsapp.com/send?" + q;
  const win = window.open(url, "_blank");
  if (win) { try { win.opener=null; } catch(e){} return; }
  if (navigator.clipboard) navigator.clipboard.writeText(txt);
  setState({waAviso:"No se pudo abrir — resumen copiado"});
  setTimeout(()=>setState({waAviso:""}), 3000);
}

function enviarCorreo(idxIncluidos, porRubro, G) {
  const url = "mailto:" + (S.mailDestino||"") + "?cc=" + encodeURIComponent(PROPS.correoPropio) + "&subject=" + encodeURIComponent("Presupuesto " + PROPS.nroPresupuesto + " — " + (S.obra||S.cliente||"Trabajo")) + "&body=" + encodeURIComponent(resumenTexto(idxIncluidos, porRubro, G));
  const win = window.open(url, "_blank");
  if (win) { try { win.opener=null; } catch(e){} }
}

function copiarResumen(idxIncluidos, porRubro, G) {
  const txt = resumenTexto(idxIncluidos, porRubro, G);
  const done = () => { setState({copiado:true}); setTimeout(()=>setState({copiado:false}),2200); };
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done).catch(done); else done();
}

// ─── Boot ────────────────────────────────────────────────────────────────────
window.onerror = function(msg, src, line, col, err) {
  const d = document.getElementById("app");
  if (d) d.innerHTML = '<div style="padding:32px;color:#c0392b;font-family:monospace;font-size:13px;white-space:pre-wrap;background:#fff8f8;border:1px solid #e0b0b0;margin:20px;border-radius:8px;">Error: ' + msg + '\n' + src + ':' + line + ':' + col + (err?'\n'+err.stack:'') + '</div>';
};

render();
loadFromAPI().then(() => render());
</script>
</body>
</html>
