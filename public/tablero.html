<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<title>Tablero de Control</title>
<style>
  /* ── Admin dark theme tokens ── */
  :root{
    --bg:       #0c0e14;
    --bg2:      #0f1117;
    --bg3:      #131825;
    --card:     #111520;
    --border:   #1e2a3a;
    --border2:  #253347;
    --text:     #F4F7FB;
    --text2:    #C0CEDF;
    --text3:    #8094B4;
    --accent:   #2D8FCC;
    --accent2:  #1a6fa8;
    --orange:   #E8862B;
    --header:   #0d1019;
    --row-alt:  rgba(255,255,255,0.025);
    --row-sep:  rgba(255,255,255,0.06);
    --inp-bg:   #0f1420;
    --inp-bdr:  #253347;
    --btn-bg:   #131825;
    --btn-bdr:  #253347;
    --btn-text: #C0CEDF;
    --tab-sel:  #131825;
    --tab-bg:   transparent;
    --mes-sel-bg: #2D8FCC;
    --mes-sel-bd: #2D8FCC;
    --mes-off-bg: #131825;
    --mes-off-bd: #1e2a3a;
    --mes-off-tx: #8094B4;
  }
  html,body{margin:0;padding:0;background:var(--bg);font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif;color:var(--text);}
  *{box-sizing:border-box;}
  input,textarea,button,select{font-family:inherit;color:inherit;}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;}
  button{cursor:pointer;}
  /* scrollbar oscuro */
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
  @media print{
    [data-noprint]{display:none!important;}
    html,body{background:#fff!important;color:#000!important;}
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
    @page{size:A4 landscape;margin:8mm;}
    [data-scroll]{overflow:visible!important;}
    [data-scroll]>div{min-width:0!important;}
    [data-plan-row],[data-plan-head]{break-inside:avoid;}
    input,select{border:0!important;background:transparent!important;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
window.onerror=function(msg,src,line,col,err){
  document.getElementById('root').innerHTML='<div style="padding:40px;font-family:monospace;color:red;background:#fff;"><strong>Error en tablero.html:</strong><br>'+msg+'<br>'+src+':'+line+'</div>';
  return false;
};
const N=(v)=>{const n=parseFloat(String(v??'').replace(/\./g,'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0;};
const CICLO=['NO','SI','NA'];
const KEY='twg-tablero-v1';
const MESES_LIST=[['08','Agosto'],['09','Septiembre'],['10','Octubre'],['11','Noviembre'],['12','Diciembre']];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ESTADO_OPTS=['SIN CARGAR','PENDIENTE RELEVO','EN PRESUPUESTO','PENDIENTE APROBACION','EN EJECUCION','FINALIZADO','DE BAJA'];
const AVANCE_OPTS=['Pendiente','En Proceso','En Espera / Bloqueado','Finalizado'];

// ─── estado global ──────────────────────────────────
let S={
  tab:'dash', filtro:'', soloPend:false, mes:'08',
  tareas:[], planPer:'mes', planCli:'', planAnc:'', planCarp:'1',
  planNombres:{'1':'Planificación 1','2':'Planificación 2'},
  rows:[]
};

// ─── helpers ────────────────────────────────────────
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoyIso=()=>iso(new Date());
const aIso=v=>{const t=String(v||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(t))return t;const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(t);return m?m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2):'';};
const money=n=>'Gs. '+Math.abs(Math.round(n)).toLocaleString('es-PY');
const ciclo=v=>{const i=CICLO.indexOf(v);return CICLO[(i+1)%CICLO.length];};
const clave=r=>((r.nro||'').trim()||((r.trabajo||'').trim()+'|'+(r.cliente||'').trim())).toLowerCase();

const estadoDe=r=>{
  if(r.alerta==='DE BAJA')return 'DE BAJA';
  if(r.alerta==='APROBADO')return r.avance==='Finalizado'?'FINALIZADO':'EN EJECUCION';
  if(r.alerta==='ENVIADO')return 'PENDIENTE APROBACION';
  if(r.alerta==='FALTA PRESUPUESTAR')return 'EN PRESUPUESTO';
  if(r.alerta==='FALTA RELEVAR')return 'PENDIENTE RELEVO';
  if(!r.alerta)return 'SIN CARGAR';
  return 'EN REVISION';
};

const chipStyle=estado=>{
  const c={
    'FINALIZADO':['#48BB78','rgba(72,187,120,0.15)','rgba(72,187,120,0.3)'],
    'EN EJECUCION':['#6FC3F5','rgba(111,195,245,0.15)','rgba(111,195,245,0.3)'],
    'PENDIENTE APROBACION':['#F6C90E','rgba(246,201,14,0.15)','rgba(246,201,14,0.3)'],
    'EN PRESUPUESTO':['#C084FC','rgba(192,132,252,0.15)','rgba(192,132,252,0.3)'],
    'PENDIENTE RELEVO':['#E8862B','rgba(232,134,43,0.15)','rgba(232,134,43,0.3)'],
    'DE BAJA':['#7c7770','var(--bg3)','var(--border)'],
    'SIN CARGAR':['#8f8a83','var(--inp-bg)','var(--border2)'],
    'EN REVISION':['var(--text3)','var(--bg3)','var(--border)']
  }[estado]||['var(--text3)','var(--bg3)','var(--border)'];
  return `display:inline-block;padding:4px 9px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.05em;font-weight:600;border-radius:5px;color:${c[0]};background:${c[1]};border:1px solid ${c[2]};`;
};

const flagStyle=v=>{
  const c=v==='SI'?['#48BB78','rgba(72,187,120,0.15)','rgba(72,187,120,0.3)']:
    v==='NA'?['var(--text3)','var(--bg3)','var(--border)']:
    ['#FC8181','rgba(252,129,129,0.15)','rgba(252,129,129,0.3)'];
  return `margin:4px 6px;padding:6px 0;font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;border-radius:6px;cursor:pointer;color:${c[0]};background:${c[1]};border:1px solid ${c[2]};`;
};

const tabStyle=on=>`padding:7px 14px;font-size:12.5px;font-weight:500;border:0;border-radius:6px;cursor:pointer;background:${on?'var(--card)':'transparent'};color:${on?'var(--text)':'var(--text3)'};box-shadow:${on?'0 1px 3px rgba(0,0,0,0.4)':'none'};`;
const mesStyle=on=>`padding:7px 14px;font-size:12.5px;font-weight:${on?'600':'500'};border-radius:7px;cursor:pointer;white-space:nowrap;color:${on?'#ffffff':'var(--text2)'};background:${on?'var(--accent)':'var(--bg3)'};border:1px solid ${on?'var(--accent)':'var(--border)'};`;
const perStyle=on=>`padding:6px 12px;font-size:11.5px;font-weight:${on?'600':'500'};border:0;border-radius:6px;cursor:pointer;white-space:nowrap;color:${on?'var(--text)':'var(--text3)'};background:${on?'var(--card)':'transparent'};`;
const carpStyle=on=>`padding:6px 13px;font-size:11.5px;font-weight:${on?'600':'500'};border:0;border-radius:6px;cursor:pointer;white-space:nowrap;color:${on?'var(--text)':'var(--text3)'};background:${on?'var(--card)':'transparent'};`;

// ─── persistir ──────────────────────────────────────
function persistir(){
  try{localStorage.setItem(KEY,JSON.stringify({rows:S.rows,mes:S.mes,tareas:S.tareas,planNombres:S.planNombres}));}catch(e){}
}

function cargar(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const d=JSON.parse(raw);if(d.rows&&d.rows.length)S.rows=d.rows;if(d.mes)S.mes=d.mes;if(d.tareas)S.tareas=d.tareas;if(d.planNombres)S.planNombres=Object.assign({},S.planNombres,d.planNombres);}
  }catch(e){}
}

// ─── cargar desde API ───────────────────────────────
async function cargarDesdeAPI(){
  try{
    const res=await fetch('/api/presupuestos?limit=500');
    if(!res.ok)return;
    const data=await res.json();
    const items=data.presupuestos||[];
    const filaDeItem=item=>{
      const sd=(item.seguimientoData&&typeof item.seguimientoData==='object')?item.seguimientoData:{};
      const fecha=item.createdAt?item.createdAt.slice(0,10):'';
      const mes=sd.mes||item.createdAt.slice(0,7).replace('-','').slice(0,2);
      return {
        id:item.id, nro:item.code||'', fecha:fecha,
        cliente:item.customer?.name||'', local:sd.local||item.customer?.address||'',
        trabajo:item.serviceTitle||'',
        precio:String(item.finalValue||item.estimatedValue||0),
        vendido:String(sd.vendido||''),
        alerta:sd.alerta||'', avance:sd.avance||'Pendiente',
        os:sd.os||'NO', informe:sd.informe||'NO', facturado:sd.facturado||'NO',
        nroFactura:sd.nroFactura||'', tecnico:sd.tecnico||item.assignedTo||'',
        prioridad:sd.prioridad||'Normal', obs:sd.obs||'',
        pct:sd.pct||'', dias:sd.dias||'',
        _mes:item.createdAt?item.createdAt.slice(0,7):'', _id:item.id
      };
    };
    S.rows=items.map(filaDeItem);
    // cargar mes actual
    const ahora=new Date();
    S.mes=String(ahora.getMonth()+1).padStart(2,'0');
  }catch(e){console.warn('API no disponible, usando datos de localStorage',e);}
}

// ─── patchAPI ───────────────────────────────────────
async function patchAPI(itemId,seguimientoData){
  try{
    const r=S.rows.find(x=>x._id===itemId||x.id===itemId);
    if(!r)return;
    await fetch(`/api/presupuestos/${itemId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({seguimientoData})});
  }catch(e){}
}

function patchRow(id,fields){
  S.rows=S.rows.map(r=>{if(r.id!==id)return r;const u=Object.assign({},r,fields);return u;});
  persistir();
  const r=S.rows.find(x=>x.id===id);
  if(r&&r._id){const sd={alerta:r.alerta,avance:r.avance,os:r.os,informe:r.informe,facturado:r.facturado,nroFactura:r.nroFactura,tecnico:r.tecnico,prioridad:r.prioridad,obs:r.obs,pct:r.pct,dias:r.dias,vendido:Number(r.vendido)||0,local:r.local,mes:r._mes};patchAPI(r._id,sd);}
  render();
}

function setEstado(id,estado){
  const mapa={'FINALIZADO':{alerta:'APROBADO',avance:'Finalizado'},'EN EJECUCION':{alerta:'APROBADO',avance:'En Proceso'},'PENDIENTE APROBACION':{alerta:'ENVIADO',avance:'Pendiente'},'EN PRESUPUESTO':{alerta:'FALTA PRESUPUESTAR',avance:'Pendiente'},'PENDIENTE RELEVO':{alerta:'FALTA RELEVAR',avance:'Pendiente'},'DE BAJA':{alerta:'DE BAJA',avance:'Pendiente'},'SIN CARGAR':{alerta:'',avance:'Pendiente'}}[estado];
  if(!mapa)return;
  patchRow(id,mapa);
}

// ─── pasarPendientes ─────────────────────────────────
function pasarPendientes(){
  const orden=MESES_LIST.map(x=>x[0]);
  const i=orden.indexOf(S.mes);
  if(i<0||i>=orden.length-1)return;
  const dest=orden[i+1];
  const mover=S.rows.filter(r=>rowMes(r)===S.mes&&r.alerta!=='APROBADO'&&r.alerta!=='DE BAJA');
  if(!mover.length)return;
  const ya=new Set(S.rows.filter(r=>rowMes(r)===dest).map(clave));
  const idsMovidos=new Set(mover.map(r=>r.id));
  const nuevos=mover.filter(r=>!ya.has(clave(r))).map(r=>{
    const sd=Object.assign({},r,{id:'m'+dest+'-'+r.id,_mes:'2026-'+dest});
    const item=S.rows.find(x=>x.id===r.id);
    if(item&&item._id){patchAPI(item._id,{alerta:item.alerta,avance:item.avance,mes:'2026-'+dest,mesHistorial:[...(item.mesHistorial||[]),S._mes||'']});}
    return sd;
  });
  S.rows=S.rows.filter(r=>!idsMovidos.has(r.id)).concat(nuevos);
  S.mes=dest;
  persistir();
  render();
}

const rowMes=r=>{
  if(r._mes){const m=r._mes.split('-')[1];return m?m.replace(/^0/,'').padStart(2,'0'):S.mes;}
  return S.mes;
};

// ─── siguienteNro ────────────────────────────────────
function siguienteNro(){
  let max=0;
  S.rows.forEach(r=>{const m=/^P-2026-(\d+)$/.exec(String(r.nro||'').trim());if(m)max=Math.max(max,parseInt(m[1],10));});
  return 'P-2026-'+String(max+1).padStart(3,'0');
}

// ─── agregar nuevo presupuesto ───────────────────────
function nuevoPresupuesto(){
  const id='new-'+Date.now();
  const ahora=new Date().toLocaleDateString('es-PY');
  S.rows=[{id,nro:siguienteNro(),fecha:ahora,cliente:'',local:'',trabajo:'',precio:'0',vendido:'',alerta:'FALTA PRESUPUESTAR',avance:'Pendiente',os:'NO',informe:'NO',facturado:'NO',nroFactura:'',tecnico:'',prioridad:'Normal',obs:'',pct:'',dias:'',_mes:'2026-'+S.mes}].concat(S.rows);
  S.tab='lista';
  persistir();
  render();
}

// ─── HTML builders ──────────────────────────────────
function h(tag,attrs,...children){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='string'){el.style.cssText=v;}
    else if(k.startsWith('on')&&typeof v==='function'){el.addEventListener(k.slice(2).toLowerCase(),v);}
    else if(k==='className'){el.className=v;}
    else if(k==='type'){el.type=v;}
    else if(k==='value'&&(tag==='input'||tag==='select')){el.value=v;}
    else if(k==='placeholder'){el.placeholder=v;}
    else if(k==='title'){el.title=v;}
    else if(k==='size'){el.size=v;}
    else if(k==='data-noprint'){el.setAttribute('data-noprint','1');}
    else if(k==='data-scroll'){el.setAttribute('data-scroll','1');}
    else if(k==='data-plan-head'){el.setAttribute('data-plan-head','1');}
    else if(k==='data-plan-row'){el.setAttribute('data-plan-row','1');}
    else{try{el[k]=v;}catch(e){}}
  });
  children.flat(Infinity).forEach(c=>{
    if(c===null||c===undefined)return;
    if(typeof c==='string'||typeof c==='number'){el.appendChild(document.createTextNode(String(c)));}
    else{el.appendChild(c);}
  });
  return el;
}
const div=(s,...c)=>h('div',{style:s},...c);
const span=(s,...c)=>h('span',{style:s},...c);
const btn=(s,onClick,...c)=>h('button',{style:s,onClick},...c);
const inp=(s,value,onChange,extra={})=>h('input',Object.assign({style:s,value,onChange},extra));
const sel=(s,value,onChange,opts)=>{const el=h('select',{style:s,onChange});opts.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;if(v===value)o.selected=true;el.appendChild(o);});return el;};

// ─── render functions ────────────────────────────────
function renderHeader(){
  const mesDato=MESES_LIST.find(x=>x[0]===S.mes)||['',''];
  const rows=S.rows.filter(r=>rowMes(r)===S.mes);
  const aprobados=rows.filter(r=>r.alerta==='APROBADO');
  const aprobMonto=aprobados.reduce((a,r)=>a+N(r.precio),0);

  return div('position:sticky;top:0;z-index:20;display:flex;align-items:center;flex-wrap:wrap;gap:12px 20px;padding:13px 26px;background:var(--header);border-bottom:1px solid var(--border);',
    div('display:flex;flex-direction:column;gap:1px;min-width:150px;max-width:260px;overflow:hidden;',
      span('font-size:15px;font-weight:700;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;','Full Service & Clean'),
      span("font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.09em;text-transform:uppercase;color:var(--text3);",'Tablero de control · '+mesDato[1]+' 2026')
    ),
    div('display:flex;gap:4px;padding:3px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;',
      btn(tabStyle(S.tab==='dash'),()=>{S.tab='dash';render();},'Dashboard'),
      btn(tabStyle(S.tab==='lista'),()=>{S.tab='lista';render();},'Presupuestos'),
      btn(tabStyle(S.tab==='plan'),()=>{S.tab='plan';render();},'Planificación')
    ),
    div('display:flex;align-items:center;gap:6px;flex-wrap:wrap;',
      ...MESES_LIST.map(([num,nombre])=>{
        const n=rows.length; // simplified count
        const on=S.mes===num;
        return btn(mesStyle(on),()=>{S.mes=num;render();},nombre+(n&&on?' · '+n:''));
      })
    ),
    div('flex:1;'),
    div("display:flex;align-items:baseline;gap:10px;padding:7px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;",
      span("font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:0.09em;text-transform:uppercase;color:var(--text3);",'Aprobado'),
      span("font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;letter-spacing:-0.02em;white-space:nowrap;",money(aprobMonto))
    ),
    btn('padding:9px 14px;font-size:12.5px;font-weight:500;color:var(--text2);background:var(--bg3);border:1px solid var(--border);border-radius:7px;white-space:nowrap;',()=>window.print(),'Imprimir PDF')
  );
}

function renderDash(){
  const rows=S.rows.filter(r=>rowMes(r)===S.mes);
  const vivos=rows.filter(r=>r.alerta!=='DE BAJA');
  const aprobados=rows.filter(r=>r.alerta==='APROBADO');
  const cotizado=vivos.reduce((a,r)=>a+N(r.precio),0);
  const presupuestado=rows.reduce((a,r)=>a+N(r.precio),0);
  const aprobado=aprobados.reduce((a,r)=>a+N(r.precio),0);
  const facturadas=aprobados.filter(r=>r.facturado==='SI');
  const facturado=facturadas.reduce((a,r)=>a+N(r.precio),0);
  const cuenta=e=>rows.filter(r=>estadoDe(r)===e).length;

  // estados bar chart
  const estados=['PENDIENTE APROBACION','EN EJECUCION','FINALIZADO','DE BAJA','PENDIENTE RELEVO','EN PRESUPUESTO','SIN CARGAR'];
  const conteos=estados.map(e=>({label:e,n:cuenta(e)})).filter(x=>x.n>0);
  const maxN=Math.max(1,...conteos.map(x=>x.n));
  const colorEstado={'FINALIZADO':'#48BB78','EN EJECUCION':'#6FC3F5','PENDIENTE APROBACION':'#F6C90E','DE BAJA':'var(--text3)','PENDIENTE RELEVO':'#E8862B','EN PRESUPUESTO':'#C084FC','SIN CARGAR':'var(--border2)'};
  const bar=(frac,color)=>div('height:10px;background:var(--bg2);border-radius:5px;overflow:hidden;',div('height:100%;width:'+Math.max(2,Math.round(frac*100))+'%;background:'+color+';border-radius:5px;'));

  // cierre
  const cierre=[{label:'Orden de servicio',n:aprobados.filter(r=>r.os==='SI').length},{label:'Informe al cliente',n:aprobados.filter(r=>r.informe==='SI').length},{label:'Facturado',n:facturadas.length}];

  // por cliente
  const porCliente={};
  aprobados.forEach(r=>{const k=(r.cliente||'Sin cliente').trim();porCliente[k]=(porCliente[k]||0)+N(r.precio);});
  const clientes=Object.keys(porCliente).map(k=>({label:k,v:porCliente[k]})).sort((a,b)=>b.v-a.v).slice(0,6);
  const maxCli=Math.max(1,...clientes.map(x=>x.v));

  const kpiCard=(label,value,color='var(--text)')=>div('background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;',
    span("font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);",label),
    h('div',{style:"font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;letter-spacing:-0.02em;margin-top:8px;color:"+color+";"},value)
  );

  const kpiDark=(label,value,sub,color='var(--accent)')=>div('background:rgba(45,143,204,0.10);border:1px solid rgba(45,143,204,0.25);border-radius:10px;padding:20px;color:var(--text);',
    span("font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text3);",label),
    h('div',{style:"font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:600;letter-spacing:-0.02em;margin-top:8px;white-space:nowrap;color:"+color+";"},value),
    h('div',{style:'font-size:11.5px;color:var(--text3);margin-top:6px;'},sub)
  );

  const tasaCierre=cotizado>0?((aprobado/cotizado*100).toLocaleString('es-PY',{maximumFractionDigits:1})+'%'):'0%';

  return div('max-width:1520px;margin:0 auto;padding:26px;display:flex;flex-direction:column;gap:22px;',
    // fila 1: conteos

function renderPlan(){
  const carp=S.planCarp||'1';
  const espejo=carp==='1';
  const nombres=S.planNombres||{'1':'Planificación 1','2':'Planificación 2'};

  // items
  const aprobTodos=[];
  S.rows.forEach(r=>{if(r.alerta==='APROBADO')aprobTodos.push(Object.assign({},r,{fecha:aIso(r.fecha)||r._mes||''},{_mes:r._mes||''} ));});
  const tareas=espejo?aprobTodos:(S.tareas||[]).filter(t=>!t.bajaNro&&String(t.carp||'1')===carp);

  const hIso=hoyIso();
  const ancla=S.planAnc||hIso;
  const dAnc=new Date(ancla+'T12:00:00');
  const per=S.planPer||'mes';
  const rangoPlan=(()=>{
    if(per==='todo')return null;
    if(per==='dia')return[ancla,ancla];
    if(per==='semana'){const ini=new Date(dAnc);ini.setDate(ini.getDate()-((ini.getDay()+6)%7));const fin=new Date(ini);fin.setDate(fin.getDate()+6);return[iso(ini),iso(fin)];}
    if(per==='anio')return[dAnc.getFullYear()+'-01-01',dAnc.getFullYear()+'-12-31'];
    return[iso(new Date(dAnc.getFullYear(),dAnc.getMonth(),1)),iso(new Date(dAnc.getFullYear(),dAnc.getMonth()+1,0))];
  })();
  const dentro=f=>{if(!rangoPlan)return true;const v=String(f||'').trim();if(!v)return true;return v>=rangoPlan[0]&&v<=rangoPlan[1];};
  const clientesPlan=Array.from(new Set(tareas.map(t=>String(t.cliente||'').trim()).filter(Boolean))).sort();
  const planRows=tareas.filter(t=>dentro(t.fecha)).filter(t=>!S.planCli||String(t.cliente||'').trim()===S.planCli).filter(t=>!S.soloPend||t.avance!=='Finalizado').sort((a,b)=>String(a.fecha||'').localeCompare(String(b.fecha||'')));

  const setTareas=fn=>{S.tareas=fn(S.tareas||[]);persistir();render();};
  const patchTarea=(id,campo,valor)=>setTareas(arr=>arr.map(t=>t.id===id?Object.assign({},t,{[campo]:valor}):t));
  const patchEspejo=(id,campo,valor)=>{patchRow(id,{[campo]:valor});};

  const etiqueta=per==='dia'?('Día '+dAnc.getDate()+' de '+MESL[dAnc.getMonth()]+' '+dAnc.getFullYear()):per==='semana'?('Semana del '+(rangoPlan?new Date(rangoPlan[0]+'T12:00:00').getDate():'')+' al '+(rangoPlan?new Date(rangoPlan[1]+'T12:00:00').getDate():'')+' de '+MESL[dAnc.getMonth()]):per==='anio'?('Año '+dAnc.getFullYear()):per==='todo'?'Todas las tareas cargadas':(MESL[dAnc.getMonth()].charAt(0).toUpperCase()+MESL[dAnc.getMonth()].slice(1)+' '+dAnc.getFullYear());

  const planDias=planRows.reduce((a,r)=>a+N(r.dias||r.pct&&0),0);
  const conPct=planRows.filter(r=>String(r.pct||'').trim()!=='');
  const planPct=!conPct.length?'0 %':Math.round(conPct.reduce((a,r)=>a+N(r.pct),0)/conPct.length)+' %';

  const aprobados=S.rows.filter(r=>r.alerta==='APROBADO');
  const facturadoMonto=aprobados.filter(r=>r.facturado==='SI').reduce((a,r)=>a+N(r.precio),0);

          (()=>{const el=sel('padding:6px 8px;font-size:11.5px;background:var(--card);border:1px solid var(--border);border-radius:7px;',S.planCli||'',e=>{S.planCli=e.target.value;render();},[['','Todos los clientes'],...clientesPlan.map(c=>[c,c])]);return el;})(),
          btn('padding:7px 13px;font-size:12px;font-weight:600;color:var(--text);background:var(--accent2);border:1px solid var(--accent);border-radius:7px;white-space:nowrap;',()=>{
            setTareas(arr=>arr.concat([{id:'t'+Math.random().toString(36).slice(2,9),carp,fecha:ancla,nro:'',cliente:S.planCli||'',local:'',trabajo:'',tecnico:'',avance:'Pendiente',os:'NO',informe:'NO',facturado:'NO',nroFactura:'',obs:'',pct:'',dias:''}]));
          },'+ Agregar tarea'),
          btn('padding:7px 13px;font-size:12px;font-weight:500;border-radius:7px;white-space:nowrap;color:'+(S.soloPend?'var(--card)':'var(--text2)')+';background:'+(S.soloPend?'var(--text)':'var(--bg3)')+';border:1px solid '+(S.soloPend?'var(--text)':'var(--border)')+';',()=>{S.soloPend=!S.soloPend;render();},S.soloPend?'Mostrando pendientes':'Ver solo pendientes'),
          btn('padding:7px 13px;font-size:12px;font-weight:600;color:var(--card);background:var(--text);border:0;border-radius:7px;white-space:nowrap;',()=>{S.tab='plan';setTimeout(()=>window.print(),250);},'Imprimir'),
          span("font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text3);",planRows.length+' de '+tareas.length+' tareas')
        )
      ),
      // hayFuera
      ...(hayFuera?[btn('width:100%;padding:9px 20px;font-family:\'IBM Plex Mono\',monospace;font-size:10.5px;letter-spacing:0.05em;text-transform:uppercase;text-align:left;color:var(--accent);background:rgba(45,143,204,0.08);border:0;border-bottom:1px solid var(--border);cursor:pointer;',()=>{S.planPer='todo';S.planCli='';render();},(tareas.length-planRows.length)+' tareas fuera de este filtro — ver todas')]:[] ),
      // tabla
      h('div',{'data-scroll':'1',style:'overflow-x:auto;'},
        div('min-width:'+(espejo?'1500px':'900px')+';',
          h('div',{'data-plan-head':'1',style:'display:grid;grid-template-columns:'+planGrid+";background:var(--inp-bg);border-bottom:1px solid var(--border);font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);"},
            ...(espejo?hdrsEspejo:hdrsPlan2).map(t=>h('div',{style:'padding:9px 8px;'},t))
          ),
          ...planRows.map(renderPlanRow),
          planRows.length===0?h('div',{style:'padding:34px 20px;text-align:center;font-size:12.5px;color:var(--text3);'},'No hay tareas en '+etiqueta+'. Tocá "+ Agregar tarea" para cargar una, o cambiá el filtro de fecha.'):null
        )
      ),
      // footer
      div('display:flex;align-items:baseline;justify-content:flex-end;gap:14px;padding:14px 20px;background:var(--inp-bg);flex-wrap:wrap;',
        span('font-size:12px;color:var(--text3);','Días'),
        span("font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--text3);white-space:nowrap;",planDias+' días'),
        span('font-size:12px;color:var(--text3);margin-left:10px;','Avance total'),
        span("font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;white-space:nowrap;",planPct),
        ...(espejo?[
          span('font-size:12px;color:var(--text3);margin-left:10px;','Facturado'),
          span("font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--text3);white-space:nowrap;",money(facturadoMonto)),
          span('font-size:12px;color:var(--text3);margin-left:10px;','Por facturar'),
          span("font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;white-space:nowrap;",money(porFacturar))
        ]:[])
      )
    )
  );
}

function render(){
  const root=document.getElementById('root');
  while(root.firstChild)root.removeChild(root.firstChild);
  root.appendChild(h('div',{style:"font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif;color:var(--text);min-height:100vh;background:var(--bg);"},
    renderHeader(),
    S.tab==='dash'?renderDash():S.tab==='lista'?renderLista():renderPlan()
  ));
}

// ─── init ────────────────────────────────────────────
(async()=>{
  cargar();
  render(); // render immediately so page is never blank
  await cargarDesdeAPI();
  render(); // re-render with API data
})();
</script>
</body>
</html>
