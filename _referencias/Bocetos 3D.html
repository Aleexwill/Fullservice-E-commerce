<head>

<title>Bocetos 3D — TWG Full Service</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"

}

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f4f3f0; font-family: 'IBM Plex Sans', Helvetica, Arial, sans-serif; color: #1b1a18; }
  * { box-sizing: border-box; }
  three-d-stage:not(:defined) { visibility: hidden; }
  button, input, select { font-family: inherit; color: inherit; }
  input:focus, select:focus { outline: 2px solid oklch(0.50 0.11 240); outline-offset: -1px; }
  .app { display: grid; grid-template-columns: 214px minmax(0, 1fr) 200px; height: 100vh; }
  /* Pantalla completa: las dos columnas se esconden y el visor toma todo el ancho */
  .app.full { grid-template-columns: minmax(0, 1fr); }
  .app.full .col { display: none; }
  .col { overflow-y: auto; background: #ffffff; }
  .col.izq { border-right: 1px solid #dedbd5; }
  .col.der { border-left: 1px solid #dedbd5; }
  .rot { font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 0.09em; text-transform: uppercase; color: #86817b; }
  .plant { display: block; width: 100%; text-align: left; padding: 6px 9px; margin-bottom: 3px; font-size: 11px; font-weight: 500; background: #faf9f7; border: 1px solid #dedbd5; border-radius: 8px; cursor: pointer; }
  .plant.on { font-weight: 600; color: #ffffff; background: #1b1a18; border-color: #1b1a18; }
  .campo { display: grid; grid-template-columns: minmax(0, 1fr) 62px; align-items: center; gap: 6px; padding: 3px 0; font-size: 11px; }
  .campo input { width: 100%; padding: 4px 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-align: right; background: #ffffff; border: 1px solid #dedbd5; border-radius: 6px; }
  .campo .u { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: #86817b; }
  .sw { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; font-size: 11px; }
  .sw button { padding: 5px 11px; font-size: 11.5px; font-weight: 600; border-radius: 20px; cursor: pointer; }
  .acc { width: 100%; padding: 7px; margin-top: 5px; font-size: 11px; font-weight: 600; border-radius: 8px; cursor: pointer; }
  .mat { display: grid; grid-template-columns: minmax(0, 1fr) 48px 32px; gap: 5px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid #efedea; font-size: 10.5px; }
  .mat b { font-family: 'IBM Plex Mono', monospace; font-size: 11px; text-align: right; }
  .mat i { font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; font-style: normal; color: #86817b; }
  .vista { padding: 5px 0; font-size: 10.5px; font-weight: 600; background: #ffffff; border: 1px solid #dedbd5; border-radius: 7px; cursor: pointer; }
  @media (max-width: 1100px) {
    .app { grid-template-columns: 1fr; height: auto; }
    .col { max-height: none; }
    .col.izq, .col.der { border: 0; border-top: 1px solid #dedbd5; }
    .escena { position: static !important; height: 76vh; min-height: 380px; }
    /* La barra queda debajo de la escena: hay que dejarle su lugar dentro de la ventana */
    .app.full .escena { height: calc(100vh - 86px); min-height: 320px; }
    /* La barra sale del apilado absoluto: en fila arriba de la escena, sin invadir la columna de plantillas */
    /* La barra queda fija al pie y por encima de los paneles: si no, el panel
       de selección la tapaba entera y no se podía tocar ninguna herramienta. */
    #barra { position: fixed !important; left: 12px !important; right: 12px !important; top: auto !important; bottom: 8px !important; flex-direction: row !important; flex-wrap: wrap !important; justify-content: center; max-height: none !important; z-index: 40; }
    #paleta, #carpeta, #ventanaImg, #biblioteca, #panelPieza { position: fixed !important; left: 12px !important; right: 12px !important; top: auto !important; bottom: 58px !important; width: auto !important; max-height: 42vh !important; z-index: 30; }
    .app > div:nth-child(2) { order: -1; position: sticky; top: 0; z-index: 5; background: #eceae5; }
  }
</style>

    <button class="acc" id="guardar" style="color: #ffffff; background: oklch(0.50 0.13 150); border: 0;">Guardar boceto</button>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px;">
      <button class="acc" id="abrir" style="margin: 0; background: #f0eee9; border: 1px solid #dedbd5;">Abrir</button>

    </div>
    <div style="position: absolute; left: 12px; top: 12px; display: flex; gap: 3px; padding: 3px; background: rgba(255,255,255,0.94); border: 1px solid #dedbd5; border-radius: 9px;">
      <button class="vista" style="padding: 5px 9px;" data-v="perspectiva">Perspectiva</button>
      <button class="vista" style="padding: 5px 9px;" data-v="frente">Frente</button>
      <button class="vista" style="padding: 5px 9px;" data-v="lateral">Lateral</button>
      <button class="vista" style="padding: 5px 9px;" data-v="planta">Planta</button>
      <button class="vista" style="padding: 5px 9px;" data-v="ojo">A nivel de ojo</button>
      <button class="vista" style="padding: 5px 9px;" data-v="foto">Guardar imagen</button>
    </div>
    <div style="position: absolute; left: 12px; top: 52px; display: flex; align-items: center; gap: 3px; padding: 3px; background: rgba(255,255,255,0.94); border: 1px solid #dedbd5; border-radius: 9px;">
      <label style="display: flex; align-items: center; gap: 5px; padding: 0 8px; font-size: 11px; color: #6f6b64;">Paso
        <input id="paso" value="10" inputmode="numeric" style="width: 46px; padding: 5px 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; text-align: right; background: #ffffff; border: 1px solid #dedbd5; border-radius: 6px;" /> cm
      </label>
      <button class="vista" id="ampliarVista" style="padding: 5px 9px;">Pantalla completa</button>
      <button class="vista" id="exportarBtn" style="padding: 5px 9px;">Exportar 3D</button>
    </div>
    <div id="barra" style="position: absolute; left: 12px; top: 96px; display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; max-height: min(420px, calc(100% - 110px)); overflow-y: auto; gap: 3px; padding: 5px; background: rgba(255,255,255,0.96); border: 1px solid #dedbd5; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.08);"></div>
    <div id="paleta" style="display: none; position: absolute; left: 50px; top: 96px; width: 132px; padding: 8px; background: rgba(255,255,255,0.97); border: 1px solid #dedbd5; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,0.08);"></div>

    <div id="ventanaImg" style="display: none; position: absolute; left: 50px; top: 96px; width: 246px; max-height: calc(100% - 140px); overflow-y: auto; padding: 10px 11px; background: rgba(255,255,255,0.98); border: 1px solid #dedbd5; border-radius: 11px; box-shadow: 0 6px 22px rgba(0,0,0,0.12);"></div>
    <div id="biblioteca" style="display: none; position: absolute; left: 50px; top: 96px; width: 240px; max-height: calc(100% - 140px); overflow-y: auto; padding: 10px 11px; background: rgba(255,255,255,0.98); border: 1px solid #dedbd5; border-radius: 11px; box-shadow: 0 6px 22px rgba(0,0,0,0.12);"></div>

    <div id="lazo" style="display: none; position: absolute; pointer-events: none; border: 1.5px solid #2f6df6; background: rgba(47,109,246,0.12); border-radius: 3px; z-index: 12;"></div>

    <div id="avisoComputo" style="margin-top: 8px; font-size: 11px; line-height: 1.5; color: #86817b;">El cómputo sale de las medidas. En la planilla de costos, el botón “Traer del boceto” lo carga como filas de material.</div>

<script src="./three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('#stage');
const { THREE } = await stage.ready;
// Los botones de descarga del visor tapan el dibujo: quedan guardados
// detrás de "Exportar 3D" y solo aparecen cuando hacen falta.
let verExport = false;
function estiloExport() {
  if (stage._toolbar) stage._toolbar.style.display = verExport ? 'flex' : 'none';
  const b = document.querySelector('#exportarBtn');
  if (!b) return;
  b.style.cssText = 'padding: 5px 9px; font-size: 10.5px; font-weight: 600; border-radius: 7px; cursor: pointer; border: 1px solid ' + (verExport ? '#1b1a18' : '#dedbd5') + '; color: ' + (verExport ? '#ffffff' : '#1b1a18') + '; background: ' + (verExport ? '#1b1a18' : '#ffffff') + ';';
}
estiloExport();
document.querySelector('#exportarBtn').onclick = () => { verExport = !verExport; estiloExport(); };
const CM = 0.01;

const M = {};
const mat = (n, c, r, m) => { if (!M[n]) { M[n] = new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m || 0 }); M[n].name = n; } return M[n]; };

// ————— texturas dibujadas al vuelo, para que los materiales se vean reales —————
function lienzo(w, h, fn) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  fn(c.getContext('2d'), w, h);
  const tx = new THREE.CanvasTexture(c);
  tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
  if (THREE.SRGBColorSpace) tx.colorSpace = THREE.SRGBColorSpace;
  return tx;
}
const ruido = (x, w, h, n, cols, r) => {
  for (let i = 0; i < n; i++) {
    x.fillStyle = cols[(Math.random() * cols.length) | 0];
    x.beginPath(); x.arc(Math.random() * w, Math.random() * h, Math.random() * r + 0.6, 0, 6.3); x.fill();
  }
};
const TEX = {
  madera: (base, vetas) => lienzo(256, 256, (x, w, h) => {
    x.fillStyle = base; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) {
      x.strokeStyle = 'rgba(0,0,0,' + (0.02 + Math.random() * 0.06) + ')';
      x.lineWidth = 0.4 + Math.random() * 1.2;
      const y = Math.random() * h;
      x.beginPath(); x.moveTo(0, y);
      x.bezierCurveTo(w * 0.35, y + (Math.random() * 7 - 3.5), w * 0.7, y + (Math.random() * 7 - 3.5), w, y + (Math.random() * 5 - 2.5));
      x.stroke();
    }
    for (let i = 0; i < 6; i++) {
      x.fillStyle = 'rgba(0,0,0,0.10)';
      x.beginPath(); x.ellipse(Math.random() * w, Math.random() * h, 3 + Math.random() * 4, 2 + Math.random() * 3, Math.random() * 3, 0, 6.3); x.fill();
    }
    x.strokeStyle = vetas; x.lineWidth = 2.4;
    for (let i = 1; i < 6; i++) { const y = h / 6 * i; x.beginPath(); x.moveTo(0, y); x.lineTo(w, y); x.stroke(); }
  }),
  piedra: () => lienzo(256, 256, (x, w, h) => {
    x.fillStyle = '#9d958a'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 46; i++) {
      const cx = Math.random() * w, cy = Math.random() * h, r = 14 + Math.random() * 26;
      x.fillStyle = ['#a9a196', '#8f887d', '#b4ac9f', '#7e786f', '#c0b8a9'][(Math.random() * 5) | 0];
      x.beginPath();
      for (let k = 0; k < 7; k++) {
        const a = k / 7 * 6.283, rr = r * (0.6 + Math.random() * 0.5);
        k ? x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr) : x.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
      }
      x.closePath(); x.fill();
      x.strokeStyle = 'rgba(60,56,50,0.35)'; x.lineWidth = 1.4; x.stroke();
    }
    ruido(x, w, h, 400, ['rgba(255,255,255,0.05)', 'rgba(0,0,0,0.05)'], 1.4);
  }),
  ladrillo: () => lienzo(256, 256, (x, w, h) => {
    x.fillStyle = '#b9a68f'; x.fillRect(0, 0, w, h);
    const fh = h / 8;
    for (let f = 0; f < 8; f++) {
      const off = (f % 2) * 32;
      for (let c = -1; c < 5; c++) {
        x.fillStyle = ['#a0512f', '#95492b', '#ab5b38', '#8d4527', '#b06340'][(Math.random() * 5) | 0];
        x.fillRect(c * 64 + off + 2, f * fh + 2, 60, fh - 4);
      }
    }
    ruido(x, w, h, 500, ['rgba(0,0,0,0.06)', 'rgba(255,255,255,0.05)'], 1.3);
  }),
  cesped: () => lienzo(256, 256, (x, w, h) => {
    x.fillStyle = '#6d8046'; x.fillRect(0, 0, w, h);
    ruido(x, w, h, 2600, ['#5d7239', '#7b8c50', '#87965b', '#54682f', '#93a06a'], 2.2);
  }),
  arena: () => lienzo(256, 256, (x, w, h) => {
    x.fillStyle = '#c8b28d'; x.fillRect(0, 0, w, h);
    ruido(x, w, h, 2200, ['#bda781', '#d3bf9c', '#b09a75', '#dcc9a8'], 1.8);
  }),
  agua: () => lienzo(256, 256, (x, w, h) => {
    const g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#3f7590'); g.addColorStop(1, '#57889d');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++) {
      x.strokeStyle = 'rgba(255,255,255,' + (0.03 + Math.random() * 0.10) + ')';
      x.lineWidth = 0.6 + Math.random() * 1.6;
      const y = Math.random() * h;
      x.beginPath(); x.moveTo(0, y);
      x.bezierCurveTo(w * 0.3, y - 3, w * 0.6, y + 3, w, y); x.stroke();
    }
  }),
  cana: () => lienzo(256, 256, (x, w, h) => {
    x.fillStyle = '#8e8a70'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 26; i++) {
      const cx = i * (w / 26);
      x.fillStyle = ['#9d9878', '#8a8568', '#a8a488', '#7c7860'][(i % 4)];
      x.fillRect(cx, 0, w / 26 - 1, h);
      x.strokeStyle = 'rgba(0,0,0,0.22)'; x.lineWidth = 1;
      x.beginPath(); x.moveTo(cx, 0); x.lineTo(cx, h); x.stroke();
    }
    x.strokeStyle = 'rgba(50,46,38,0.35)'; x.lineWidth = 2.6;
    for (let k = 1; k < 4; k++) { const y = h / 4 * k; x.beginPath(); x.moveTo(0, y); x.lineTo(w, y); x.stroke(); }
  }),
  revoque: () => lienzo(256, 256, (x, w, h) => {
    x.fillStyle = '#d6c7a4'; x.fillRect(0, 0, w, h);
    ruido(x, w, h, 1800, ['rgba(0,0,0,0.035)', 'rgba(255,255,255,0.05)', '#cbbb98'], 2.4);
  }),
  cemento: () => lienzo(256, 256, (x, w, h) => {
    x.fillStyle = '#8f8b85'; x.fillRect(0, 0, w, h);
    ruido(x, w, h, 1700, ['rgba(0,0,0,0.05)', 'rgba(255,255,255,0.05)', '#847f79'], 2.6);
  }),
  tela: () => lienzo(128, 128, (x, w, h) => {
    x.fillStyle = '#ddd8cd'; x.fillRect(0, 0, w, h);
    x.strokeStyle = 'rgba(0,0,0,0.05)';
    for (let i = 0; i < w; i += 3) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, h); x.stroke(); }
    for (let i = 0; i < h; i += 3) { x.beginPath(); x.moveTo(0, i); x.lineTo(w, i); x.stroke(); }
  })
};
const conTex = (n, hacer, rep, r, met, color) => {
  if (!M[n]) {
    const tx = hacer(); tx.repeat.set(rep[0], rep[1]);
    M[n] = new THREE.MeshStandardMaterial({ map: tx, roughness: r, metalness: met || 0, color: color || 0xffffff });
    M[n].name = n;
  }
  return M[n];
};

const madera = () => conTex('madera', () => TEX.madera('#8a5a33', 'rgba(60,36,18,0.45)'), [2, 2], 0.68);
const maderaOsc = () => conTex('madera oscura', () => TEX.madera('#4e372a', 'rgba(24,14,8,0.5)'), [2, 2], 0.74);
const hierro = () => mat('hierro negro', 0x26251f, 0.42, 0.45);
const blanco = () => mat('hierro blanco', 0xe8e5de, 0.5, 0.35);
const tela = () => conTex('tela', TEX.tela, [3, 3], 0.86);
const piedra = () => conTex('hormigon', TEX.piedra, [3, 3], 0.9);
const cesped = () => conTex('cesped', TEX.cesped, [26, 18], 0.95);
const agua = () => conTex('agua', TEX.agua, [8, 5], 0.18, 0.35);
const revoque = () => conTex('revoque', TEX.revoque, [4, 3], 0.9);
const ladrillo = () => conTex('ladrillo', TEX.ladrillo, [4, 4], 0.92);
const cana = () => conTex('caña', TEX.cana, [1, 3], 0.88);
const arena = () => conTex('arena', TEX.arena, [14, 3], 0.95);
const junco = () => mat('junco', 0xb9a271, 0.95);
const cemento = () => conTex('cemento alisado', TEX.cemento, [8, 5], 0.88);
const vidrio = () => {
  if (!M['vidrio']) {
    M['vidrio'] = new THREE.MeshStandardMaterial({ color: 0xa8c6ce, roughness: 0.06, metalness: 0.22, transparent: true, opacity: 0.34 });
    M['vidrio'].name = 'vidrio';
  }
  return M['vidrio'];
};

const caja = (n, w, h, d, x, y, z, m, ry) => {
  const o = new THREE.Mesh(new THREE.BoxGeometry(Math.max(w, 0.005), Math.max(h, 0.005), Math.max(d, 0.005)), m);
  o.name = n; o.position.set(x, y, z); if (ry) o.rotation.y = ry;
  return o;
};

// ————— plantillas —————
// cada una declara sus medidas en cm y devuelve {grupo, materiales}
const PLANTILLAS = {
  local: {
    nombre: 'Local San Bernardino',
    campos: [
      ['largo', 'Largo del salón', 2000],
      ['ancho', 'Ancho del salón', 900],
      ['alto', 'Alto del salón', 320],
      ['pergola', 'Largo de la galería', 1800],
      ['volado', 'Volado de la galería', 430],
      ['porticos', 'Pórticos blancos', 4],
      ['pasarela', 'Largo de la pasarela', 1500],
      ['cerco', 'Largo del cerco de caña', 2800]
    ],
    opciones: [
      ['interior', 'Mobiliario interior', true], ['luces', 'Guirnaldas de luces', true],
      ['cercoOn', 'Cerco de caña', true], ['lago', 'Lago y costa', true], ['eucaliptos', 'Eucaliptos', true]
    ],
    build(v, g, mats) {
      const G = (n) => { const q = new THREE.Group(); q.name = n; g.add(q); return q; };
      const cj = (n, w, h, d, x, y, z, m, ry) => caja(n, w * CM, h * CM, d * CM, x * CM, y * CM, z * CM, m, ry);
      const cil = (n, r, h, x, y, z, m) => {
        const o = new THREE.Mesh(new THREE.CylinderGeometry(r * CM, r * CM, h * CM, 10), m);
        o.name = n; o.position.set(x * CM, y * CM, z * CM); return o;
      };
      const L = v.largo, A = v.ancho, H = v.alto, PB = 45;
      const PL = v.pergola, V = v.volado, HG = 300;
      const zFach = A / 2, zGal = zFach + V;
      const dxEnt = L * 0.16;

      // ————— terreno, lago y costa —————
      const suelo = G('Terreno y lago');
      suelo.add(cj('terreno', 4800, 20, 2800, 0, -12, 700, cesped()));
      if (v.lago) {
        const zC = zGal + 900;
        suelo.add(cj('arena de la costa', 4800, 14, 280, 0, 0, zC + 140, arena()));
        suelo.add(cj('agua del lago', 4800, 12, 1700, 0, -6, zC + 1130, agua()));
        for (let i = 0; i < 32; i++) {
          const x = -2300 + i * 148;
          suelo.add(cj('junco ' + (i + 1), 6, 90, 6, x, 45, zC + 300 + (i % 3) * 22, junco()));
        }
        for (let i = 0; i < 8; i++) suelo.add(cj('piedra de la orilla ' + (i + 1), 70, 45, 60, -1500 + i * 400, 20, zC + 110, piedra()));
      }

      // ————— plataforma y salón —————
      const sal = G('Salón');
      sal.add(cj('plataforma de piedra', L + 320, PB, A + 340, 0, PB / 2, 70, piedra()));
      sal.add(cj('piso del salón', L, 10, A, 0, PB + 5, 0, cemento()));
      sal.add(cj('pared posterior', L, H, 22, 0, PB + H / 2, -A / 2, revoque()));
      sal.add(cj('pared de ladrillo', 22, H, A, -L / 2, PB + H / 2, 0, ladrillo()));
      sal.add(cj('pared lateral derecha', 22, H, A, L / 2, PB + H / 2, 0, revoque()));
      sal.add(cj('depósito de servicio', 430, H * 0.8, 360, -L / 2 - 215, PB + H * 0.4, -A / 2 - 120, revoque()));
      sal.add(cj('antepecho de la fachada', L, 90, 22, 0, PB + 45, zFach, revoque()));
      sal.add(cj('vidrio de la fachada', L, H - 90, 8, 0, PB + 90 + (H - 90) / 2, zFach, vidrio()));
      const np = Math.max(2, Math.round(L / 150));
      for (let i = 0; i <= np; i++) {
        sal.add(cj('parante de la fachada ' + (i + 1), 9, H - 90, 15, -L / 2 + (L / np) * i, PB + 90 + (H - 90) / 2, zFach, hierro()));
      }
      sal.add(cj('travesaño de la fachada', L, 9, 15, 0, PB + 90 + (H - 90) * 0.58, zFach, hierro()));
      sal.add(cj('marco de la puerta', 250, H - 90, 18, dxEnt, PB + 90 + (H - 90) / 2, zFach + 4, hierro()));
      sal.add(cj('puerta de vidrio corrediza', 234, H - 106, 6, dxEnt, PB + 90 + (H - 90) / 2, zFach + 6, vidrio()));
      sal.add(cj('losa de techo', L + 44, 18, A + 44, 0, PB + H + 9, 0, revoque()));
      const nl = Math.max(2, Math.round(L / 15));
      for (let i = 0; i < nl; i++) {
        sal.add(cj('listón del parapeto ' + (i + 1), 11, 95, 5, -L / 2 + 8 + i * (L / nl), PB + H + 18 + 47, -A / 2 + 14, maderaOsc()));
      }
      mats.push(['Piso de salón', 'm2', +(L * A / 10000).toFixed(1)]);
      mats.push(['Vidrio de fachada con perfilería', 'm2', +(L * (H - 90) / 10000).toFixed(1)]);
      mats.push(['Listón de parapeto 11 cm x 95 cm', 'un', nl]);

      // ————— galería con listones de madera —————
      const gal = G('Galería de listones');
      const nc = Math.max(2, Math.round(PL / 400) + 1);
      for (let i = 0; i < nc; i++) {
        const x = -PL / 2 + (PL / (nc - 1)) * i;
        gal.add(cj('columna de la galería ' + (i + 1), 13, HG, 13, x, PB + HG / 2, zGal, hierro()));
        gal.add(cj('travesaño de la galería ' + (i + 1), 13, 19, V, x, PB + HG + 10, zFach + V / 2, hierro()));
      }
      gal.add(cj('viga frontal de la galería', PL, 21, 13, 0, PB + HG + 10, zGal, hierro()));
      gal.add(cj('viga sobre la fachada', PL, 21, 13, 0, PB + HG + 10, zFach + 12, hierro()));
      const ng = Math.max(2, Math.round(PL / 14));
      for (let i = 0; i < ng; i++) {
        gal.add(cj('listón de la galería ' + (i + 1), 9, 5, V, -PL / 2 + 6 + i * (PL / ng), PB + HG + 23, zFach + V / 2, madera()));
      }
      mats.push(['Columna metálica de galería', 'un', nc]);
      mats.push(['Estructura metálica de galería', 'm', +((PL * 2 + V * nc) / 100).toFixed(1)]);
      mats.push(['Listón de galería 9 cm — ' + v.volado + ' cm', 'un', ng]);

      // ————— pórticos blancos sobre el césped —————
      const por = G('Pórticos blancos');
      const nb = Math.max(1, Math.round(v.porticos));
      const z1 = zGal + 180, z2 = z1 + 560, HP = 260, pasoX = 560;
      const xs = [];
      for (let i = 0; i <= nb; i++) xs.push(-PL / 2 + i * pasoX);
      xs.forEach((x, i) => [z1, z2].forEach((z, j) => {
        por.add(cil('columna blanca ' + (i + 1) + '-' + (j + 1), 5.5, HP, x, HP / 2, z, blanco()));
      }));
      [z1, z2].forEach((z, j) => por.add(cj('tubo longitudinal ' + (j + 1), xs[nb] - xs[0], 9, 9, (xs[0] + xs[nb]) / 2, HP, z, blanco())));
      xs.forEach((x, i) => por.add(cj('tubo transversal ' + (i + 1), 9, 9, z2 - z1, x, HP, (z1 + z2) / 2, blanco())));
      mats.push(['Pórtico metálico blanco', 'un', nb]);
      mats.push(['Caño estructural blanco', 'm', +(((xs[nb] - xs[0]) * 2 + (z2 - z1) * (nb + 1) + HP * (nb + 1) * 2) / 100).toFixed(1)]);
      if (v.luces) {
        const luz = mat('foco', 0xf6e6b4, 0.4);
        let k = 0;
        [z1, z2].forEach(z => {
          for (let x = xs[0]; x <= xs[nb]; x += 70) {
            const b = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), luz);
            b.name = 'foco de guirnalda ' + (++k);
            b.position.set(x * CM, (HP - 18) * CM, z * CM);
            por.add(b);
          }
        });
        mats.push(['Guirnalda de luces con focos', 'm', +(((xs[nb] - xs[0]) * 2) / 100).toFixed(1)]);
      }

      // ————— pasarela de madera y camino de piedra —————
      // La pasarela llega desde el costado derecho y desemboca en la puerta,
      // como en las fotos: corre paralela a la fachada, no hacia el agua.
      const acc = G('Acceso');
      const largoPas = v.pasarela, zPas = zGal + 150, xIni = L / 2 + 420;
      const nt = Math.max(2, Math.round(largoPas / 12));
      for (let i = 0; i < nt; i++) {
        acc.add(cj('tabla de la pasarela ' + (i + 1), 11, 5, 190, xIni - i * (largoPas / nt), 20, zPas, maderaOsc()));
      }
      acc.add(cj('tramo de la pasarela hacia la puerta', 190, 5, zPas - zFach - V - 20, dxEnt, 20, (zPas + zFach + V) / 2, maderaOsc()));
      [-118, 118].forEach((dz, i) => {
        acc.add(cj('macetero de hormigón ' + (i + 1), 46, 52, 46, xIni - 40, 26, zPas + dz, piedra()));
        for (let k = 0; k < 5; k++) {
          acc.add(cj('planta del macetero', 5, 62, 5, xIni - 52 + k * 6, 78, zPas + dz, mat('follaje', 0x5f7a44, 0.95), (k - 2) * 0.14));
        }
      });
      acc.add(cj('camino de piedra laja', 540, 8, 430, xIni + 330, 6, zPas, piedra()));
      acc.add(cj('escalón de acceso', 300, 22, 60, dxEnt, PB - 11, zFach + V + 30, piedra()));
      mats.push(['Tabla de pasarela 190 cm', 'un', nt]);
      mats.push(['Macetero de hormigón', 'un', 2]);
      mats.push(['Camino de piedra laja', 'm2', +(540 * 430 / 10000).toFixed(1)]);

      // ————— cerco de caña sobre muro de piedra —————
      if (v.cercoOn) {
        const cer = G('Cerco de caña');
        const xC = -L / 2 - 520, largoC = v.cerco, zC0 = -A / 2 - 150;
        cer.add(cj('muro de piedra del cerco', 32, 45, largoC, xC, 22, zC0 + largoC / 2, piedra()));
        const ncn = Math.round(largoC / 9);
        for (let i = 0; i < ncn; i++) {
          cer.add(cil('caña ' + (i + 1), 3.2, 180 + (i % 3) * 8, xC, 45 + 90, zC0 + 5 + i * 9, cana()));
        }
        cer.add(cj('travesaño del cerco', 8, 8, largoC, xC - 8, 190, zC0 + largoC / 2, hierro()));
        mats.push(['Muro de piedra del cerco', 'm', +(largoC / 100).toFixed(1)]);
        mats.push(['Caña tacuara 180 cm', 'un', ncn]);
      }

      // ————— kiosco —————
      const kio = G('Kiosco');
      const xK = -L / 2 - 120, zK = zGal + 900;
      kio.add(cj('cuerpo del kiosco', 230, 210, 200, xK, 105, zK, blanco()));
      kio.add(cj('techo del kiosco', 260, 12, 230, xK, 217, zK, hierro()));
      kio.add(cj('mostrador del kiosco', 240, 10, 45, xK, 120, zK + 118, maderaOsc()));
      mats.push(['Kiosco de atención', 'un', 1]);

      // ————— eucaliptos —————
      if (v.eucaliptos) {
        const arb = G('Eucaliptos');
        const pos = [[-L / 2 - 700, zGal + 520], [L / 2 + 520, zGal + 300], [-260, zGal + 1000], [L / 2 + 900, -A / 2 - 400], [-L / 2 - 900, -A / 2 - 700]];
        pos.forEach(([x, z], i) => {
          arb.add(cil('tronco de eucalipto ' + (i + 1), 15, 860 + i * 40, x, 430, z, mat('corteza', 0x9c9083, 0.95)));
          [0, 1, 2].forEach(k => {
            const c = new THREE.Mesh(new THREE.SphereGeometry((1.7 - k * 0.28), 14, 10), mat('follaje', 0x5f7a44, 0.95));
            c.name = 'follaje ' + (i + 1) + '-' + (k + 1);
            c.position.set((x + (k - 1) * 90) * CM, (830 + k * 60) * CM, (z + (k % 2 ? 70 : -60)) * CM);
            c.scale.y = 0.75; arb.add(c);
          });
        });
      }

      // ————— mobiliario interior —————
      if (v.interior) {
        const int = G('Mobiliario interior');
        int.add(cj('barra', 420, 105, 60, -L / 2 + 300, PB + 52, -A / 2 + 80, maderaOsc()));
        int.add(cj('tapa de la barra', 440, 8, 72, -L / 2 + 300, PB + 108, -A / 2 + 80, madera()));
        const barril = cil('barril decorativo', 32, 88, 120, PB + 44, -60, maderaOsc());
        int.add(barril);
        let n = 0;
        for (let f = 0; f < 2; f++) for (let c = 0; c < 4; c++) {
          const x = -L / 2 + 520 + c * 380, z = -A / 2 + 260 + f * 330;
          n++;
          int.add(cj('mesa ' + n, 150, 7, 85, x, PB + 74, z, madera()));
          [[-66, 0], [66, 0]].forEach(q => int.add(cj('pata de la mesa ' + n, 8, 70, 66, x + q[0], PB + 35, z, maderaOsc())));
          [-72, 72].forEach(dz => {
            int.add(cj('silla ' + n, 118, 6, 44, x, PB + 45, z + dz, madera()));
            int.add(cj('respaldo de la silla ' + n, 118, 44, 6, x, PB + 68, z + dz + (dz > 0 ? 19 : -19), madera()));
          });
        }
        int.add(cj('cielorraso', L - 40, 8, A - 40, 0, PB + H - 24, 0, mat('cielorraso', 0xf0ece4, 0.9)));
        mats.push(['Mesa de madera', 'un', n]);
        mats.push(['Silla de madera', 'un', n * 2]);
      }
    }
  },
  cenefa: {
    nombre: 'Cenefa de listones',
    campos: [
      ['largo', 'Largo total', 900],
      ['alto', 'Alto de la cenefa', 40],
      ['tabla', 'Ancho del listón', 12],
      ['sep', 'Separación', 3],
      ['espesor', 'Espesor del listón', 4],
      ['altoLibre', 'Altura del borde inferior', 280],
      ['soporte', 'Lado del caño', 5]
    ],
    opciones: [
      ['ondulada', 'Borde ondulado', false],
      ['parantes', 'Parantes de anclaje', true]
    ],
    build(v, g, mats) {
      const cj = (n, w, h, d, x, y, z, m, ry) => caja(n, w * CM, h * CM, d * CM, x * CM, y * CM, z * CM, m, ry);
      const L = v.largo, H = v.alto, tb = v.tabla, s = v.sep, e = v.espesor;
      const y0 = v.altoLibre, sp = v.soporte;

      // Dos soportes metálicos transversales: la cenefa se atornilla a ellos.
      const ySup = y0 + H - sp * 1.6, yInf = y0 + sp * 1.6;
      g.add(cj('soporte metálico transversal superior', L, sp, sp, 0, ySup, -e / 2 - sp / 2, hierro()));
      g.add(cj('soporte metálico transversal inferior', L, sp, sp, 0, yInf, -e / 2 - sp / 2, hierro()));
      mats.push(['Caño estructural ' + sp + 'x' + sp + ' cm — soporte transversal', 'm', +((L * 2) / 100).toFixed(1)]);

      if (v.parantes) {
        const np = Math.max(2, Math.round(L / 250) + 1);
        for (let i = 0; i < np; i++) {
          const x = -L / 2 + (L / (np - 1)) * i;
          g.add(cj('parante de anclaje ' + (i + 1), sp, H + 10, sp, x, y0 + H / 2, -e / 2 - sp * 1.6, hierro()));
        }
        mats.push(['Parante de anclaje ' + sp + 'x' + sp + ' cm', 'un', np]);
      }

      // Listones verticales de madera
      const k = Math.max(1, Math.floor(L / (tb + s)));
      for (let i = 0; i < k; i++) {
        const h = v.ondulada ? H * (0.7 + Math.abs(Math.sin(i * 0.55)) * 0.3) : H;
        g.add(cj('listón de cenefa ' + (i + 1), tb, h, e, -L / 2 + tb / 2 + i * (tb + s), y0 + H - h / 2, 0, madera()));
      }
      mats.push(['Listón de madera ' + tb + ' cm x ' + H + ' cm', 'un', k]);
      mats.push(['Tornillo autoperforante con arandela', 'un', k * 2]);
      g.add(cj('terreno', L * 1.4, 4, 400, 0, -2, 100, cesped()));
    }
  },
  pergola: {
    nombre: 'Pérgola con telas',
    campos: [
      ['largo', 'Largo', 1680], ['ancho', 'Ancho', 890], ['alto', 'Alto libre', 290],
      ['porticos', 'Pórticos por lado', 4], ['correas', 'Correas', 6],
      ['poste', 'Lado del poste', 15], ['cenefa', 'Alto de cenefa', 34], ['tabla', 'Ancho de tabla', 12]
    ],
    opciones: [['telas', 'Telas tensadas', true], ['cenefaOn', 'Cenefa de madera', true], ['deck', 'Piso de deck', false]],
    build(v, g, mats) {
      const L = v.largo * CM, A = v.ancho * CM, H = v.alto * CM, p = v.poste * CM;
      const n = Math.max(2, Math.round(v.porticos));
      const xs = Array.from({ length: n }, (_, i) => -L / 2 + (L / (n - 1)) * i);
      xs.forEach((x, i) => [-A / 2, A / 2].forEach((z, j) => {
        g.add(caja('poste ' + (i + 1) + '-' + (j + 1), p, H, p, x, H / 2, z, blanco()));
      }));
      g.add(caja('viga posterior', L, p * 1.15, p, 0, H + p * 0.6, -A / 2, blanco()));
      g.add(caja('viga frontal', L, p * 1.15, p, 0, H + p * 0.6, A / 2, blanco()));
      xs.forEach((x, i) => g.add(caja('pórtico transversal ' + (i + 1), p, p * 1.15, A, x, H + p * 0.6, 0, blanco())));
      const nc = Math.max(2, Math.round(v.correas));
      for (let i = 0; i < nc; i++) {
        g.add(caja('correa ' + (i + 1), L, p * 0.66, p * 0.66, 0, H + p * 0.55, -A / 2 + (A / (nc - 1)) * i, blanco()));
      }
      mats.push(['Poste metálico ' + v.poste + 'x' + v.poste + ' cm — ' + v.alto + ' cm', 'un', n * 2]);
      mats.push(['Viga metálica longitudinal', 'm', +(L * 2).toFixed(1)]);
      mats.push(['Pórtico transversal', 'm', +(A * n).toFixed(1)]);
      mats.push(['Correa metálica', 'm', +(L * nc).toFixed(1)]);
      if (v.telas) {
        for (let i = 0; i < n - 1; i++) {
          const t = caja('tela ' + (i + 1), (L / (n - 1)) - 0.3, 0.03, A - 0.1, (xs[i] + xs[i + 1]) / 2, H + p * 0.1, 0, tela());
          t.rotation.x = (i % 2 ? 1 : -1) * 0.04;
          g.add(t);
        }
        mats.push(['Tela tensada con herrajes', 'm2', +(L * A).toFixed(1)]);
      }
      if (v.cenefaOn) {
        const alt = v.cenefa * CM, tb = v.tabla * CM;
        const borde = (nom, largo, x, z, ry) => {
          const k = Math.max(1, Math.round(largo / (tb + 0.01)));
          for (let i = 0; i < k; i++) {
            const h = alt * (0.72 + Math.abs(Math.sin(i * 2.7)) * 0.28);
            const d = -largo / 2 + i * (largo / k) + largo / k / 2;
            g.add(caja(nom + ' ' + (i + 1), tb * 0.92, h, 0.05, x + Math.cos(ry) * d, H + p * 1.2 - h / 2, z - Math.sin(ry) * d, madera(), ry));
          }
          return k;
        };
        let k = borde('cenefa frontal', L, 0, A / 2 + 0.08, 0);
        k += borde('cenefa izquierda', A, -L / 2 - 0.08, 0, Math.PI / 2);
        k += borde('cenefa derecha', A, L / 2 + 0.08, 0, Math.PI / 2);
        mats.push(['Tabla de cenefa ' + v.tabla + ' cm x ' + v.cenefa + ' cm', 'un', k]);
      }
      if (v.deck) {
        g.add(caja('piso de deck', L, 0.06, A, 0, -0.03, 0, madera()));
        mats.push(['Deck de madera', 'm2', +(L * A).toFixed(1)]);
      }
      g.add(caja('terreno', L * 1.3, 0.04, A * 1.6, 0, -0.06, 0, cesped()));
    }
  },

  cerco: {
    nombre: 'Cerco de madera',
    campos: [
      ['largo', 'Largo', 1200], ['alto', 'Alto', 180], ['tabla', 'Ancho de tabla', 14],
      ['sep', 'Separación', 2], ['postes', 'Poste cada', 250], ['zocalo', 'Alto de zócalo', 40]
    ],
    opciones: [['horizontal', 'Tablas horizontales', true], ['zocaloOn', 'Zócalo de piedra', true]],
    build(v, g, mats) {
      const L = v.largo * CM, H = v.alto * CM, tb = v.tabla * CM, s = v.sep * CM, zc = v.zocaloOn ? v.zocalo * CM : 0;
      if (zc) { g.add(caja('zocalo de piedra', L, zc, 0.35, 0, zc / 2, 0, piedra())); mats.push(['Zócalo de piedra', 'm', +L.toFixed(1)]); }
      const np = Math.max(2, Math.round(L / (v.postes * CM)) + 1);
      for (let i = 0; i < np; i++) {
        g.add(caja('poste ' + (i + 1), 0.09, H, 0.09, -L / 2 + (L / (np - 1)) * i, zc + H / 2, -0.13, hierro()));
      }
      mats.push(['Poste de hierro ' + v.alto + ' cm', 'un', np]);
      if (v.horizontal) {
        const k = Math.max(1, Math.floor(H / (tb + s)));
        for (let i = 0; i < k; i++) g.add(caja('tabla ' + (i + 1), L, tb, 0.045, 0, zc + tb / 2 + i * (tb + s), 0, madera()));
        g.add(caja('travesaño superior', L, 0.08, 0.09, 0, zc + H + 0.05, -0.13, hierro()));

    ],

    build(v, g, mats) {
      const L = v.largo * CM, H = v.alto * CM, e = v.espesor * CM;

      const aw = v.anchoAb * CM, ah = v.altoAb * CM;

      if (na === 0) {

      } else {
        const paso = L / na;

        for (let i = 0; i <= na; i++) {
          const w = i === 0 || i === na ? macizo / 2 + 0.001 : macizo;
          const x = -L / 2 + (i === 0 ? w / 2 : i * paso - aw / 2 - w / 2);
          g.add(caja('paño ' + (i + 1), w, H, e, x, H / 2, 0, material));

        for (let i = 0; i < na; i++) {

          g.add(caja('dintel ' + (i + 1), aw, H - ah, e, x, ah + (H - ah) / 2, 0, material));
          g.add(caja('marco ' + (i + 1), aw, ah, e * 0.35, x, ah / 2, 0, hierro()));
        }

      }
      mats.push([v.revestido ? 'Revestimiento de madera' : 'Muro revocado y pintado', 'm2', +(L * H - na * aw * ah).toFixed(1)]);

    }

const EXTRAS = [
  ['mesas', 'Mesas y sillas', 0],
  ['reposeras', 'Reposeras', 0],
  ['arboles', 'Árboles', 0],
  ['aguaOn', 'Terreno con agua', false]
];

function agregarExtras(v, g, mats, ancho) {
  const nm = Math.round(v.mesas || 0);
  for (let i = 0; i < nm; i++) {
    const x = (i % 3 - 1) * 2.4, z = Math.floor(i / 3) * 2.2 - 1;
    g.add(caja('mesa ' + (i + 1), 1.5, 0.07, 0.85, x, 0.74, z, madera()));
    [[-0.65, 0], [0.65, 0]].forEach(q => g.add(caja('pata de mesa', 0.08, 0.72, 0.6, x + q[0], 0.36, z, maderaOsc())));
    [-0.75, 0.75].forEach(dz => {
      g.add(caja('silla ' + (i + 1), 1.2, 0.06, 0.42, x, 0.45, z + dz, madera()));
      g.add(caja('respaldo de silla', 1.2, 0.42, 0.06, x, 0.68, z + dz + (dz > 0 ? 0.18 : -0.18), madera()));
    });
  }
  if (nm) { mats.push(['Mesa de madera', 'un', nm]); mats.push(['Banco de madera', 'un', nm * 2]); }
  const nr = Math.round(v.reposeras || 0);
  for (let i = 0; i < nr; i++) {
    const x = -(ancho / 2) - 1.6 - (i % 2) * 1.9, z = Math.floor(i / 2) * 1.9 - 1;
    g.add(caja('reposera ' + (i + 1), 1.7, 0.07, 0.62, x, 0.36, z, tela()));
    const r = caja('respaldo de reposera', 0.62, 0.07, 0.66, x + 0.78, 0.58, z, tela());
    r.rotation.z = Math.PI / 2.6; g.add(r);
  }
  if (nr) mats.push(['Reposera', 'un', nr]);
  const na = Math.round(v.arboles || 0);
  for (let i = 0; i < na; i++) {
    const x = (i % 2 ? 1 : -1) * (ancho / 2 + 2.4 + i * 0.6), z = -2.5 - (i % 3) * 1.5;
    const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 3.4, 14), mat('corteza', 0x8b7d6b, 0.95));
    tr.name = 'tronco'; tr.position.set(x, 1.7, z); g.add(tr);
    const cp = new THREE.Mesh(new THREE.SphereGeometry(1.5, 18, 12), mat('follaje', 0x5f7a44, 0.95));
    cp.name = 'follaje'; cp.position.set(x, 4.1, z); cp.scale.y = 0.8; g.add(cp);
  }
  if (v.aguaOn) {
    const w = new THREE.Mesh(new THREE.BoxGeometry(ancho * 2.4, 0.05, 6), agua());
    w.name = 'agua'; w.position.set(0, -0.08, 7.5); g.add(w);
  }
}

// ————— estado —————
const KEY = 'twg-bocetos-v1';
let plantilla = 'local';
let valores = {};

// ————— diseño libre —————
// libres: piezas agregadas a mano, con medida y posición propias, en cm.
// ajustes: corrimientos aplicados a piezas de la plantilla, por nombre.
let libres = [], ajustes = {}, sel = null, modoLibre = false, paso = 10, seq = 0;
let ocultos = {}, midiendo = false, ptosMed = [], lineaMed = null;
// borrados: piezas de la plantilla que el usuario quitó, por nombre.
// historial: fotos del boceto para poder deshacer con Ctrl+Z. porta: lo copiado.
let borrados = {}, historial = [], porta = null, portaMulti = [];
// Un bloque agrupa las piezas que entraron juntas (una cenefa, un cerco):
// se selecciona, se arrastra y se copia como una sola cosa.
let seqBloque = 0;
let herramienta = 'orbitar', pinturaColor = '', pinturaMat = '';
// refs: fotos que se apoyan en la escena para calcar sobre ellas.
let refs = [], seqRef = 0;
// multi: selección de varias piezas a la vez (doble clic toma toda la familia)
let multi = { nombres: [], ids: [] }, marcosMulti = [];
function hayMulti() { return (multi.nombres.length + multi.ids.length) > 1; }
function limpiarMulti() {
  marcosMulti.forEach(m => m.parent && m.parent.remove(m));
  marcosMulti = []; multi = { nombres: [], ids: [] };
}
// La familia de una pieza: su nombre sin el número final ('cenefa frontal 7' → 'cenefa frontal').
const familia = (n) => String(n || '').replace(/^· /, '').replace(/\s+\d+([-–]\d+)?$/, '').trim();
const primeraPalabra = (n) => familia(n).split(/\s+/)[0];

function foto() {
  return JSON.stringify({ libres, ajustes, borrados, ocultos, valores, plantilla, refs });
}
function guardarPaso() {
  historial.push(foto());
  if (historial.length > 60) historial.shift();
}
function refrescarFicha() {
  const el = document.querySelector('#panelPieza');
  if (!el || el.style.display === 'none') return;
  const m = medidaConjunto();
  if (!m) return;
  el.querySelectorAll('input[data-med]').forEach(inp => {
    inp.value = inp.dataset.med === 'largo' ? m.largo : inp.dataset.med === 'ancho' ? m.ancho : m.alto;
  });
}
function deshacer() {
  if (!historial.length) { document.querySelector('#cartel').textContent = 'No hay nada más para deshacer.'; return; }
  const d = JSON.parse(historial.pop());
  libres = d.libres; ajustes = d.ajustes; borrados = d.borrados; ocultos = d.ocultos;
  valores = d.valores; plantilla = d.plantilla;
  if (d.refs) refs = d.refs;
  sel = null;
  panelMedidas(); pintar();
  setTimeout(refrescarFicha, 50);
  document.querySelector('#cartel').textContent = 'Se deshizo el último cambio.';
}
// Aviso que la selección no pisa: marcar() solo escribe si nadie puso un
// mensaje recién.
let avisoHasta = 0;
const nPiezas = (n) => n === 1 ? '1 pieza' : n + ' piezas';
function aviso(txt) {
  document.querySelector('#cartel').textContent = txt;
  avisoHasta = Date.now() + 2500;
}
function copiar() {
  const d = datosSel(); if (!d) return;
  if (d.tipo === 'libre') porta = Object.assign({}, d.L);
  else {
    const b = new THREE.Box3().setFromObject(sel), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
    porta = { nombre: sel.name.replace(/^· /, ''), tipo: 'copia',
      w: Math.round(s.x / CM), h: Math.round(s.y / CM), d: Math.round(s.z / CM),
      m: (sel.material && sel.material.name) || 'madera',
      x: Math.round(c.x / CM), y: Math.round(c.y / CM), z: Math.round(c.z / CM), ry: 0 };
  }
  document.querySelector('#cartel').textContent = 'Copiado: ' + porta.nombre + '. Pegá con Ctrl+V.';
}
function pegar() {
  if (!porta) return;
  guardarPaso();
  const x2 = porta.x + porta.w + 20;
  const base = Math.max(0, (porta.y || 0) - (porta.h || 0) / 2);
  const dy = Math.max(0, alturaEn(x2, porta.z || 0, [porta.id]) - base);
  const c = Object.assign({}, porta, {
    id: ++seq, x: x2, y: (porta.y || 0) + dy,
    // bloque propio: la copia no queda soldada al original
    bloque: porta.bloque ? 'bl' + (++seqBloque) : undefined
  });
  libres.push(c); pintar();
  seleccionarPorId(c.id);
  aviso('Pegado: ' + c.nombre + '. Arrastralo al lugar.');
}
function borrarSel() {
  const d = datosSel(); if (!d) return;
  guardarPaso();
  if (d.tipo === 'libre') libres = libres.filter(x => x.id !== d.L.id);
  else borrados[d.nombre] = true;
  sel = null; pintar();
}

const MATERIALES = {
  'madera': madera, 'madera oscura': maderaOsc, 'hierro negro': hierro,
  'hierro blanco': blanco, 'tela': tela, 'hormigon': piedra, 'revoque': revoque,
  'ladrillo': ladrillo, 'caña': cana, 'vidrio': vidrio, 'cemento alisado': cemento,
  'cesped': cesped, 'arena': arena, 'agua': agua
};
const COLORES = ['#8a5a33', '#4e372a', '#26251f', '#e8e5de', '#a05236', '#9b9478', '#d6c7a4', '#8f8b85', '#6d8046', '#c03a26', '#2f6df6', '#f2c14e'];

// [clave, nombre, ancho, alto, profundidad, material]
const PIEZAS = [
  ['poste', 'Poste', 15, 290, 15, 'hierro blanco'],
  ['columna', 'Columna de madera', 20, 290, 20, 'madera oscura'],
  ['viga', 'Viga', 400, 18, 10, 'hierro negro'],
  ['correa', 'Correa', 400, 9, 9, 'hierro negro'],
  ['tabla', 'Tabla de madera', 300, 12, 4, 'madera'],
  ['liston', 'Listón', 300, 8, 4, 'madera'],
  ['cenefa', 'Tabla de cenefa', 300, 34, 5, 'madera'],
  ['deck', 'Panel de deck', 200, 6, 100, 'madera'],
  ['telaLibre', 'Tela tensada', 300, 3, 300, 'tela'],
  ['muroLibre', 'Paño de muro', 300, 260, 15, 'revoque'],
  ['bloque', 'Bloque libre', 100, 100, 100, 'hormigon']
];

const nomLibre = (L) => L.nombre + ' ' + L.w + 'x' + L.h + 'x' + L.d + ' cm';

function agregarLibre(clave) {
  const y0 = alturaEn(0, 0);
  const P = PIEZAS.find(x => x[0] === clave);
  if (!P) return;
  guardarPaso();
  const alto = (valores.alto || 250);
  libres.push({
    id: ++seq, tipo: P[0], nombre: P[1],
    w: P[2], h: P[3], d: P[4], m: P[5],
    x: 0, y: y0 + (P[0] === 'poste' || P[0] === 'columna' || P[0] === 'muroLibre' ? P[3] / 2 : alto),
    z: 0, ry: 0
  });
  pintar();
  seleccionarPorId(libres[libres.length - 1].id);
}

function mallaLibre(L) {
  const o = caja('· ' + nomLibre(L), L.w * CM, L.h * CM, L.d * CM,
    L.x * CM, L.y * CM, L.z * CM, (MATERIALES[L.m] || madera)(), L.ry * Math.PI / 180);
  if (L.color) { o.material = o.material.clone(); o.material.color = new THREE.Color(L.color); }
  o.userData.libre = L.id;
  return o;
}

function defaults(id) {
  const p = PLANTILLAS[id], v = {};
  p.campos.forEach(([k, , d]) => v[k] = d);
  p.opciones.forEach(([k, , d]) => v[k] = d);
  EXTRAS.forEach(([k, , d]) => v[k] = d);
  return v;
}

function construir() {
  const p = PLANTILLAS[plantilla];
  const g = new THREE.Group(); g.name = p.nombre;
  const mats = [];
  p.build(valores, g, mats);
  agregarExtras(valores, g, mats, (valores.ancho || 400) * CM);
  // corrimientos hechos a mano sobre piezas de la plantilla
  g.traverse(o => {
    const a = ajustes[o.name];
    if (a && o.isMesh) {
      o.position.set(o.position.x + (a.dx || 0) * CM, o.position.y + (a.dy || 0) * CM, o.position.z + (a.dz || 0) * CM);
      if (a.ry) o.rotation.y += a.ry * Math.PI / 180;
      if (a.esc) o.scale.multiplyScalar(a.esc / 100);
      if (a.sx || a.sy || a.sz) o.scale.set(o.scale.x * (a.sx || 1), o.scale.y * (a.sy || 1), o.scale.z * (a.sz || 1));
      if (a.mat && MATERIALES[a.mat]) o.material = MATERIALES[a.mat]();
      if (a.color) { o.material = o.material.clone(); o.material.color = new THREE.Color(a.color); }
      o.userData.plantilla = o.name;
    } else if (o.isMesh) {
      o.userData.plantilla = o.name;
    }
  });
  // piezas quitadas por el usuario
  const fuera = [];
  g.traverse(o => { if (o.isMesh && borrados[o.name]) fuera.push(o); });
  fuera.forEach(o => o.parent && o.parent.remove(o));
  g.children.forEach(q => { if (q.isGroup && ocultos[q.name]) q.visible = false; });
  // piezas libres, agrupadas por capa
  const capas = {};
  libres.forEach(L => {
    const nom = L.capa || 'Piezas libres';
    if (!capas[nom]) {
      const q = new THREE.Group(); q.name = nom;
      if (ocultos[nom]) q.visible = false;
      g.add(q); capas[nom] = q;
    }
    capas[nom].add(mallaLibre(L));
  });
  // fotos de referencia: planos con la imagen, para calcar encima
  if (refs.length) {
    const qr = new THREE.Group(); qr.name = 'Fotos de referencia';
    if (ocultos['Fotos de referencia']) qr.visible = false;
    refs.forEach(R => {
      const tex = texturaRef(R);
      const m = new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: R.op, side: THREE.DoubleSide, depthWrite: false });
      m.name = 'foto ' + R.id;
      const pl = new THREE.Mesh(new THREE.PlaneGeometry(R.w * CM, R.h * CM), m);
      pl.name = 'foto de referencia ' + R.id;
      pl.position.set(R.x * CM, R.y * CM, R.z * CM);
      pl.rotation.y = R.ry * Math.PI / 180;
      if (R.piso) pl.rotation.x = -Math.PI / 2;
      qr.add(pl);
    });
    g.add(qr);
  }
  // las piezas libres también entran al cómputo
  // Se agrupa por familia: los prefabs numeran cada pieza ("teja 1", "teja 2"),
  // así que sin quitar el número el cómputo saldría de a una unidad por fila.
  const cuenta = {};
  libres.forEach(L => {
    const k = familia(L.nombre) + ' ' + L.w + 'x' + L.h + 'x' + L.d + ' cm';
    cuenta[k] = (cuenta[k] || 0) + 1;
  });
  Object.entries(cuenta).forEach(([k, n]) => mats.push([k, 'un', n]));
  return { g, mats };
}

const texCache = {};
function texturaRef(R) {
  if (texCache[R.id]) return texCache[R.id];
  const im = new Image();
  im.src = R.src;
  const tex = new THREE.Texture(im);
  im.onload = () => { tex.needsUpdate = true; if (stage._renderer) stage._renderer.render(stage._scene, stage._camera); };
  tex.colorSpace = THREE.SRGBColorSpace;
  texCache[R.id] = tex;
  return tex;
}

let primerPintado = true;
function pintar() {
  const { g, mats } = construir();
  // la cámara no debe saltar cada vez que se edita una pieza
  const cam = stage._camera, ctl = stage._controls;
  const cp = cam ? cam.position.clone() : null, ct = ctl ? ctl.target.clone() : null;
  stage.setObject(g);
  if (cp && !primerPintado) {
    cam.position.copy(cp); ctl.target.copy(ct);
    cam.updateProjectionMatrix(); ctl.update();
  }
  primerPintado = false;
  stage.setAttribute('name', 'boceto-' + plantilla);
  const p = PLANTILLAS[plantilla];
  const medidas = [
    valores.largo ? valores.largo + ' cm de largo' : '',
    valores.ancho ? valores.ancho + ' cm de ancho' : '',
    valores.alto ? 'alto ' + valores.alto + ' cm' : ''
  ].filter(Boolean).join(' · ');
  document.querySelector('#cartel').textContent = p.nombre + (medidas ? ' — ' + medidas : '');
  document.querySelector('#materiales').innerHTML = mats.map(([d, u, c]) =>
    '<div class="mat"><span>' + d + '</span><b>' + c.toLocaleString('es-PY') + '</b><i>' + u + '</i></div>'
  ).join('') || '<div style="font-size:12px;color:#86817b">Sin materiales.</div>';
  window.__computo = mats;
  [...document.querySelectorAll('#plantillas .plant')].forEach(b => b.classList.toggle('on', b.dataset.p === plantilla));
  listarCapas();
  listarLibres();
  const idAnt = sel && sel.userData.libre, nomAnt = sel && sel.userData.plantilla;
  sel = null;
  if (idAnt) seleccionarPorId(idAnt);
  else if (nomAnt) { stage._object.traverse(o => { if (!sel && o.isMesh && o.name === nomAnt) marcar(o); }); }
  else panelPieza();
}

// ————— selección y edición de piezas —————
let marcoSel = null, tiradores = null;


// Los tiradores son los cubitos azules de las caras: se arrastran para
// agrandar o achicar la pieza sobre ese eje, como en SketchUp.
function ponerTiradores() {
  if (tiradores && tiradores.parent) tiradores.parent.remove(tiradores);
  tiradores = null;
  if (!sel || !modoLibre || herramienta !== 'mover') return;
  const b = new THREE.Box3().setFromObject(sel);
  const c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3());
  const r = 1;
  tiradores = new THREE.Group();
  tiradores.name = 'tiradores de tamaño';
  const azul = new THREE.MeshBasicMaterial({ color: 0x2f6df6, depthTest: false });
  const caras = [
    ['w', 1, [c.x + s.x / 2, c.y, c.z]], ['w', -1, [c.x - s.x / 2, c.y, c.z]],
    ['h', 1, [c.x, c.y + s.y / 2, c.z]], ['h', -1, [c.x, c.y - s.y / 2, c.z]],
    ['d', 1, [c.x, c.y, c.z + s.z / 2]], ['d', -1, [c.x, c.y, c.z - s.z / 2]]
  ];
  caras.forEach(([eje, signo, pos]) => {
    const h = new THREE.Mesh(new THREE.BoxGeometry(r, r, r), azul);
    h.name = 'tirador ' + eje;
    h.position.set(pos[0], pos[1], pos[2]);
    h.userData.tirador = { eje: eje, signo: signo };
    h.renderOrder = 999;
    tiradores.add(h);
  });
  stage._object.add(tiradores);
  escalarTiradores();
}

// Los tiradores mantienen el mismo tamaño en pantalla a cualquier distancia:
// si no, en un modelo de 20 m quedan de dos píxeles y no se pueden agarrar.
function escalarTiradores() {
  if (!tiradores || !stage._camera) return;
  const cam = stage._camera;
  tiradores.children.forEach(h => {
    const d = cam.position.distanceTo(h.getWorldPosition(new THREE.Vector3()));
    const k = Math.max(0.05, d * 0.022);
    h.scale.set(k, k, k);
  });
}

// aislar = true toma una pieza sola aunque pertenezca a un bloque (Ctrl+clic)
function marcar(o, aislar) {
  // Si la pieza forma parte de un bloque, se selecciona el bloque completo.
  if (o && o.userData && o.userData.libre && !aislar) {
    const L = libres.find(x => x.id === o.userData.libre);
    if (L && L.bloque) {
      const ids = libres.filter(x => x.bloque === L.bloque).map(x => x.id);
      if (ids.length > 1) { marcarVarios([], ids); return; }
    }
  }
  if (marcoSel && marcoSel.parent) marcoSel.parent.remove(marcoSel);
  marcoSel = null;
  limpiarMulti();
  sel = o || null;
  if (sel) {
    marcoSel = new THREE.BoxHelper(sel, 0x2f6df6);
    marcoSel.name = 'marco de selección';
    marcoSel.material.depthTest = false;
    stage._object.add(marcoSel);
    if (Date.now() > avisoHasta) {
      const nom = (sel.userData.libre ? (libres.find(x => x.id === sel.userData.libre) || {}).nombre : (sel.userData.plantilla || sel.name)) || 'pieza';
      document.querySelector('#cartel').textContent = 'Seleccionada: ' + nom + '.';
    }
  }
  ponerTiradores();
  panelPieza();
}
// Medida real del conjunto seleccionado, en cm: se lee de la caja que lo
// contiene, así sirve igual para una cenefa, una pérgola o un cerco.
function medidaConjunto() {
  if (!stage._object) return null;
  const caja = new THREE.Box3();
  let n = 0;
  stage._object.traverse(o => {
    if (!o.isMesh || /marco|tirador|dibujo en curso|cinta de medir/i.test(o.name)) return;
    const esta = hayMulti()
      ? ((o.userData.libre && multi.ids.indexOf(o.userData.libre) >= 0) ||
         (!o.userData.libre && multi.nombres.indexOf(o.userData.plantilla || o.name) >= 0))
      : (o === sel);
    if (!esta) return;
    caja.expandByObject(o); n++;
  });
  if (!n || caja.isEmpty()) return null;
  const s = caja.getSize(new THREE.Vector3()), c = caja.getCenter(new THREE.Vector3());
  return {
    largo: Math.max(1, Math.round(s.x / CM)),
    alto: Math.max(1, Math.round(s.y / CM)),
    ancho: Math.max(1, Math.round(s.z / CM)),
    cx: c.x / CM, cy: caja.min.y / CM, cz: c.z / CM, piezas: n
  };
}

// Lleva el conjunto a la medida pedida en cm, estirando desde su base y su
// centro: escribís 1200 de largo y la estructura queda de 12 m.
function fijarMedida(campo, valorCm) {
  const m = medidaConjunto();
  if (!m || !valorCm || valorCm <= 0) return;
  const actual = campo === 'largo' ? m.largo : campo === 'ancho' ? m.ancho : m.alto;
  const k = valorCm / actual;
  if (!isFinite(k) || k <= 0 || Math.abs(k - 1) < 0.0005) return;
  const eje = campo === 'largo' ? 'x' : campo === 'ancho' ? 'z' : 'y';
  aplicarMulti(d => {
    if (d.tipo === 'libre') {
      const L = d.L;
      if (eje === 'x') { L.w = Math.max(1, Math.round(L.w * k)); L.x = Math.round(m.cx + (L.x - m.cx) * k); }
      if (eje === 'z') { L.d = Math.max(1, Math.round(L.d * k)); L.z = Math.round(m.cz + (L.z - m.cz) * k); }
      if (eje === 'y') { L.h = Math.max(1, Math.round(L.h * k)); L.y = Math.round(m.cy + (L.y - m.cy) * k); }
    } else {
      const a = Object.assign({}, ajustes[d.nombre]);
      const cl = eje === 'x' ? 'sx' : eje === 'z' ? 'sz' : 'sy';
      a[cl] = Math.round(((a[cl] || 1) * k) * 1000) / 1000;
      // Posición actual de la pieza, para separarla del centro en la misma
      // proporción: así la caja del conjunto llega a la medida pedida.
      let mesh = null;
      stage._object.traverse(x => { if (!mesh && x.isMesh && (x.userData.plantilla || x.name) === d.nombre) mesh = x; });
      if (mesh) {
        const c = new THREE.Box3().setFromObject(mesh).getCenter(new THREE.Vector3());
        if (eje === 'x') a.dx = Math.round(((a.dx || 0) + (c.x / CM - m.cx) * (k - 1)) * 10) / 10;
        if (eje === 'z') a.dz = Math.round(((a.dz || 0) + (c.z / CM - m.cz) * (k - 1)) * 10) / 10;
        if (eje === 'y') a.dy = Math.round(((a.dy || 0) + (c.y / CM - m.cy) * (k - 1)) * 10) / 10;
      }
      ajustes[d.nombre] = a;
    }
  });
  setTimeout(() => {
    const m2 = medidaConjunto();
    const real = m2 ? (campo === 'largo' ? m2.largo : campo === 'ancho' ? m2.ancho : m2.alto) : 0;
    aviso(Math.abs(real - valorCm) <= Math.max(2, valorCm * 0.02)
      ? 'Medida fijada: ' + campo + ' ' + Math.round(valorCm) + ' cm.'
      : 'Quedó en ' + real + ' cm de ' + campo + ' (pedías ' + Math.round(valorCm) + ').');
  }, 60);
}

function marcarVarios(nombres, ids) {
  if (marcoSel && marcoSel.parent) marcoSel.parent.remove(marcoSel);
  marcoSel = null;
  if (tiradores && tiradores.parent) tiradores.parent.remove(tiradores);
  tiradores = null;
  limpiarMulti();
  multi = { nombres: nombres.slice(), ids: ids.slice() };
  sel = null;
  stage._object.traverse(o => {
    if (!o.isMesh) return;
    const esta = (o.userData.libre && ids.indexOf(o.userData.libre) >= 0) ||
      (!o.userData.libre && nombres.indexOf(o.userData.plantilla || o.name) >= 0);
    if (!esta) return;
    if (!sel) sel = o;
    const m = new THREE.BoxHelper(o, 0x2f6df6);
    m.name = 'marco de selección múltiple';
    m.material.depthTest = false;
    stage._object.add(m);
    marcosMulti.push(m);
  });
  panelPieza();
  const nSel = nombres.length + ids.length;
  if (Date.now() > avisoHasta) {
    document.querySelector('#cartel').textContent = nSel === 1 ? 'Seleccionada 1 pieza.' : 'Seleccionadas ' + nSel + ' piezas.';
  }
}

function seleccionarFamilia(o, ancho) {
  const base = ancho ? primeraPalabra(o.name) : familia(o.userData.plantilla || o.name);
  const nombres = [], ids = [];
  stage._object.traverse(x => {
    if (!x.isMesh || /marco de selecci|tirador|foto de referencia/.test(x.name)) return;
    const nom = x.userData.plantilla || x.name;
    const coincide = ancho ? primeraPalabra(nom) === base : familia(nom) === base;
    if (!coincide) return;
    if (x.userData.libre) { if (ids.indexOf(x.userData.libre) < 0) ids.push(x.userData.libre); }
    else if (nombres.indexOf(nom) < 0) nombres.push(nom);
  });
  if (nombres.length + ids.length < 2) { marcar(o); return; }
  marcarVarios(nombres, ids);
}

// Toma todo lo que caiga dentro del recuadro dibujado en pantalla.
function seleccionarEnRecuadro(L) {
  const r = L.rect;
  const x1 = Math.min(L.x0, L.x1) - r.left, x2 = Math.max(L.x0, L.x1) - r.left;
  const y1 = Math.min(L.y0, L.y1) - r.top, y2 = Math.max(L.y0, L.y1) - r.top;
  const nombres = [], ids = [];
  const v = new THREE.Vector3();
  stage._object.traverse(o => {
    if (!o.isMesh || !visibleReal(o)) return;
    if (/marco de selecci|tirador|foto de referencia|terreno|cesped|agua|arena/i.test(o.name)) return;
    o.getWorldPosition(v);
    v.project(stage._camera);
    const px = (v.x * 0.5 + 0.5) * r.width, py = (-v.y * 0.5 + 0.5) * r.height;
    if (px < x1 || px > x2 || py < y1 || py > y2) return;
    if (o.userData.libre) { if (ids.indexOf(o.userData.libre) < 0) ids.push(o.userData.libre); }
    else { const n = o.userData.plantilla || o.name; if (nombres.indexOf(n) < 0) nombres.push(n); }
  });
  const total = nombres.length + ids.length;
  if (!total) { marcar(null); document.querySelector('#cartel').textContent = 'El recuadro quedó vacío.'; return; }
  if (total === 1) {
    let o = null;
    stage._object.traverse(x => {
      if (o || !x.isMesh) return;
      if (ids.length ? x.userData.libre === ids[0] : (x.userData.plantilla || x.name) === nombres[0]) o = x;
    });
    marcar(o); return;
  }
  marcarVarios(nombres, ids);
}

function seleccionarPorId(id) {
  let hit = null;
  stage._object.traverse(o => { if (!hit && o.userData && o.userData.libre === id) hit = o; });
  marcar(hit);
}
function datosSel() {
  if (!sel) return null;
  const id = sel.userData.libre;
  if (id) return { tipo: 'libre', L: libres.find(x => x.id === id) };
  return { tipo: 'plantilla', nombre: sel.userData.plantilla || sel.name };
}

function aplicarMulti(fn) {
  guardarPaso();
  multi.ids.forEach(id => { const L = libres.find(x => x.id === id); if (L) fn({ tipo: 'libre', L: L }); });
  multi.nombres.forEach(n => fn({ tipo: 'plantilla', nombre: n }));
  const m = { nombres: multi.nombres.slice(), ids: multi.ids.slice() };
  pintar();
  setTimeout(() => marcarVarios(m.nombres, m.ids), 30);
}

function panelConjunto() {

    fichaMedidas() +
    '<div class="rot" style="margin:9px 0 5px">Tamaño del conjunto</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">' +
      '<button class="vista" data-esc="0.8">−20%</button>' +

    '</div>' +
    '<label class="campo" style="grid-template-columns:minmax(0,1fr) 64px 20px;margin-top:6px"><span>Escalar a</span><input id="escM" value="100" inputmode="decimal" /><span class="u">%</span></label>' +
    '<div class="rot" style="margin:9px 0 5px">Material</div>' +
    '<select id="matM" style="width:100%;padding:7px 8px;font-size:12px;background:#fff;border:1px solid #dedbd5;border-radius:6px;cursor:pointer">' +
      '<option value="">Dejar el material</option>' +
      Object.keys(MATERIALES).map(k => '<option value="' + k + '">' + k + '</option>').join('') +
    '</select>' +
    '<div class="rot" style="margin:9px 0 5px">Color</div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:5px">' +
      COLORES.map(c => '<button data-cm="' + c + '" style="width:22px;height:22px;border-radius:5px;cursor:pointer;background:' + c + ';border:2px solid rgba(0,0,0,0.15)"></button>').join('') +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px">' +
      '<button class="vista" id="copM">Copiar</button>' +
      '<button class="vista" id="pegM">Pegar</button>' +
      '<button class="vista" id="delM" style="color:#8a3a2f;background:#faf0ee;border-color:#e8d3ce">Borrar</button>' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px">' +
      '<button class="vista" id="unirM">Unir como bloque</button>' +
      '<button class="vista" id="sepM">Separar bloque</button>' +
    '</div>' +
    '<div style="margin-top:8px;font-size:10.5px;line-height:1.5;color:#86817b">Doble clic toma toda la familia. Shift y arrastrar dibuja un recuadro y toma todo lo que quede adentro. Ctrl+C y Ctrl+V copian el conjunto.</div>';

  const q = (id) => el.querySelector('#' + id);
  engancharFicha(el);
  q('cerrarSel').onclick = () => marcar(null);
  q('ampliar').onclick = () => { if (sel) seleccionarFamilia(sel, true); };
  const girar = (g) => aplicarMulti(d => {
    if (d.tipo === 'libre') { d.L.ry = ((d.L.ry || 0) + g) % 360; if (g % 90 === 0) { const w = d.L.w; d.L.w = d.L.d; d.L.d = w; } }
    else ajustes[d.nombre] = Object.assign({}, ajustes[d.nombre], { ry: ((ajustes[d.nombre] || {}).ry || 0) + g });
  });
  q('girar90').onclick = () => girar(90);
  q('girar45').onclick = () => girar(45);
  q('acostarM').onclick = () => aplicarMulti(d => {
    if (d.tipo !== 'libre') { ajustes[d.nombre] = Object.assign({}, ajustes[d.nombre], { ry: 90 }); return; }
    const L = d.L; if (L.h > L.w) { const hh = L.h; L.h = L.w; L.w = hh; L.y = Math.round(L.h / 2); }
  });
  q('pararM').onclick = () => aplicarMulti(d => {
    if (d.tipo !== 'libre') { ajustes[d.nombre] = Object.assign({}, ajustes[d.nombre], { ry: 0 }); return; }
    const L = d.L; if (L.w > L.h) { const ww = L.w; L.w = L.h; L.h = ww; L.y = Math.round(L.h / 2); }
  });
  q('gradoM').onchange = (e) => {
    const g = parseFloat(String(e.target.value).replace(',', '.')) || 0;
    aplicarMulti(d => {
      if (d.tipo === 'libre') d.L.ry = g;
      else ajustes[d.nombre] = Object.assign({}, ajustes[d.nombre], { ry: g });
    });
  };
  q('aplicarMov').onclick = () => {
    const dx = parseFloat(q('movX').value) || 0, dz = parseFloat(q('movZ').value) || 0, dy = parseFloat(q('movY').value) || 0;
    aplicarMulti(d => {
      if (d.tipo === 'libre') { d.L.x += dx; d.L.z += dz; d.L.y += dy; }
      else {
        const a = Object.assign({ dx: 0, dy: 0, dz: 0 }, ajustes[d.nombre]);
        a.dx += dx; a.dz += dz; a.dy += dy;
        ajustes[d.nombre] = a;
      }
    });
  };
  // Escala el conjunto respecto de su propio centro, así no se desarma.
  const escalar = (k) => {
    const ids = multi.ids.slice();
    if (!ids.length) { document.querySelector('#cartel').textContent = 'Escalar funciona en las piezas agregadas al dibujo.'; return; }
    const ps = ids.map(id => libres.find(x => x.id === id)).filter(Boolean);
    const cx = ps.reduce((a, L) => a + L.x, 0) / ps.length;
    const cz = ps.reduce((a, L) => a + L.z, 0) / ps.length;
    const minY = Math.min.apply(null, ps.map(L => L.y - L.h / 2));
    guardarPaso();
    ps.forEach(L => {
      L.w = Math.max(1, Math.round(L.w * k)); L.h = Math.max(1, Math.round(L.h * k)); L.d = Math.max(1, Math.round(L.d * k));
      L.x = Math.round(cx + (L.x - cx) * k);
      L.z = Math.round(cz + (L.z - cz) * k);
      L.y = Math.round(minY + (L.y - minY) * k);
    });
    pintar();
    setTimeout(() => marcarVarios([], ids), 30);
    document.querySelector('#cartel').textContent = 'Conjunto escalado al ' + Math.round(k * 100) + '%.';
  };
  el.querySelectorAll('button[data-esc]').forEach(b => b.onclick = () => escalar(parseFloat(b.dataset.esc)));
  q('escM').onchange = (e) => {
    const pc = parseFloat(String(e.target.value).replace(',', '.'));
    if (isFinite(pc) && pc > 0) escalar(pc / 100);
  };
  q('matM').onchange = (e) => {
    const m = e.target.value; if (!m) return;
    aplicarMulti(d => { if (d.tipo === 'libre') d.L.m = m; else ajustes[d.nombre] = Object.assign({}, ajustes[d.nombre], { mat: m }); });
  };
  el.querySelectorAll('button[data-cm]').forEach(b => b.onclick = () => aplicarMulti(d => {
    if (d.tipo === 'libre') d.L.color = b.dataset.cm;
    else ajustes[d.nombre] = Object.assign({}, ajustes[d.nombre], { color: b.dataset.cm });
  }));
  q('unirM').onclick = () => {
    guardarPaso();
    const bl = 'bl' + (++seqBloque);
    multi.ids.forEach(id => { const L = libres.find(x => x.id === id); if (L) L.bloque = bl; });
    const m = { nombres: multi.nombres.slice(), ids: multi.ids.slice() };
    pintar();
    aviso('Unido como un bloque: ' + nPiezas(m.ids.length) + '.');
    setTimeout(() => marcarVarios([], m.ids), 30);
  };
  q('sepM').onclick = () => {
    guardarPaso();
    multi.ids.forEach(id => { const L = libres.find(x => x.id === id); if (L) delete L.bloque; });
    const ids = multi.ids.slice();
    pintar();
    document.querySelector('#cartel').textContent = 'Bloque separado: cada pieza se toca por su cuenta.';
    setTimeout(() => marcarVarios([], ids), 30);
  };
  q('copM').onclick = () => {
    portaMulti = multi.ids.map(id => Object.assign({}, libres.find(x => x.id === id))).filter(Boolean);
    multi.nombres.forEach(n => {
      let o = null; stage._object.traverse(x => { if (!o && x.isMesh && (x.userData.plantilla || x.name) === n) o = x; });
      if (!o) return;
      const b = new THREE.Box3().setFromObject(o), s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
      portaMulti.push({ nombre: n, w: Math.round(s.x / CM), h: Math.round(s.y / CM), d: Math.round(s.z / CM),
        m: (o.material && o.material.name) || 'madera', x: Math.round(c.x / CM), y: Math.round(c.y / CM), z: Math.round(c.z / CM), ry: 0 });
    });
    document.querySelector('#cartel').textContent = 'Copiadas ' + portaMulti.length + ' piezas. Pegá con Ctrl+V.';
  };
  q('pegM').onclick = () => pegarMulti();
  q('delM').onclick = () => {
    guardarPaso();
    libres = libres.filter(x => multi.ids.indexOf(x.id) < 0);
    multi.nombres.forEach(n => borrados[n] = true);
    limpiarMulti(); sel = null; pintar();
  };
}

function pegarMulti() {
  if (!portaMulti.length) { pegar(); return; }
  guardarPaso();
  const mapa = {};
  const ids0 = portaMulti.map(P => P.id);
  const cx = portaMulti.reduce((a, P) => a + (P.x || 0), 0) / portaMulti.length + 100;
  const cz = portaMulti.reduce((a, P) => a + (P.z || 0), 0) / portaMulti.length;
  const yBase = portaMulti.reduce((a, P) => Math.min(a, (P.y || 0) - (P.h || 0) / 2), Infinity);
  const dy = Math.max(0, alturaEn(cx, cz, ids0) - Math.max(0, yBase));
  const nuevos = portaMulti.map(P => {
    const bl = P.bloque ? (mapa[P.bloque] || (mapa[P.bloque] = 'bl' + (++seqBloque))) : undefined;
    return Object.assign({}, P, { id: ++seq, x: P.x + 100, y: (P.y || 0) + dy, bloque: bl });
  });
  libres = libres.concat(nuevos);
  pintar();
  setTimeout(() => marcarVarios([], nuevos.map(n => n.id)), 30);
}

// Altura de lo que ya está dibujado en ese punto: todo lo que se agrega
// se apoya encima (plataforma, deck, losa) en vez de quedar enterrado.
function alturaEn(xcm, zcm, ignorar) {
  if (!stage._object) return 0;
  const rd = new THREE.Raycaster(new THREE.Vector3(xcm * CM, 60, zcm * CM), new THREE.Vector3(0, -1, 0));
  const hits = rd.intersectObjects(stage._object.children, true).filter(h =>
    h.object.isMesh &&
    !/marco|tirador|dibujo en curso|agua|cinta de medir|calco/i.test(h.object.name) &&
    !(ignorar && h.object.userData && ignorar.indexOf(h.object.userData.libre) >= 0));
  return hits.length ? Math.max(0, Math.round(hits[0].point.y / CM)) : 0;
}
