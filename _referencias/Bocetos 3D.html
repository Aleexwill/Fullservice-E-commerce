function puntoPiso(ev) {
  rc.setFromCamera(coord(ev), stage._camera);
  // primero lo que ya está dibujado; si no hay nada, el suelo
  const hits = rc.intersectObjects(stage._object ? stage._object.children : [], true).filter(h =>
    h.object.isMesh && !/marco|tirador|dibujo en curso|cinta de medir/i.test(h.object.name));
  if (hits.length) return hits[0].point.clone();
  const p = new THREE.Vector3();
  return rc.ray.intersectPlane(planoPiso, p) ? p : null;
}

function crearDibujado(x, z, w, d, base) {
  const alto = Math.max(1, DIB.alto), esp = Math.max(1, DIB.esp);
  const y0 = Math.max(0, Math.round(base || 0));
  guardarPaso();
  const ids = [];
  const bl = 'bl' + (++seqBloque);
  const nuevo = (nombre, W, H, D, X, Y, Z) => {
    const id = ++seq;
    ids.push(id);
    libres.push({ id: id, tipo: 'dibujo', bloque: bl, capa: 'Dibujado', nombre: nombre,
      w: Math.max(1, Math.round(W)), h: Math.max(1, Math.round(H)), d: Math.max(1, Math.round(D)),
      m: DIB.mat, x: Math.round(X), y: Math.round(Y + y0), z: Math.round(Z), ry: 0 });
  };
  if (DIB.tipo === 'pared') {
    // el lado más corto pasa a ser el espesor: se dibuja el recorrido del muro
    if (w >= d) nuevo('pared', w, alto, esp, x, alto / 2, z);
    else nuevo('pared', esp, alto, d, x, alto / 2, z);
  } else if (DIB.tipo === 'piso') {
    nuevo('piso', w, esp, d, x, esp / 2, z);
  } else if (DIB.tipo === 'viga') {
    if (w >= d) nuevo('viga', w, esp, esp, x, alto, z);
    else nuevo('viga', esp, esp, d, x, alto, z);
  } else if (DIB.tipo === 'listones') {
    const largo = Math.max(w, d), horiz = w >= d;
    const k = Math.max(1, Math.floor(largo / (DIB.tabla + DIB.sep)));
    for (let i = 0; i < k; i++) {
      const off = -largo / 2 + DIB.tabla / 2 + i * (DIB.tabla + DIB.sep);
      if (horiz) nuevo('listón ' + (i + 1), DIB.tabla, alto, esp, x + off, alto / 2, z);
      else nuevo('listón ' + (i + 1), esp, alto, DIB.tabla, x, alto / 2, z + off);
    }
  } else {
    nuevo('bloque', w, alto, d, x, alto / 2, z);
  }
  pintar();
  setTimeout(() => { if (ids.length > 1) marcarVarios([], ids); else seleccionarPorId(ids[0]); }, 40);
  aviso('Dibujado: ' + Math.round(Math.max(w, d)) + ' cm — se puede arrastrar y estirar.');
}

// ————— clic, arrastre y teclas —————
const rc = new THREE.Raycaster();
const planoDrag = new THREE.Plane();
let arrastre = null, escalado = null, lazo = null, ruedaTimer = null;

// Redibujo liviano mientras se arrastra: evita reconstruir la escena en cada cuadro.
let liveTimer = null;
function pintarLive() {
  clearTimeout(liveTimer);
  liveTimer = setTimeout(() => pintar(), 70);
}

function coord(ev) {
  const cv = stage._renderer.domElement, r = cv.getBoundingClientRect();
  return new THREE.Vector2(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
}
// three no ignora los objetos invisibles al hacer raycast: sin este control,
// una capa apagada seguía siendo seleccionable con el clic.
function visibleReal(o) {
  let p = o;
  while (p) { if (p.visible === false) return false; p = p.parent; }
  return true;
}
function picar(ev) {
  rc.setFromCamera(coord(ev), stage._camera);
  const hits = rc.intersectObjects(stage._object.children, true);
  return (hits.find(h => h.object.isMesh && visibleReal(h.object) &&
    !/terreno|agua|piso|cesped|follaje|tronco|marco de selecci|tirador/i.test(h.object.name)) || null);
}

// ————— cinta de medir —————
function medirPunto(ev) {
  rc.setFromCamera(coord(ev), stage._camera);
  const hits = rc.intersectObjects(stage._object.children, true);
  const h = hits.find(x => x.object.isMesh);
  if (!h) return;
  ptosMed.push(h.point.clone());
  if (ptosMed.length === 1) {
    document.querySelector('#cartel').textContent = 'Medir: tocá el segundo punto.';
    return;
  }
  const [a, b] = ptosMed;
  const d = a.distanceTo(b);
  if (lineaMed && lineaMed.parent) lineaMed.parent.remove(lineaMed);
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  lineaMed = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xd8402a, depthTest: false }));
  lineaMed.name = 'cinta de medir';
  stage._object.add(lineaMed);
  const cm = Math.round(d / CM);
  document.querySelector('#cartel').textContent = 'Medida: ' + cm.toLocaleString('es-PY') + ' cm  ·  ' + (cm / 100).toFixed(2) + ' m';
  ptosMed = [];
}

function iniciar() {
  const cv = stage._renderer.domElement;
  if (stage._controls) stage._controls.addEventListener('change', escalarTiradores);
  cv.addEventListener('pointerdown', (ev) => {
    if (herramienta === 'dibujar' && ev.button === 0) {
      const p0 = puntoPiso(ev);
      if (!p0) return;
      stage._controls.enabled = false;
      previa = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.01, 0.01),
        new THREE.MeshBasicMaterial({ color: 0x2f6df6, transparent: true, opacity: 0.35 }));
      previa.name = 'dibujo en curso';
      stage._object.add(previa);
      dibujo = { p0: p0, base: Math.max(0, Math.round(p0.y / CM)) };
      cv.setPointerCapture(ev.pointerId);
      return;
    }
    if (midiendo && ev.button === 0) { medirPunto(ev); return; }
    // Con la manito también se arrastra: si ya hay algo seleccionado y el clic
    // cae sobre esa pieza, se mueve; si cae en otro lado, gira la vista.
    const conMano = herramienta === 'orbitar' && (sel || hayMulti());
    if ((!modoLibre && !conMano) || ev.button !== 0) return;
    // Shift + arrastrar = recuadro de selección, como el lazo de SketchUp
    if (ev.shiftKey && herramienta === 'mover') {
      const cvr = cv.getBoundingClientRect();
      lazo = { x0: ev.clientX, y0: ev.clientY, rect: cvr };
      const el = document.querySelector('#lazo');
      el.style.display = 'block';
      el.style.left = (ev.clientX - cvr.left) + 'px';
      el.style.top = (ev.clientY - cvr.top) + 'px';
      el.style.width = '0px'; el.style.height = '0px';
      stage._controls.enabled = false;
      cv.setPointerCapture(ev.pointerId);
      return;
    }
    // ¿tocó un tirador de tamaño?
    if (tiradores && sel) {
      rc.setFromCamera(coord(ev), stage._camera);
      const ht = rc.intersectObjects(tiradores.children, false)[0];
      if (ht) {
        const d0 = datosSel();
        stage._controls.enabled = false;
        const T = ht.object.userData.tirador;
        const ejeV = { w: new THREE.Vector3(1, 0, 0), h: new THREE.Vector3(0, 1, 0), d: new THREE.Vector3(0, 0, 1) }[T.eje];
        const nrm = new THREE.Vector3(0, 0, 1).applyQuaternion(stage._camera.quaternion);
        planoDrag.setFromNormalAndCoplanarPoint(nrm, ht.point);
        const p0 = new THREE.Vector3();
        rc.ray.intersectPlane(planoDrag, p0);
        guardarPaso();
        const base = new THREE.Box3().setFromObject(sel).getSize(new THREE.Vector3());
        escalado = {
          d: d0, T: T, eje: ejeV, p0: p0, mesh: sel,
          w0: d0.tipo === 'libre' ? d0.L.w : Math.round(base.x / CM),
          h0: d0.tipo === 'libre' ? d0.L.h : Math.round(base.y / CM),
          dd0: d0.tipo === 'libre' ? d0.L.d : Math.round(base.z / CM),
          x0: d0.tipo === 'libre' ? d0.L.x : 0,
          y0: d0.tipo === 'libre' ? d0.L.y : 0,
          z0: d0.tipo === 'libre' ? d0.L.z : 0,
          a0: d0.tipo === 'libre' ? null : Object.assign({ sx: 1, sy: 1, sz: 1, dx: 0, dy: 0, dz: 0 }, ajustes[d0.nombre])
        };
        cv.setPointerCapture(ev.pointerId);
        return;
      }
    }
    const aislar = ev.ctrlKey || ev.metaKey;
    const h = picar(ev);
    if (!h) { if (!conMano) marcar(null); return; }
    // Si la pieza tocada ya es parte de la selección, se arrastra todo el conjunto.
    const enConjunto = hayMulti() && (h.object.userData.libre
      ? multi.ids.indexOf(h.object.userData.libre) >= 0
      : multi.nombres.indexOf(h.object.userData.plantilla || h.object.name) >= 0);
    if (enConjunto && (herramienta === 'mover' || conMano)) {
      stage._controls.enabled = false;
      const n = ev.altKey ? new THREE.Vector3(0, 0, 1).applyQuaternion(stage._camera.quaternion) : new THREE.Vector3(0, 1, 0);
      planoDrag.setFromNormalAndCoplanarPoint(n, h.point);
      const p0 = new THREE.Vector3();
      rc.ray.intersectPlane(planoDrag, p0);
      guardarPaso();
      arrastre = {
        grupo: { nombres: multi.nombres.slice(), ids: multi.ids.slice() },
        vert: ev.altKey, p0: p0,
        base: multi.ids.map(id => { const L = libres.find(x => x.id === id); return L ? { id: id, x: L.x, y: L.y, z: L.z } : null; }).filter(Boolean),
        baseNom: multi.nombres.map(nn => { const a = ajustes[nn] || {}; return { n: nn, dx: a.dx || 0, dy: a.dy || 0, dz: a.dz || 0 }; })
      };
      cv.setPointerCapture(ev.pointerId);
      return;
    }
    if (conMano) {
      // con la manito solo se mueve lo ya seleccionado; lo demás gira la vista
      const mismo = sel && (h.object === sel || (h.object.userData.libre && sel.userData && sel.userData.libre === h.object.userData.libre));
      if (!mismo) return;
    } else marcar(h.object, aislar);
    if (herramienta === 'pintar') { aplicarPintura(h.object); return; }
    if (herramienta === 'borrar') { borrarSel(); return; }
    if (herramienta === 'copiar') { copiar(); return; }
    const d = datosSel();
    if (!d) return;
    stage._controls.enabled = false;
    const n = ev.altKey ? new THREE.Vector3(0, 0, 1).applyQuaternion(stage._camera.quaternion) : new THREE.Vector3(0, 1, 0);
    planoDrag.setFromNormalAndCoplanarPoint(n, h.point);
    const p0 = new THREE.Vector3();
    rc.ray.intersectPlane(planoDrag, p0);
    guardarPaso();
    if (d.tipo === 'libre') {
      arrastre = { L: d.L, x0: d.L.x, y0: d.L.y, z0: d.L.z, p0: p0, vert: ev.altKey, mesh: h.object };
    } else {
      // una pieza sola de la plantilla se corre con el mismo mecanismo del conjunto
      const a = ajustes[d.nombre] || {};
      arrastre = {
        grupo: { nombres: [d.nombre], ids: [] }, vert: ev.altKey, p0: p0,
        base: [], baseNom: [{ n: d.nombre, dx: a.dx || 0, dy: a.dy || 0, dz: a.dz || 0 }]
      };
    }
    cv.setPointerCapture(ev.pointerId);
  });
  // La rueda agranda o achica cuando el puntero está sobre una pieza
  // seleccionada; en cualquier otro lugar sigue acercando la vista.
  cv.addEventListener('wheel', (ev) => {
    if (!sel && !hayMulti()) return;
    const h = picar(ev);
    if (!h) return;
    const o = h.object;
    const enSel = hayMulti()
      ? (o.userData.libre ? multi.ids.indexOf(o.userData.libre) >= 0 : multi.nombres.indexOf(o.userData.plantilla || o.name) >= 0)
      : (o === sel || (o.userData.libre && sel.userData && sel.userData.libre === o.userData.libre));
    if (!enSel) return;
    ev.preventDefault();
    ev.stopPropagation();
    const k = ev.deltaY < 0 ? 1.06 : 1 / 1.06;
    const escalarUno = (d) => {
      if (d.tipo === 'libre') {
        const L = d.L;
        L.w = Math.max(1, Math.round(L.w * k));
        L.h = Math.max(1, Math.round(L.h * k));
        L.d = Math.max(1, Math.round(L.d * k));
      } else {
        const a = Object.assign({}, ajustes[d.nombre]);
        a.esc = Math.max(5, Math.round(((a.esc || 100) * k) * 10) / 10);
        ajustes[d.nombre] = a;
      }
    };
    if (hayMulti()) {
      multi.ids.forEach(id => { const L = libres.find(x => x.id === id); if (L) escalarUno({ tipo: 'libre', L: L }); });
      multi.nombres.forEach(n => escalarUno({ tipo: 'plantilla', nombre: n }));
    } else {
      const d = datosSel(); if (d) escalarUno(d);
    }
    if (!ruedaTimer) guardarPaso();
    clearTimeout(ruedaTimer);
    pintarLive();
    document.querySelector('#cartel').textContent = 'Tamaño: ' + (ev.deltaY < 0 ? 'agrandando' : 'achicando') + ' — soltá la rueda para fijar';
    ruedaTimer = setTimeout(() => {
      ruedaTimer = null;
      const m = { nombres: multi.nombres.slice(), ids: multi.ids.slice() };
      pintar();
      if (m.nombres.length + m.ids.length > 1) setTimeout(() => marcarVarios(m.nombres, m.ids), 30);
    }, 220);
  }, { passive: false, capture: true });

  cv.addEventListener('pointermove', (ev) => {
    if (dibujo) {
      const p = puntoPiso(ev);
      if (!p || !previa) return;
      const snap = (n) => Math.round(n / CM / paso) * paso * CM;
      const x1 = snap(dibujo.p0.x), z1 = snap(dibujo.p0.z), x2 = snap(p.x), z2 = snap(p.z);
      const w = Math.max(0.02, Math.abs(x2 - x1)), d = Math.max(0.02, Math.abs(z2 - z1));
      const alto = Math.max(0.02, DIB.alto * CM);
      previa.geometry.dispose();
      previa.geometry = new THREE.BoxGeometry(w, DIB.tipo === 'piso' ? DIB.esp * CM : alto, d);
      previa.position.set((x1 + x2) / 2, dibujo.base * CM + (DIB.tipo === 'piso' ? DIB.esp * CM : alto) / 2, (z1 + z2) / 2);
      dibujo.fin = { x: (x1 + x2) / 2 / CM, z: (z1 + z2) / 2 / CM, w: w / CM, d: d / CM, base: dibujo.base };
      document.querySelector('#cartel').textContent = 'Dibujando: ' + Math.round(w / CM) + ' x ' + Math.round(d / CM) + ' cm';
      return;
    }
    if (lazo) {
      const el = document.querySelector('#lazo'), r = lazo.rect;
      const x1 = Math.min(lazo.x0, ev.clientX), y1 = Math.min(lazo.y0, ev.clientY);
      el.style.left = (x1 - r.left) + 'px';
      el.style.top = (y1 - r.top) + 'px';
      el.style.width = Math.abs(ev.clientX - lazo.x0) + 'px';
      el.style.height = Math.abs(ev.clientY - lazo.y0) + 'px';
      lazo.x1 = ev.clientX; lazo.y1 = ev.clientY;
      return;
    }
    if (escalado) {
      rc.setFromCamera(coord(ev), stage._camera);
      const p = new THREE.Vector3();
      if (!rc.ray.intersectPlane(planoDrag, p)) return;
      const av = p.clone().sub(escalado.p0).dot(escalado.eje) / CM * escalado.T.signo;
      const E = escalado, T = E.T;
      const nuevo = Math.max(paso, Math.round(({ w: E.w0, h: E.h0, d: E.dd0 }[T.eje] + av) / paso) * paso);
      const delta = nuevo - { w: E.w0, h: E.h0, d: E.dd0 }[T.eje];
      if (E.d.tipo === 'libre') {
        const L = E.d.L;
        if (T.eje === 'w') { L.w = nuevo; L.x = E.x0 + T.signo * delta / 2; }
        if (T.eje === 'h') { L.h = nuevo; L.y = E.y0 + T.signo * delta / 2; }
        if (T.eje === 'd') { L.d = nuevo; L.z = E.z0 + T.signo * delta / 2; }
        document.querySelector('#cartel').textContent = L.nombre + ' — ' + L.w + ' × ' + L.h + ' × ' + L.d + ' cm';
      } else {
        const a = Object.assign({}, E.a0);
        const k = { w: 'sx', h: 'sy', d: 'sz' }[T.eje];
        const cor = { w: 'dx', h: 'dy', d: 'dz' }[T.eje];
        const orig = { w: E.w0, h: E.h0, d: E.dd0 }[T.eje];
        a[k] = (E.a0[k] || 1) * (nuevo / orig);
        a[cor] = (E.a0[cor] || 0) + T.signo * delta / 2;
        ajustes[E.d.nombre] = a;
        document.querySelector('#cartel').textContent = E.d.nombre + ' — ' + nuevo + ' cm en ese lado';
      }
      pintarLive();
      return;
    }
    if (!arrastre) return;
    rc.setFromCamera(coord(ev), stage._camera);
    const p = new THREE.Vector3();
    if (!rc.ray.intersectPlane(planoDrag, p)) return;
    const dv = p.clone().sub(arrastre.p0);
    if (arrastre.grupo) {
      const dx = Math.round(dv.x / CM / paso) * paso, dz = Math.round(dv.z / CM / paso) * paso, dy = Math.round(dv.y / CM / paso) * paso;
      arrastre.base.forEach(B => {
        const Lp = libres.find(x => x.id === B.id);
        if (!Lp) return;
        if (arrastre.vert) Lp.y = B.y + dy;
        else { Lp.x = B.x + dx; Lp.z = B.z + dz; }
      });
      arrastre.baseNom.forEach(B => {
        const a = Object.assign({}, ajustes[B.n]);
        if (arrastre.vert) a.dy = B.dy + dy;
        else { a.dx = B.dx + dx; a.dz = B.dz + dz; }
        ajustes[B.n] = a;
      });
      document.querySelector('#cartel').textContent = 'Conjunto: ' + (arrastre.vert ? 'altura ' + dy : 'X ' + dx + ' · Z ' + dz) + ' cm';
      pintarLive();
      return;
    }
    const L = arrastre.L;
    if (arrastre.vert) L.y = Math.round((arrastre.y0 + dv.y / CM) / paso) * paso;
    else { L.x = Math.round((arrastre.x0 + dv.x / CM) / paso) * paso; L.z = Math.round((arrastre.z0 + dv.z / CM) / paso) * paso; }
    arrastre.mesh.position.set(L.x * CM, L.y * CM, L.z * CM);
    if (marcoSel) marcoSel.update();
    document.querySelector('#cartel').textContent = L.nombre + ' — X ' + L.x + ' · Z ' + L.z + ' · altura ' + L.y + ' cm';
  });
  const fin = () => {
    if (lazo) {
      const el = document.querySelector('#lazo');
      el.style.display = 'none';
      stage._controls.enabled = true;
      const L = lazo; lazo = null; fijarVista();
      if (L.x1 === undefined || Math.abs(L.x1 - L.x0) < 6 || Math.abs(L.y1 - L.y0) < 6) return;
      seleccionarEnRecuadro(L);
      return;
    }
    if (dibujo) {
      const f = dibujo.fin;
      if (previa && previa.parent) previa.parent.remove(previa);
      previa = null; dibujo = null; fijarVista();
      if (f && (f.w >= paso || f.d >= paso)) crearDibujado(f.x, f.z, f.w, f.d, f.base);
      return;
    }
    if (escalado) { escalado = null; fijarVista(); pintar(); return; }
    if (!arrastre) return;
    const eraGrupo = arrastre.grupo;
    arrastre = null;
    fijarVista();
    pintar();
    if (eraGrupo) setTimeout(() => marcarVarios(eraGrupo.nombres, eraGrupo.ids), 30);
  };
  cv.addEventListener('dblclick', (ev) => {
    if (!modoLibre) return;
    const h = picar(ev);
    if (h) seleccionarFamilia(h.object, false);
  });
  cv.addEventListener('pointerup', fin);
  cv.addEventListener('pointercancel', fin);

  window.addEventListener('keydown', (ev) => {
    if (/INPUT|SELECT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) return;
    const ctrl = ev.ctrlKey || ev.metaKey;
    if (ctrl && (ev.key === 'z' || ev.key === 'Z')) { ev.preventDefault(); deshacer(); return; }
    // Con varias piezas seleccionadas, Ctrl+C y Ctrl+V trabajan sobre todo el conjunto.
    if (ctrl && (ev.key === 'c' || ev.key === 'C')) {
      ev.preventDefault();
      if (hayMulti()) { const b = document.querySelector('#panelPieza #copM'); if (b) b.click(); } else { portaMulti = []; copiar(); }
      return;
    }
    if (ctrl && (ev.key === 'v' || ev.key === 'V')) { ev.preventDefault(); if (portaMulti.length) pegarMulti(); else pegar(); return; }
    if (!sel) return;
    // Delete borra de una vez todo lo seleccionado, sea una pieza o un conjunto.
    if (ev.key === 'Delete' || ev.key === 'Backspace') {
      ev.preventDefault();
      if (hayMulti()) {
        guardarPaso();
        const n = multi.nombres.length + multi.ids.length;
        libres = libres.filter(x => multi.ids.indexOf(x.id) < 0);
        multi.nombres.forEach(nn => borrados[nn] = true);
        limpiarMulti(); sel = null; pintar();
        document.querySelector('#cartel').textContent = 'Borradas ' + n + ' piezas. Ctrl+Z las devuelve.';
      } else borrarSel();
      return;
    }
    const d = datosSel(); if (!d) return;
    const mov = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[ev.key];
    if (mov && hayMulti()) {
      // las flechas corren todo el conjunto
      ev.preventDefault();
      aplicarMulti(dd => {
        if (dd.tipo === 'libre') {
          if (ev.shiftKey) dd.L.y += -mov[1] * paso; else { dd.L.x += mov[0] * paso; dd.L.z += mov[1] * paso; }
        } else {
          const a = Object.assign({ dx: 0, dy: 0, dz: 0 }, ajustes[dd.nombre]);
          if (ev.shiftKey) a.dy += -mov[1] * paso; else { a.dx += mov[0] * paso; a.dz += mov[1] * paso; }
          ajustes[dd.nombre] = a;
        }
      });
      return;
    }
    if (mov) {
      ev.preventDefault();
      guardarPaso();
      if (d.tipo === 'libre') {
        if (ev.shiftKey) d.L.y += -mov[1] * paso; else { d.L.x += mov[0] * paso; d.L.z += mov[1] * paso; }
      } else {
        const a = Object.assign({ dx: 0, dy: 0, dz: 0 }, ajustes[d.nombre]);
        if (ev.shiftKey) a.dy += -mov[1] * paso; else { a.dx += mov[0] * paso; a.dz += mov[1] * paso; }
        ajustes[d.nombre] = a;
      }
      pintar();
    }
    if (ev.key === 'Escape') marcar(null);
  });
}

// ————— panel de medidas de la plantilla —————
function panelMedidas() {
  const p = PLANTILLAS[plantilla];
  document.querySelector('#campos').innerHTML = p.campos.map(([k, et]) =>
    '<label class="campo"><span>' + et + '</span><input data-k="' + k + '" value="' + valores[k] + '" inputmode="decimal" /></label>'
  ).join('');
  document.querySelectorAll('#campos input').forEach(inp => {
    inp.onchange = () => {
      guardarPaso();
      const n = parseFloat(String(inp.value).replace(',', '.'));
      valores[inp.dataset.k] = isFinite(n) ? n : 0;
      pintar();
    };
  });
  const opts = p.opciones.concat(EXTRAS);
  document.querySelector('#extras').innerHTML = opts.map(([k, et, d]) =>
    typeof d === 'boolean'
      ? '<div class="sw"><span>' + et + '</span><button data-t="' + k + '"></button></div>'
      : '<label class="campo"><span>' + et + '</span><input data-k="' + k + '" value="' + valores[k] + '" inputmode="numeric" /></label>'
  ).join('');
  document.querySelectorAll('#extras input').forEach(inp => {
    inp.onchange = () => { guardarPaso(); const n = parseFloat(inp.value); valores[inp.dataset.k] = isFinite(n) ? n : 0; pintar(); };
  });
  const estilo = (b, on) => {
    b.textContent = on ? 'Sí' : 'No';
    b.style.cssText = 'padding: 5px 13px; font-size: 11.5px; font-weight: 600; border-radius: 20px; cursor: pointer; border: 1px solid ' + (on ? '#1b1a18' : '#dedbd5') + '; color: ' + (on ? '#ffffff' : '#6f6b64') + '; background: ' + (on ? '#1b1a18' : '#ffffff') + ';';
  };
  document.querySelectorAll('#extras button[data-t]').forEach(b => {
    estilo(b, !!valores[b.dataset.t]);
    b.onclick = () => { guardarPaso(); valores[b.dataset.t] = !valores[b.dataset.t]; estilo(b, valores[b.dataset.t]); pintar(); };
  });
}

document.querySelector('#plantillas').innerHTML = Object.entries(PLANTILLAS).map(([id, p]) =>
  '<div style="display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:4px;margin-bottom:5px">' +
    '<button class="plant" data-p="' + id + '" style="margin:0">' + p.nombre + '</button>' +
    '<button data-add="' + id + '" title="Agregar al dibujo como piezas editables" style="font-size:17px;font-weight:600;line-height:1;color:#33312e;background:#fff;border:1px solid #dedbd5;border-radius:8px;cursor:pointer">+</button>' +
  '</div>'
).join('');
document.querySelectorAll('#plantillas button[data-add]').forEach(b => {
  b.onclick = () => insertarPlantilla(b.dataset.add);
});
document.querySelectorAll('#plantillas .plant').forEach(b => {
  b.onclick = () => {
    guardarPaso();
    plantilla = b.dataset.p; valores = defaults(plantilla);
    ajustes = {}; borrados = {}; sel = null;
    panelMedidas(); pintar();
    setTimeout(() => vista('perspectiva'), 60);
  };
});

// ————— vistas fijas y captura —————
function vista(tipo) {
  const cam = stage._camera, ctl = stage._controls, obj = stage._object;
  if (!cam || !ctl || !obj) return;
  const box = new THREE.Box3();
  obj.children.forEach(q => { if (!/terreno|lago/i.test(q.name || '')) box.expandByObject(q); });
  if (box.isEmpty()) box.setFromObject(obj);
  const c = box.getCenter(new THREE.Vector3());
  const d = box.getSize(new THREE.Vector3()).length();
  if (tipo === 'ojo') {
    cam.position.set(c.x + 0.5, 1.65, box.max.z + 6);
    ctl.target.set(c.x, 1.5, c.z);
    cam.updateProjectionMatrix(); ctl.update();
    return;
  }
  const pos = {
    perspectiva: [c.x + d * 0.5, c.y + d * 0.4, c.z + d * 0.6],
    frente: [c.x, c.y + d * 0.10, c.z + d * 1.0],
    lateral: [c.x + d * 1.0, c.y + d * 0.10, c.z],
    planta: [c.x + 0.001, c.y + d * 1.1, c.z]
  }[tipo] || [c.x + d * 0.5, c.y + d * 0.4, c.z + d * 0.6];
  ctl.target.copy(c);
  cam.position.set(pos[0], pos[1], pos[2]);
  cam.updateProjectionMatrix();
  ctl.update();
}
function guardarImagen() {
  const r = stage._renderer;
  r.render(stage._scene, stage._camera);
  const url = r.domElement.toDataURL('image/png');

function usarHerramienta(h) {
  const cartel = document.querySelector('#cartel');
  if (h === 'pegar') { pegar(); return; }
  if (h === 'deshacer') { deshacer(); return; }
  if (h === 'foto') { guardarImagen(); return; }
  if (h === 'girar') {
    const d = datosSel();
    if (!d) { cartel.textContent = 'Primero tocá una pieza con la herramienta de mover.'; return; }
    guardarPaso();
    if (d.tipo === 'libre') { const L = d.L; L.ry = (L.ry + 90) % 360; const w = L.w; L.w = L.d; L.d = w; }
    else ajustes[d.nombre] = Object.assign({}, ajustes[d.nombre], { ry: ((ajustes[d.nombre] || {}).ry || 0) + 90 });
    pintar(); return;
  }
  if (h === 'acostar') {
    const d = datosSel();
    if (!d || d.tipo !== 'libre') { cartel.textContent = 'Acostar funciona en las piezas que agregás.'; return; }
    guardarPaso();
    const L = d.L, hh = L.h; L.h = L.w; L.w = hh; L.y = Math.round(L.h / 2);
    pintar(); return;
  }
  if (h === 'biblio') {
    const el = document.querySelector('#biblioteca');
    const abierta = el.style.display === 'block';
    el.style.display = abierta ? 'none' : 'block';
    ['#paleta', '#carpeta', '#ventanaImg'].forEach(s => document.querySelector(s).style.display = 'none');
    if (!abierta) pintarBiblio();
    return;
  }
  if (h === 'imagen') {
    const el = document.querySelector('#ventanaImg');
    const abierta = el.style.display === 'block';
    el.style.display = abierta ? 'none' : 'block';
    document.querySelector('#paleta').style.display = 'none';
    document.querySelector('#carpeta').style.display = 'none';
    document.querySelector('#biblioteca').style.display = 'none';
    if (!abierta) pintarVentanaImg();
    return;
  }
  if (h === 'carpeta') {
    const el = document.querySelector('#carpeta');
    const abierta = el.style.display === 'block';
    el.style.display = abierta ? 'none' : 'block';
    document.querySelector('#paleta').style.display = 'none';
    if (!abierta) pintarCarpeta();
    return;
  }
  herramienta = h;
  modoLibre = (h === 'mover' || h === 'pintar' || h === 'borrar' || h === 'copiar');
  midiendo = (h === 'medir');
  ptosMed = [];
  document.querySelector('#paleta').style.display = h === 'pintar' ? 'block' : 'none';
  document.querySelector('#dibujo').style.display = h === 'dibujar' ? 'block' : 'none';
  if (h === 'dibujar') { pintarDibujo(); cartel.textContent = 'Dibujar: arrastrá sobre el piso para marcar el largo y el ancho.'; }
  document.querySelector('#carpeta').style.display = 'none';
  document.querySelector('#ventanaImg').style.display = 'none';
  document.querySelector('#biblioteca').style.display = 'none';
  if (h !== 'dibujar') document.querySelector('#dibujo').style.display = 'none';
  if (h === 'pintar') pintarPaleta();
  if (h === 'medir') cartel.textContent = 'Medir: tocá el primer punto.';
  // la manito NO borra la selección: se limpia con Escape o con un clic en vacío
  fijarVista();
  pintarBarra();
}

// ————— ventana de imágenes de referencia —————
function achicarImagen(src, cb) {
  const im = new Image();
  im.onload = () => {
    const max = 1400;
    const k = Math.min(1, max / Math.max(im.width, im.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
    cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
    cb(cv.toDataURL('image/jpeg', 0.78), im.width / im.height);
  };
  im.src = src;
}

function sumarImagen(src, nombre) {
  achicarImagen(src, (chico, prop) => {
    const ancho = 600;
    refs.push({
      id: ++seqRef, nombre: nombre || ('Foto ' + (refs.length + 1)), src: chico,
      w: ancho, h: Math.round(ancho / (prop || 1.5)),
      x: 0, y: Math.round(ancho / (prop || 1.5) / 2), z: 0, ry: 0, op: 0.85, piso: false
    });
    pintar(); pintarVentanaImg();
    document.querySelector('#cartel').textContent = 'Foto agregada a la escena. Movela y escalala con los campos.';
  });
}

function leerArchivos(lista) {
  [...lista].filter(f => /^image\//.test(f.type)).forEach(f => {
    const fr = new FileReader();
    fr.onload = () => sumarImagen(fr.result, f.name.replace(/\.[^.]+$/, ''));
    fr.readAsDataURL(f);
  });
}

  el.querySelectorAll('button[data-qi]').forEach(b => b.onclick = () => {
    refs = refs.filter(x => x.id !== +b.dataset.qi); pintar(); pintarVentanaImg();
  });

  });
  el.querySelectorAll('button[data-ro]').forEach(b => b.onclick = () => {
    const R = refs.find(x => x.id === +b.dataset.ro);
    R.op = R.op > 0.75 ? 0.5 : (R.op > 0.4 ? 0.25 : 1);
    pintar(); pintarVentanaImg();
  });
}

// Arma la plantilla aparte y la vuelca como piezas libres, para que entre al
// dibujo actual sin reemplazar nada y se pueda estirar pieza por pieza.
function insertarPlantilla(id) {
  const P = PLANTILLAS[id];
  if (!P) return;
  guardarPaso();
  const v = defaults(id);
  const g = new THREE.Group();
  try { P.build(v, g, []); } catch (e) { document.querySelector('#cartel').textContent = 'No se pudo armar esa plantilla.'; return; }
  const ids = [];
  const bloqueNuevo = 'bl' + (++seqBloque);
  const cajaP = new THREE.Box3().setFromObject(g);
  const cenP = cajaP.getCenter(new THREE.Vector3());
  const y0 = alturaEn(Math.round(cenP.x / CM), Math.round(cenP.z / CM));
  const saltar = /terreno|cesped|agua|arena|junco|piedra de la orilla/i;
  g.traverse(o => {
    if (!o.isMesh || saltar.test(o.name)) return;
    const b = new THREE.Box3().setFromObject(o);
    const s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
    const nid = ++seq;
    ids.push(nid);
    libres.push({
      id: nid, tipo: 'plantilla-copia', bloque: bloqueNuevo, capa: P.nombre, nombre: o.name,
      w: Math.max(1, Math.round(s.x / CM)), h: Math.max(1, Math.round(s.y / CM)), d: Math.max(1, Math.round(s.z / CM)),
      m: (o.material && o.material.name) || 'madera',
      x: Math.round(c.x / CM), y: Math.round(c.y / CM) + y0, z: Math.round(c.z / CM),
      ry: Math.round(o.rotation.y * 180 / Math.PI)
    });
  });
  if (!ids.length) { document.querySelector('#cartel').textContent = 'Esa plantilla no tiene piezas para agregar.'; return; }
  if (!modoLibre) usarHerramienta('mover');
  pintar();
  setTimeout(() => marcarVarios([], ids), 40);
  aviso('Se agregó ' + P.nombre + ' al dibujo — ' + nPiezas(ids.length) + '. Ajustá la medida con Escalar o estirando los cubitos.');
}

const vecesBiblio = {};
function sumarBiblio(cat, nom) {
  const item = (BIBLIO[cat] || []).find(x => x[0] === nom);
  if (!item) return;
  guardarPaso();
  const bloqueBiblio = 'bl' + (++seqBloque);
  const piezas = item[1]();
  // Cada objeto nuevo del mismo tipo entra corrido, para que no quede
  // encimado sobre el anterior.
  const n = vecesBiblio[nom] = (vecesBiblio[nom] || 0) + 1;
  const dz = (n - 1) * 150;
  const cx = piezas.reduce((a, P) => a + (P.x || 0), 0) / piezas.length;
  const cz = piezas.reduce((a, P) => a + (P.z || 0), 0) / piezas.length + dz;
  const y0 = alturaEn(cx, cz);
  const ids = [];
  piezas.forEach(P => {
    const id = ++seq;
    ids.push(id);
    libres.push(Object.assign({ id: id, tipo: 'biblio', bloque: bloqueBiblio, capa: nom }, P, { z: (P.z || 0) + dz, y: (P.y || 0) + y0 }));
  });
  pintar();
  setTimeout(() => marcarVarios([], ids), 40);
  aviso('Se agregó ' + nom + (n > 1 ? ' n° ' + n : '') + ' — ' + nPiezas(piezas.length) + '. Arrastralo al lugar.');
}

      '</div>').join('');
  el.querySelector('#cerrarBib').onclick = () => { el.style.display = 'none'; };
  el.querySelectorAll('button[data-cat]').forEach(b => b.onclick = () => { catAbierta = b.dataset.cat; pintarBiblio(); });
  el.querySelectorAll('button[data-bib]').forEach(b => b.onclick = () => {
    if (!modoLibre) { usarHerramienta('mover'); }
    sumarBiblio(catAbierta, b.dataset.bib);

  // el + agrega otro sin cerrar la ventana: se puede tocar varias veces seguidas
  el.querySelectorAll('button[data-mas]').forEach(b => b.onclick = (ev) => {
    ev.stopPropagation();
    if (!modoLibre) { usarHerramienta('mover'); }
    sumarBiblio(catAbierta, b.dataset.mas);
    el.style.display = 'block';
  });
}

          '<div style="display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:7px 0;border-top:1px solid #efedea">' +
          '<div style="min-width:0"><div style="font-size:12px;font-weight:600">' + (b.num || ('D-' + String(i + 1).padStart(2, '0'))) + ' · ' + b.obra + '</div>' +
          '<div class="rot">' + ((PLANTILLAS[b.plantilla] || {}).nombre || b.plantilla) + ' · ' + b.fecha + '</div></div>' +
          '<button class="vista" data-ab="' + i + '" style="padding:5px 9px">Abrir</button>' +
          '<button class="vista" data-bo="' + i + '" style="padding:5px 8px;color:#8a3a2f;background:#faf0ee;border-color:#e8d3ce">×</button></div>'
        ).join('')
      : '<div style="font-size:11.5px;color:#86817b">Todavía no guardaste diseños.</div>');
  const el = document.querySelector('#carpeta');
  el.querySelector('#cerrarCarp').onclick = () => { el.style.display = 'none'; };
  el.querySelector('#guardarNuevo').onclick = () => { document.querySelector('#guardar').click(); pintarCarpeta(); };
  el.querySelectorAll('button[data-ab]').forEach(b => b.onclick = () => {
    document.querySelector('#guardados').value = b.dataset.ab;
    document.querySelector('#abrir').click();
    el.style.display = 'none';
  });
  el.querySelectorAll('button[data-bo]').forEach(b => b.onclick = () => {
    document.querySelector('#guardados').value = b.dataset.bo;
    document.querySelector('#borrar').click();
    pintarCarpeta();
  });
}

valores = defaults(plantilla);
panelMedidas();
pintarBarra();
estiloModo();
estiloMedir();
fijarVista();
listar();
pintar();
iniciar();
setTimeout(() => vista('perspectiva'), 140);
</script>
