<html lang="es">

<title>Presupuesto · Full Service &amp; Clean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --azul: #1a9be0;
  --azul-osc: #0f6fa3;
  --naranja: #f26b21;
  --tinta: #1c1f22;
  --tinta-2: #4a5056;
  --tinta-3: #80868c;
  --linea: #dfe2e5;
  --linea-2: #eef0f2;
  --fondo: #f5f6f7;
  --blanco: #ffffff;
  --ok: #2f8a4c;
  --mal: #c0392b;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--fondo); color: var(--tinta); font-family: var(--sans); font-size: 14px; }
a { color: var(--azul-osc); text-decoration: none; }
a:hover { color: var(--azul); }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
.mono { font-family: var(--mono); }
.num { font-family: var(--mono); text-align: right; white-space: nowrap; }

/* Barra superior */
.barra { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 24px; background: var(--blanco); border-bottom: 1px solid var(--linea); }
.barra-marca { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.barra-marca::before { content: ""; width: 4px; height: 22px; background: var(--azul); border-radius: 2px; }
.barra-nro { font-family: var(--mono); font-size: 13px; color: var(--tinta-2); }
.tabs { display: flex; gap: 2px; padding: 3px; background: var(--fondo); border: 1px solid var(--linea); border-radius: 8px; margin-left: auto; }
.tab { padding: 7px 14px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-weight: 500; color: var(--tinta-2); }
.tab.activo { background: var(--blanco); color: var(--tinta); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.btn { padding: 8px 14px; border: 1px solid var(--linea); border-radius: 7px; background: var(--blanco); cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--tinta-3); }
.btn-pri { background: var(--tinta); color: var(--blanco); border-color: var(--tinta); }
.btn-pri:hover { background: #33383d; }
.btn-chico { padding: 4px 9px; font-size: 12.5px; }
.btn-texto { border: 0; background: transparent; color: var(--azul-osc); cursor: pointer; padding: 4px 6px; font-size: 12.5px; }
.btn-texto:hover { color: var(--azul); }
.btn-quitar { border: 0; background: transparent; color: var(--tinta-3); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 6px; border-radius: 4px; }
.btn-quitar:hover { color: var(--mal); background: #fbeceb; }

/* Edición */
.edicion { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; max-width: 1360px; margin: 0 auto; padding: 24px; align-items: start; }
.bloque { background: var(--blanco); border: 1px solid var(--linea); border-radius: 10px; }
.bloque-tit { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--linea-2); font-weight: 600; }
.bloque-cuerpo { padding: 16px 18px; }
.col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.campos { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 16px; }
.campo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.campo-ancho { grid-column: 1 / -1; }
.etq { font-family: var(--mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--tinta-3); }
.inp { width: 100%; padding: 8px 10px; border: 1px solid var(--linea); border-radius: 6px; background: var(--blanco); }
.inp:focus { outline: 2px solid var(--azul); outline-offset: -1px; border-color: var(--azul); }
textarea.inp { resize: vertical; min-height: 64px; line-height: 1.5; }
.inp-num { text-align: right; font-family: var(--mono); }
.estado-sel { display: flex; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; border: 1px solid transparent; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.rubro { border: 1px solid var(--linea); border-radius: 8px; background: var(--blanco); }
.rubro + .rubro { margin-top: 10px; }
.rubro.fuera { opacity: .6; }
.rubro-cab { display: grid; grid-template-columns: 26px 30px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; }
.rubro-cab:hover { background: #fafbfb; }
.rubro-flecha { width: 26px; height: 26px; border: 0; background: transparent; cursor: pointer; color: var(--tinta-3); font-size: 12px; transition: transform .15s; }
.rubro.abierto .rubro-flecha { transform: rotate(90deg); }
.rubro-n { font-family: var(--mono); font-size: 12px; color: var(--tinta-3); }
.rubro-nom { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rubro-precio { font-family: var(--mono); font-weight: 600; }
.rubro-cuerpo { display: flex; flex-direction: column; gap: 18px; padding: 4px 14px 16px; border-top: 1px solid var(--linea-2); }
.sub-tit { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; margin-bottom: 6px; font-size: 12.5px; font-weight: 600; color: var(--tinta-2); }
.tabla-wrap { overflow-x: auto; border: 1px solid var(--linea-2); border-radius: 6px; }
.tabla { width: 100%; border-collapse: collapse; min-width: 640px; }
.tabla th { padding: 7px 8px; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-3); text-align: left; font-weight: 500; background: #fafbfb; border-bottom: 1px solid var(--linea-2); white-space: nowrap; }
.tabla th.r { text-align: right; }
.tabla td { padding: 3px 4px; border-bottom: 1px solid var(--linea-2); vertical-align: middle; }
.tabla tr:last-child td { border-bottom: 0; }
.tabla .inp { padding: 6px 7px; border-color: transparent; background: transparent; }
.tabla .inp:hover { border-color: var(--linea); }
.tabla .inp:focus { background: var(--blanco); }
.tabla td.tot { padding-right: 10px; font-family: var(--mono); text-align: right; white-space: nowrap; color: var(--tinta-2); }
.tabla tfoot td { padding: 7px 10px; font-weight: 600; background: #fafbfb; border-top: 1px solid var(--linea); }
.otros { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px 14px; }
.rubro-pie { display: flex; flex-wrap: wrap; gap: 8px 20px; padding-top: 10px; border-top: 1px dashed var(--linea); font-size: 12.5px; color: var(--tinta-2); }
.rubro-pie b { font-family: var(--mono); color: var(--tinta); font-weight: 600; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--tinta-2); cursor: pointer; white-space: nowrap; }
.check input { accent-color: var(--azul); width: 15px; height: 15px; margin: 0; }

.totales { position: sticky; top: 76px; }
.tot-fila { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--linea-2); }
.tot-fila:last-child { border-bottom: 0; }
.tot-fila span:first-child { color: var(--tinta-2); }
.tot-fila .num { font-size: 14px; }
.tot-final { margin: 6px -18px; padding: 12px 18px; background: #f2f9fd; border-top: 1px solid #cfe8f6; border-bottom: 1px solid #cfe8f6; }
.tot-final span:first-child { color: var(--tinta); font-weight: 600; }
.tot-final .num { font-size: 18px; font-weight: 600; color: var(--azul-osc); }
.tot-gan .num { color: var(--ok); font-weight: 600; }
.tot-gan.neg .num { color: var(--mal); }
.tot-ajustes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }

/* Hoja de propuesta */
.vista { padding: 28px 16px 60px; }
.print-sheet { width: 820px; max-width: 100%; margin: 0 auto; padding: 52px 56px 44px; background: var(--blanco); border: 1px solid var(--linea); box-shadow: 0 2px 14px rgba(0,0,0,.06); font-size: 12.5px; line-height: 1.55; color: var(--tinta); }
.hs-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 28px; padding-bottom: 20px; border-bottom: 2px solid var(--tinta); }
.hs-emp { display: flex; gap: 18px; align-items: flex-start; min-width: 0; }
.hs-logo { max-height: 100px; max-width: 170px; object-fit: contain; }
.hs-emp-txt { display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; color: var(--tinta-2); padding-top: 4px; }
.hs-emp-txt b { font-size: 14px; color: var(--tinta); }
.hs-doc { text-align: right; flex: none; }
.hs-doc-tit { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.hs-doc-tit::after { content: ""; display: block; width: 36px; height: 3px; background: var(--naranja); margin: 6px 0 8px auto; }
.hs-doc .mono { font-size: 12px; color: var(--tinta-2); }
.hs-cli { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 28px; padding: 18px 0; border-bottom: 1px solid var(--linea); }
.hs-dato { display: flex; flex-direction: column; gap: 1px; }
.hs-dato .etq { font-size: 9.5px; }
.hs-tabla { width: 100%; border-collapse: collapse; margin-top: 20px; }
.hs-tabla th { padding: 7px 6px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--tinta-3); text-align: left; font-weight: 500; border-bottom: 1px solid var(--tinta); }
.hs-tabla th.r { text-align: right; }
.hs-tabla td { padding: 9px 6px; border-bottom: 1px solid var(--linea); vertical-align: top; }
.hs-tabla td.n { width: 28px; font-family: var(--mono); color: var(--tinta-3); }
.hs-tabla tr { break-inside: avoid; }
.hs-desc { white-space: pre-line; color: var(--tinta-2); font-size: 11.5px; margin-top: 3px; }
.hs-tot { display: flex; justify-content: flex-end; margin-top: 14px; }
.hs-tot-caja { width: 300px; }
.hs-tot-caja .tot-fila { padding: 5px 0; font-size: 12.5px; }
.hs-tot-caja .hs-total { margin-top: 4px; padding: 9px 0 0; border-top: 2px solid var(--tinta); border-bottom: 0; font-weight: 700; font-size: 14px; }
.hs-tot-caja .hs-total span:first-child { color: var(--tinta); }
.hs-cond3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 26px; border: 1px solid var(--linea); border-radius: 4px; }
.hs-cond3 > div { padding: 10px 12px; }
.hs-cond3 > div + div { border-left: 1px solid var(--linea); }
.hs-cond { margin-top: 18px; break-inside: avoid; }
.hs-cond ol { margin: 6px 0 0; padding-left: 18px; color: var(--tinta-2); font-size: 11.5px; }
.hs-firmas { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; margin-top: 40px; break-inside: avoid; }
.hs-firma { display: flex; flex-direction: column; gap: 6px; }
.hs-firma-zona { position: relative; height: 96px; }
.hs-firma-img { position: absolute; left: 28px; bottom: 6px; width: 90px; z-index: 2; }
.hs-sello-img { position: absolute; left: 88px; bottom: -14px; width: 150px; opacity: .92; z-index: 1; }
.hs-linea { border-top: 1px solid var(--tinta); }
.hs-firma-nom { font-weight: 600; }
.hs-firma-cargo { font-size: 11.5px; color: var(--tinta-2); }
.hs-pie { margin-top: 30px; padding-top: 10px; border-top: 1px solid var(--linea); font-size: 10px; color: var(--tinta-3); display: flex; justify-content: space-between; gap: 12px; }

.oculto { display: none !important; }

@media (max-width: 1080px) {
  .edicion { grid-template-columns: minmax(0, 1fr); }
  .totales { position: static; }
}
@media (max-width: 720px) {
  .print-sheet { padding: 28px 22px; }
  .hs-cab { flex-direction: column; }
  .hs-doc { text-align: left; }
  .hs-doc-tit::after { margin-left: 0; }
  .hs-cli, .hs-firmas, .hs-cond3 { grid-template-columns: 1fr; }
  .hs-cond3 > div + div { border-left: 0; border-top: 1px solid var(--linea); }
}
@media print {
  @page { size: A4; margin: 12mm; }
  html, body { background: #fff; }
  .noprint { display: none !important; }
  .vista { padding: 0; display: block !important; }
  .print-sheet { width: auto; max-width: none; margin: 0; padding: 0; border: 0; box-shadow: none; }
}
</style>
