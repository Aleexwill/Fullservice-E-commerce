<script type="module">
import * as T from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const $ = (i) => document.getElementById(i);
const r = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setPixelRatio(Math.min(2, devicePixelRatio || 1)); r.shadowMap.enabled = true; r.shadowMap.type = T.PCFSoftShadowMap;
r.toneMapping = T.ACESFilmicToneMapping; r.outputColorSpace = T.SRGBColorSpace; $('v').appendChild(r.domElement);
const sc = new T.Scene(); sc.background = new T.Color('#cfdde6'); sc.environment = new T.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const cam = new T.PerspectiveCamera(40, 1, 0.05, 3000);
sc.add(new T.HemisphereLight('#ffffff', '#7d8a70', 0.6));
const sun = new T.DirectionalLight('#fff4e0', 1.7); sun.position.set(40, 60, 25); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, far: 200 }); sun.shadow.bias = -0.0004; sc.add(sun);
const ctl = new OrbitControls(cam, r.domElement); ctl.enableDamping = true; ctl.minDistance = 0.8; ctl.maxDistance = 220; ctl.screenSpacePanning = true; ctl.maxPolarAngle = Math.PI * 0.62;
ctl.addEventListener('change', () => { const d = cam.position.distanceTo(ctl.target); cam.near = Math.max(0.02, d / 500); cam.updateProjectionMatrix(); });
const fit = () => { const w = innerWidth || 800, h = innerHeight || 560; r.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); };
addEventListener('resize', fit); new ResizeObserver(fit).observe($('v')); fit(); requestAnimationFrame(fit);
(function loop() { requestAnimationFrame(loop); ctl.update(); r.render(sc, cam); })();

const texC = (w, h, draw, rep) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; if (rep) t.repeat.set(...rep); t.colorSpace = T.SRGBColorSpace; t.anisotropy = 8; return t; };
const ruido = (x, w, h, base, a) => { x.fillStyle = base; x.fillRect(0, 0, w, h); for (let i = 0; i < w * h / 5; i++) { x.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,' + a + ')' : 'rgba(0,0,0,' + a + ')'; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); } };
const tH = texC(256, 256, (x, w, h) => { ruido(x, w, h, '#bdb9b0', 0.06); x.strokeStyle = 'rgba(60,60,60,.25)'; x.lineWidth = 2; x.strokeRect(0, 0, w, h); }, [12, 12]);
const tP = texC(256, 256, (x, w, h) => ruido(x, w, h, '#5f7f3c', 0.12), [16, 16]);
const tA = texC(256, 256, (x, w, h) => ruido(x, w, h, '#3c3e41', 0.05), [20, 2]);
const tChapa = texC(64, 64, (x, w, h) => { for (let i = 0; i < 8; i++) { x.fillStyle = i % 2 ? '#8e959b' : '#a9b0b6'; x.fillRect(0, i * 8, w, 8); } for (let i = 0; i < 40; i++) { x.fillStyle = 'rgba(40,40,40,.35)'; x.fillRect(Math.random() * w, Math.random() * h, 3, 1); } }, [3, 3]);
const M = (c, o) => new T.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.7 }, o || {}));
const capas = {}, pick = [];
['terreno', 'estacion', 'vehiculos', 'equipos', 'tapas', 'canos', 'estero'].forEach(k => { capas[k] = new T.Group(); sc.add(capas[k]); });
const reg = (m, n, d, cap, ex) => { m.userData = { n, d, x: ex || '' }; m.castShadow = true; m.receiveShadow = true; if (n) pick.push(m); capas[cap].add(m); return m; };
const box = (w, h, d, x, y, z, mat, n, ds, cap, ex) => { const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); return reg(m, n, ds, cap, ex); };
const cyl = (rt, rb, h, x, y, z, mat, n, ds, cap, seg, ex) => { const m = new T.Mesh(new T.CylinderGeometry(rt, rb, h, seg || 32), mat); m.position.set(x, y, z); return reg(m, n, ds, cap, ex); };
const pipe = (pts, rr, mat, n, ds, cap) => { for (let i = 1; i < pts.length; i++) { const A = new T.Vector3(...pts[i - 1]), B = new T.Vector3(...pts[i]), v = B.clone().sub(A), L = v.length(); if (L < 1e-3) continue; const m = new T.Mesh(new T.CylinderGeometry(rr, rr, L, 14), mat); m.position.copy(A).add(B).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), v.normalize()); reg(m, n, ds, cap); if (i > 1) { const c = new T.Mesh(new T.SphereGeometry(rr * 1.15, 12, 8), mat); c.position.copy(A); reg(c, n, ds, cap); } } };


// Coordenadas tomadas de la foto satelital (≈ 0,08 m por píxel). Norte (ruta) hacia z negativo.
const mPasto = M('#5f7f3c', { map: tP, roughness: 1 }), mTierra = M('#a58a62', { roughness: 1 }), mHorm = M('#bdb9b0', { map: tH, roughness: 0.9 });
box(70, 0.2, 60, -6, -0.1, -2, mPasto, 'Área verde', '', 'terreno');
const tierraA = box(8, 0.21, 24, -11.5, -0.09, -6, mTierra, 'Zona de tierra / acceso', '', 'terreno'); tierraA.rotation.y = 0.35;
box(70, 0.05, 4, -6, 0.03, -27, M('#3c3e41', { map: tA }), 'Ruta', '', 'terreno');
for (let x = -40; x < 30; x += 6) box(3, 0.01, 0.15, x, 0.06, -27, M('#f2f2ee'), '', '', 'terreno');
// ---------- edificaciones existentes (según la imagen)
const mFach = M('#f1ede4', { roughness: 0.8 }), mChapa = M('#b9bfc4', { map: tChapa, metalness: 0.6, roughness: 0.4 }), mNar = M('#e3895e', { roughness: 0.6 }), mRojo = M('#d52b1e', { roughness: 0.45 }), mAma = M('#f7c300', { roughness: 0.45 });
// market con techo colgante
const mk = new T.Group(); mk.position.set(-23, 0, 6); mk.rotation.y = 0.22; capas.estacion.add(mk);
const addG = (g, w, h, d, x, y, z, m, n, ds) => { const o = new T.Mesh(new T.BoxGeometry(w, h, d), m); o.position.set(x, y, z); reg(o, n, ds || '', 'estacion'); g.add(o); return o; };
const mVid = M('#8fb4c9', { roughness: 0.15, metalness: 0.3 });
addG(mk, 24, 3.6, 21, 2, 1.8, 1.5, mFach, 'Oficinas', 'Bloque de oficinas con paredes · origen de las salidas de baños y cocina');
addG(mk, 24.6, 0.25, 21.6, 2, 3.72, 1.5, mChapa, 'Techo de las oficinas');
for (let k = 0; k < 7; k++) { addG(mk, 1.8, 1.2, 0.06, -8 + k * 3.4, 1.9, -9.02, mVid, 'Ventana de oficina'); addG(mk, 1.8, 1.2, 0.06, -8 + k * 3.4, 1.9, 12.02, mVid, 'Ventana de oficina'); }
for (let k = 0; k < 6; k++) addG(mk, 0.06, 1.2, 1.8, 14.02, 1.9, -7 + k * 3.5, mVid, 'Ventana de oficina');
addG(mk, 1.2, 2.2, 0.08, 10, 1.1, -9.04, M('#6d5a42'), 'Puerta de acceso a oficinas');
// techo de playa (canopy) con surtidores
const tp = new T.Group(); tp.position.set(-24, 0, -12.5); tp.rotation.y = 0.22; capas.estacion.add(tp);
// faja del techo de playa con los colores de la foto: blanco arriba, banda amarilla y línea roja abajo
const tFaja = texC(512, 64, (x, w, h) => { x.fillStyle = '#f7f5f0'; x.fillRect(0, 0, w, h); x.fillStyle = '#f7c300'; x.fillRect(0, h * 0.42, w, h * 0.38); x.fillStyle = '#d52b1e'; x.fillRect(0, h * 0.8, w, h * 0.2); });
const mFaja = M('#ffffff', { map: tFaja, roughness: 0.45 });
addG(tp, 15, 0.25, 10, 0, 6.0, 0, M('#f4f2ee'), 'Techo de playa', 'Cubierta de la zona de surtidores');
addG(tp, 15.2, 1.0, 10.2, 0, 5.45, 0, [mFaja, mFaja, M('#f4f2ee'), M('#e8e5df'), mFaja, mFaja], 'Faja del techo de playa', 'Blanco con banda amarilla y línea roja');
// emblema sobre la faja (frente hacia la avenida)
const tLogo = texC(256, 256, (x, w, h) => { x.fillStyle = '#f2f0ea'; x.fillRect(0, 0, w, h); x.fillStyle = '#d52b1e'; x.beginPath(); x.arc(w / 2, h * 0.62, w * 0.36, Math.PI, 0); x.lineTo(w * 0.62, h * 0.9); x.lineTo(w * 0.38, h * 0.9); x.closePath(); x.fill();
  x.fillStyle = '#f7c300'; x.beginPath(); x.arc(w / 2, h * 0.62, w * 0.3, Math.PI, 0); x.lineTo(w * 0.59, h * 0.84); x.lineTo(w * 0.41, h * 0.84); x.closePath(); x.fill();
  x.strokeStyle = '#d52b1e'; x.lineWidth = 6; for (let k = -3; k <= 3; k++) { x.beginPath(); x.moveTo(w / 2, h * 0.84); x.lineTo(w / 2 + Math.sin(k * 0.38) * w * 0.3, h * 0.62 - Math.cos(k * 0.38) * w * 0.3); x.stroke(); } });
const lg = addG(tp, 2.2, 2.0, 0.6, 0, 6.3, -5.45, [M('#f2f0ea'), M('#f2f0ea'), M('#f2f0ea'), M('#f2f0ea'), M('#f2f0ea'), M('#ffffff', { map: tLogo, roughness: 0.5 })], 'Emblema de la estación', '');

[[-4.5, 0], [4.5, 0]].forEach(([x, z]) => { addG(tp, 0.6, 5.2, 0.6, x, 2.6, z, M('#e8e5df'), 'Columna del techo de playa'); addG(tp, 1.6, 1.8, 0.7, x, 0.9, z + 1.4, M('#f1efe9'), 'Surtidor', ''); addG(tp, 1.6, 0.3, 0.72, x, 1.6, z + 1.4, mAma, 'Surtidor'); });
// segundo techo de playa, al costado izquierdo de las oficinas
const tp2 = new T.Group(); tp2.position.set(-41, 0, 9); tp2.rotation.y = 0.22; capas.estacion.add(tp2);
addG(tp2, 9, 0.25, 13, 0, 6.0, 0, M('#f4f2ee'), 'Techo de playa N° 2', 'Cubierta de surtidores');
addG(tp2, 9.2, 1.0, 13.2, 0, 5.45, 0, mFaja, 'Faja del techo de playa N° 2', 'Blanco con banda amarilla y línea roja');
[[0, -3.5], [0, 3.5]].forEach(([x, z]) => { addG(tp2, 0.6, 5.2, 0.6, x, 2.6, z, M('#e8e5df'), 'Columna del techo de playa'); addG(tp2, 0.7, 1.8, 1.6, x + 1.4, 0.9, z, M('#f1efe9'), 'Surtidor'); addG(tp2, 0.72, 0.3, 1.6, x + 1.4, 1.6, z, mAma, 'Surtidor'); });
// patio de hormigón donde estaba el edificio lateral (se retira del diseño)
box(13, 0.06, 26, 14, 0.02, -4, mHorm, 'Patio', 'Área libre de hormigón', 'terreno');
const arbol = (x, z, s) => { cyl(0.18 * s, 0.25 * s, 2.4 * s, x, 1.2 * s, z, M('#5b4630'), '', '', 'estacion'); const c = new T.Mesh(new T.IcosahedronGeometry(2.3 * s, 1), M('#2f4a26', { roughness: 1 })); c.position.set(x, 3.4 * s, z); reg(c, 'Árbol', '', 'estacion'); };
arbol(-17, -22, 1.2);

// ---------- PLANTA DE TRATAMIENTO según la imagen
const mPVC = M('#e9e4d4', { roughness: 0.35 }), mHA = M('#a9a59c', { map: tH, roughness: 0.9 }), mTq = M('#1f2421', { roughness: 0.5 });
const tapaHA = (w, d, x, z, n) => box(w, 0.08, d, x, 0.05, z, M('#9a978f', { map: tH }), 'Tapa de H°A° · ' + n, '', 'tapas');
// (A) cámara de grasas (salida de cocina)
const CG = [0, 6.4];
pipe([[-7.6, -0.45, 8.8], [CG[0] - 0.55, -0.5, CG[1] + 0.2]], 0.05, mPVC, 'Salida de cocina PVC Ø 100 mm', 'Desde el market', 'canos');
cyl(0.5, 0.5, 0.9, CG[0], -0.45, CG[1], M('#5b6c75'), 'Cámara de grasas', 'Retiene las grasas de la cocina antes del sistema', 'equipos', 32, 'Ø 1,00 m × 0,90 m');
cyl(0.58, 0.58, 0.08, CG[0], 0.05, CG[1], M('#9a978f', { map: tH }), 'Tapa de H°A° · cámara de grasas', '', 'tapas', 32);
// (B) registro de entrada (cuadrado negro)
const RE = [4.8, 2.4];
box(1.0, 0.9, 1.0, RE[0], -0.5, RE[1], mHA, 'Registro de entrada', 'Recibe la salida de baños y la de la cámara de grasas', 'equipos', '1,00 × 1,00 × 0,90 m'); tapaHA(1.1, 1.1, RE[0], RE[1], 'registro de entrada');
pipe([[-10.4, -0.5, 3.8], [RE[0] - 0.5, -0.55, RE[1]]], 0.06, mPVC, 'Salida de baños PVC Ø 100 mm', 'Desde el market · pendiente 1 %', 'canos');
pipe([[CG[0] + 0.45, -0.6, CG[1] - 0.25], [RE[0] - 0.35, -0.6, RE[1] + 0.45]], 0.06, mPVC, 'Cañería PVC Ø 100 mm · cámara de grasas → registro', '', 'canos');
// (C) dos biodigestores UNIFAM (círculos negros)
const UN = [[-0.6, -0.8], [5.4, -2.8]];
const RS = [1.8, -4.6];
UN.forEach(([x, z], i) => { const n = i + 1, nm = 'UNIFAM N° ' + n + ' · Tigre', ds = 'Tratamiento biológico con biomasa inmovilizada · eficiencia > 95 % · sin lodo excedente', ex = 'Cuerpo Ø 1,40 m · 2 bocas de inspección con tapa';
  const mG = M('#8d9397', { roughness: 0.55 }), mG2 = M('#7d8387', { roughness: 0.55 }), mT = M('#9aa0a4', { roughness: 0.6 });
  const yTop = 0.06, hN = 0.62, yD = yTop - hN, R = 0.72, hC = 1.25, yC = yD - 0.35 - hC;
  box(1.9, 0.15, 1.9, x, yC - 0.1, z, mHA, 'Base de hormigón', nm, 'equipos');
  const rel = new T.Mesh(new T.CylinderGeometry(1.0, 1.0, yTop - yC, 32, 1, true), M('#d1c39f', { transparent: true, opacity: 0.22, side: T.DoubleSide, depthWrite: false })); rel.position.set(x, (yTop + yC) / 2, z); reg(rel, 'Relleno de arena compactada', nm, 'equipos');
  // cuerpo corrugado
  cyl(R * 0.94, R * 0.9, 0.08, x, yC + 0.04, z, mG2, nm, ds, 'equipos', 40, ex);
  cyl(R, R * 0.94, hC, x, yC + hC / 2 + 0.06, z, mG, nm, ds, 'equipos', 40, ex);
  for (let k = 0; k < 10; k++) { const rg = new T.Mesh(new T.TorusGeometry(R * (0.95 + k * 0.005), 0.035, 8, 40), mG2); rg.rotation.x = Math.PI / 2; rg.position.set(x, yC + 0.18 + k * (hC - 0.2) / 9, z); reg(rg, nm, ds, 'equipos', ex); }
  // domo superior
  const dm = new T.Mesh(new T.SphereGeometry(R, 40, 16, 0, Math.PI * 2, 0, Math.PI / 2), mG); dm.scale.y = 0.5; dm.position.set(x, yC + hC + 0.06, z); reg(dm, nm, ds, 'equipos', ex);
  // dos torres de inspección con anillos y tapa ranurada
  [[-0.3, 0.55, 'Boca de inspección y entrada'], [0.32, 0.5, 'Boca de inspección y salida']].forEach(([o, rr, t], j) => { const cx = x + o, cy0 = yD - 0.05;
    cyl(rr * 0.5, rr * 0.55, hN + 0.05, cx, cy0 + (hN + 0.05) / 2, z, mG, t + ' · UNIFAM N° ' + n, 'Torre prolongadora hasta el nivel del terreno', 'equipos', 32);
    for (let k = 0; k < 4; k++) { const rg = new T.Mesh(new T.TorusGeometry(rr * 0.53, 0.02, 8, 32), mG2); rg.rotation.x = Math.PI / 2; rg.position.set(cx, cy0 + 0.12 + k * 0.12, z); reg(rg, t, '', 'equipos'); }
    cyl(rr * 0.56, rr * 0.56, 0.06, cx, yTop - 0.02, z, mT, 'Tapa con rejilla · ' + t, 'Tapa roscada de inspección', 'tapas', 32);
    for (let k = -3; k <= 3; k++) box(rr * 0.85, 0.012, 0.02, cx, yTop + 0.015, z + k * 0.04, M('#6f7579'), '', '', 'tapas');
  });

  cyl(0.06, 0.06, 0.45, x + 0.02, yD + 0.2, z - 0.32, mG2, 'Conexión de aire / ventilación', 'Recibe el aire del soplador', 'equipos', 16);
  pipe([[RE[0], -0.6, RE[1] - 0.5], [x + 0.2, -0.55, z + 0.8]], 0.06, mPVC, 'Ramal PVC Ø 100 mm al biodigestor N° ' + n, 'Desde el registro de entrada', 'canos');
  pipe([[x, yD + 0.28, z - 0.75], [RS[0] + (i ? 0.25 : -0.25), -0.75, RS[1] + 0.3]], 0.06, mPVC, 'Salida tratada del biodigestor N° ' + n, 'Hacia el registro de salida', 'canos'); });
// soplador
const CS = [6.6, 0.4];
box(1.4, 1.3, 1.2, CS[0], 0.65, CS[1], M('#c9c4b8', { map: tH }), 'Caseta del soplador', 'Mampostería con tapa metálica y ventilación', 'equipos', '1,40 × 1,20 × 1,30 m');
box(1.5, 0.08, 1.3, CS[0], 1.34, CS[1], M('#7d858b', { metalness: 0.7, roughness: 0.35 }), 'Tapa metálica de la caseta', '', 'tapas');
const mAire = M('#9aa0a6', { metalness: 0.6 });
pipe([[CS[0] - 0.7, 0.3, CS[1]], [5.42, 0.3, CS[1]], [5.42, 0.3, -2.48]], 0.03, mAire, 'Línea de aire del soplador', 'Al biodigestor N° 2', 'canos');
pipe([[5.42, 0.3, 0.4], [-0.58, 0.3, 0.4], [-0.58, 0.3, -0.48]], 0.03, mAire, 'Línea de aire del soplador', 'Al biodigestor N° 1', 'canos');
pipe([[CS[0] - 0.7, -0.4, CS[1] + 0.4], [CS[0] - 0.7, -0.4, 4.6], [-10.5, -0.4, 4.6]], 0.02, M('#2b2b2b'), 'Alimentación eléctrica del soplador', 'Desde el tablero de las oficinas · cable en caño subterráneo', 'canos');
// (D) registro de salida (rectángulo rojo chico)
box(0.7, 0.8, 0.5, RS[0], -0.55, RS[1], mHA, 'Registro de salida', 'Une las salidas de los dos biodigestores', 'equipos'); tapaHA(0.8, 0.6, RS[0], RS[1], 'registro de salida');
// (E) reservorio de 2.000 L con cámara de cloración (contorno rojo, donde estaban los camiones)
const RV = [-1.0, -10.2];
const rv = new T.Group(); rv.position.set(RV[0], 0, RV[1]); rv.rotation.y = 0.35; capas.equipos.add(rv);
const tq = new T.Mesh(new T.CapsuleGeometry(0.62, 2.6, 8, 24), mTq); tq.rotation.x = Math.PI / 2; tq.position.set(0, -0.95, 1.2); reg(tq, 'Reservorio de 2.000 L', 'Tanque regulador del efluente tratado', 'equipos', '1,24 m × 3,8 m'); rv.add(tq);

const ray = new T.Raycaster(), mp = new T.Vector2(); let hov = null;

r.domElement.addEventListener('pointermove', (e) => { const b = r.domElement.getBoundingClientRect(); mp.set((e.clientX - b.left) / b.width * 2 - 1, -(e.clientY - b.top) / b.height * 2 + 1); ray.setFromCamera(mp, cam);
  const h = ray.intersectObjects(pick, false).find(x => vis(x.object) && !(x.object.material.transparent && x.object.material.opacity < 0.4 && !/Relleno/.test(x.object.userData.n)));
  if (hov && (!h || h.object !== hov.o)) { hov.o.material = hov.m; hov = null; }
