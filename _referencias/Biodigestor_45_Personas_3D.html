  const yK = yH0 - 0.62, mK = M('#7b8a84', { transparent: true, opacity: 0.45, side: T.DoubleSide, depthWrite: false });
  const cesta = new T.Mesh(new T.CylinderGeometry(rN * 0.9, rN * 0.75, 0.75, 24, 1, true), mK); cesta.position.set(x - 0.08, yK, z); reg(cesta, '③ Filtro biológico', 'Canasta con aros de plástico donde se fijan las bacterias', 'equipos');
  for (let k = 0; k < 14; k++) { const a = k * 2.3, rr = 0.12 + (k % 3) * 0.08, aro = new T.Mesh(new T.TorusGeometry(0.05, 0.015, 6, 10), M('#2b2b2b')); aro.position.set(x - 0.08 + Math.cos(a) * rr, yK - 0.3 + (k % 5) * 0.14, z + Math.sin(a) * rr); aro.rotation.set(a, a * 0.7, 0); reg(aro, 'Aros del filtro biológico', '', 'equipos'); }
  // tubo central de extracción de lodos: desde la tapa hasta el fondo
  const mT = M('#d9dbd6', { roughness: 0.4 });
  pipe([[x + 0.1, yTop - 0.02, z], [x + 0.1, yF0 + 0.12, z]], 0.045, mT, '⑥ Tubo de extracción de lodos', 'Baja hasta el fondo cónico donde se acumula el lodo (⑤)', 'equipos');
  // entrada y salida
  const yIn = yN0 + 0.08, yOut = yN0 - 0.04;
  cyl(0.065, 0.065, 0.4, x, yIn, z - rN - 0.12, mPVC, '① Entrada de aguas residuales Ø 100 mm', 'Llega del distribuidor de caudal', 'canos').rotation.x = Math.PI / 2;
  pipe([[x, yIn, z - rN + 0.05], [x - 0.12, yIn, z - 0.12], [x - 0.12, yF0 + hF * 0.6, z - 0.12]], 0.05, mT, '② Tubo de entrada', 'Lleva el agua al fondo', 'equipos');
  cyl(0.065, 0.065, 0.4, x, yOut, z + rN + 0.12, mPVC, '④ Salida del efluente tratado Ø 100 mm', 'Hacia el colector y el pozo ciego', 'canos').rotation.x = Math.PI / 2;
  // tapa de H°A° al ras del piso
  box(1.6, 0.15, 1.6, x, yS - 0.075, z, M('#9a978f', { map: tHorm, roughness: 0.85 }), 'Tapa de H°A° · ' + nm, '1,60 × 1,60 m · hierro Ø 8 c/15 cm · al ras del piso', 'tapas');
  box(0.7, 0.16, 0.7, x, yS - 0.07, z, mRej, 'Registro metálico sobre la tapa', '', 'tapas');
  [-0.2, 0.2].forEach(o => box(0.12, 0.03, 0.03, x + o, yS + 0.01, z, mRej, 'Manija de izaje', '', 'tapas'));
  // nivel del caño horizontal al secado: a la altura del hombro (como en el esquema)
  return { base, top: yTop, inZ: z - rN - 0.32, outZ: z + rN + 0.32, yIn, yOut, xv: x + 0.1, yV: yH0 + 0.02 };
};
const B = bxs.map((x, i) => biodigestor(x, bz, i + 1));
// sistema de secado: balde cónico con borde ancho arriba, tapa al mismo nivel que el biodigestor
const secado = (x, z, n, b) => {
  const nm = 'Sistema de secado N° ' + n, ds = 'Recibe el lodo del biodigestor N° ' + n + ' · drena el agua y deja el lodo seco', ex = '260 L · Ø 0,84 m arriba · 1,05 m de alto';
  const yT = b.top, hS = 1.05, y0 = yT - hS;
  box(0.9, 0.08, 0.9, x, y0 - 0.06, z, mHA, 'Base con lecho de grava', nm, 'tapas');
  const mB = M('#e9e8e4', { roughness: 0.55, transparent: true, opacity: 0.8, side: T.DoubleSide });
  const cub = new T.Mesh(new T.CylinderGeometry(0.42, 0.3, hS, 32, 1, true), mB); cub.position.set(x, y0 + hS / 2, z); reg(cub, nm, ds, 'equipos', ex);
  cyl(0.3, 0.3, 0.03, x, y0 + 0.015, z, mB, nm + ' · fondo filtrante', ds, 'equipos');
  const rim = new T.Mesh(new T.CylinderGeometry(0.52, 0.52, 0.04, 32), M('#f2f1ed', { roughness: 0.5 })); rim.position.set(x, yT + 0.02, z); reg(rim, 'Borde superior del sistema de secado', 'A nivel del cuello del biodigestor', 'equipos');
  cyl(0.29, 0.29, 0.12, x, y0 + 0.08, z, M('#4a3b2a', { roughness: 1 }), 'Lodo en secado', '', 'equipos');
  // caño horizontal recto desde el tubo central del biodigestor al secado, con registro junto a la pared del secado
  const yL = b.yV, xin = x - 0.42 + (yT - yL) * (0.12 / hS);
  pipe([[b.xv, yL, z], [xin, yL, z]], 0.032, mLodo, 'Caño de lodos PVC Ø 50 mm', 'Recto y a nivel · tubo central del biodigestor N° ' + n + ' → secado', 'canos');
  cyl(0.055, 0.055, 0.12, xin - 0.14, yL, z, M('#c8261c', { roughness: 0.4, metalness: 0.3 }), '⑦ Registro de lodos (cerrado)', 'Se abre cada 12 a 24 meses para pasar el lodo al secado', 'canos').rotation.z = Math.PI / 2;
  box(0.03, 0.12, 0.02, xin - 0.14, yL + 0.1, z, M('#c8261c'), 'Palanca del registro', '', 'canos');
  pipe([[x, y0 + 0.02, z], [x, y0 - 0.2, z], [x, y0 - 0.2, z + 0.6]], 0.022, M('#7da35a'), 'Drenaje del agua del lodo', 'Vuelve al sistema', 'canos');
  box(1.2, 0.15, 1.2, x, yS - 0.075, z, M('#9a978f', { map: tHorm }), 'Tapa de H°A° · ' + nm, '1,20 × 1,20 m · al ras del piso', 'tapas');
};
if (conSec) bxs.forEach((x, i) => secado(x + 1.75, bz, i + 1, Object.assign({ x }, B[i])));
// caja de grasa
const cg = [-7.5, -4.2], yCg = yF - 0.95;
box(0.85, 0.9, 0.7, cg[0], yCg + 0.45, cg[1], M('#5b6c75', { roughness: 0.5 }), 'Caja de grasa 260 L', 'Separa y retiene las grasas de las cocinas de los 15 departamentos antes del sistema', 'equipos', '0,85 × 0,70 × 0,90 m');
box(0.6, 0.6, 0.02, cg[0], yCg + 0.45, cg[1], M('#3f4b52'), 'Tabique deflector interno', '', 'equipos');
box(1.05, 0.15, 0.9, cg[0], yS - 0.075, cg[1], M('#9a978f', { map: tHorm }), 'Tapa de H°A° · caja de grasa', 'Con manijas · limpieza mensual', 'tapas');
// distribuidor de caudal con rejilla trampa
const dz = [0, -3.0], yD = yF - 0.8;
box(1.3, 0.7, 0.9, dz[0], yD + 0.35, dz[1], M('#bdb8ae', { map: tHorm }), 'Distribución de caudal con rejilla trampa', 'Módulo 1 × 4 salidas · reparte el agua en partes iguales a los 3 biodigestores', 'equipos', '1,30 × 0,90 × 0,70 m');
for (let k = 0; k < 7; k++) box(0.02, 0.02, 0.8, dz[0] - 0.4 + k * 0.13, yD + 0.55, dz[1], mRej, 'Rejilla trampa de sólidos', 'Retiene sólidos gruesos', 'equipos');
box(1.5, 0.15, 1.1, dz[0], yS - 0.075, dz[1], M('#9a978f', { map: tHorm }), 'Tapa de H°A° · distribuidor', '', 'tapas');

// ---------- cañerías: bajadas de los departamentos colgadas de la losa
const yC = -0.45;
const bajada = (x, z, tipo) => { const neg = tipo === 'n', rr = neg ? 0.06 : 0.05, mm = neg ? mPVC : mPVCo, nm = neg ? 'Columna de aguas negras Ø 100 mm' : 'Columna de cocinas Ø 75 mm', ds = neg ? 'Baños de los departamentos' : 'Piletas de cocina';
  pipe([[x, NP * PISO + 1, z], [x, 0, z]], rr, mm, nm, ds, 'torre'); pipe([[x, 0, z], [x, yC, z]], rr, mm, nm, ds, 'canos'); };
const sop = (x, z) => { box(0.03, 0.4, 0.03, x, yC + 0.2, z, mRej, 'Soporte colgante con abrazadera', 'Cada 1,50 m', 'canos'); };
// tres columnas negras y una de cocinas que bajan a la losa del subsuelo
[[-6, -6.5, 'n'], [0, -6.5, 'n'], [6, -6.5, 'n'], [-7.5, -7.4, 'g']].forEach(([x, z, t]) => bajada(x, z, t));
pipe([[-6, yC, -6.5], [6, yC, -6.5]], 0.065, mPVC, 'Colector de aguas negras Ø 110 mm', 'Colgado bajo la losa · pendiente 1 %', 'canos');
for (let x = -5; x <= 5; x += 1.5) sop(x, -6.5);
pipe([[0, yC, -6.5], [0, yC, -4.5], [0, yS + 0.3, -4.5], [0, yS + 0.3, dz[1] - 0.6], [0, yD + 0.55, dz[1] - 0.6], [0, yD + 0.55, dz[1] - 0.45]], 0.065, mPVC, 'Bajada de aguas negras al distribuidor', 'PVC Ø 110 mm', 'canos');
pipe([[-7.5, yC, -7.4], [-7.5, yS + 0.3, -7.4], [-7.5, yS + 0.3, cg[1] - 0.6], [cg[0], yCg + 0.7, cg[1] - 0.6], [cg[0], yCg + 0.7, cg[1] - 0.35]], 0.05, mPVCo, 'Bajada de cocinas a la caja de grasa', 'PVC Ø 75 mm', 'canos');
pipe([[cg[0] + 0.42, yCg + 0.6, cg[1]], [-2, yCg + 0.6, cg[1]], [-2, yD + 0.5, dz[1]], [dz[0] - 0.65, yD + 0.5, dz[1]]], 0.055, mPVC, 'Caja de grasa → distribuidor', 'PVC Ø 100 mm · pendiente 2 %', 'canos');
// ramales del distribuidor a cada biodigestor
B.forEach((b, i) => { const x = bxs[i]; pipe([[dz[0] + (i - 1) * 0.35, yD + 0.3, dz[1] + 0.45], [dz[0] + (i - 1) * 0.35, yD + 0.3, -1.4], [x, yD + 0.3, -1.4], [x, b.yIn, -1.4], [x, b.yIn, b.inZ]], 0.06, mPVC, 'Ramal Ø 100 mm al biodigestor N° ' + (i + 1), 'Desde la salida ' + (i + 1) + ' del distribuidor · pendiente 2 %', 'canos'); });
// colector de efluente y salida al pozo ciego existente
const zc = bz + 2.6;
B.forEach((b, i) => pipe([[bxs[i], b.yOut, b.outZ], [bxs[i], b.yOut - 0.05, zc]], 0.06, mPVC, 'Salida del efluente · Biodigestor N° ' + (i + 1), 'PVC Ø 100 mm', 'canos'));
pipe([[bxs[0], B[0].yOut - 0.05, zc], [bxs[2], B[0].yOut - 0.05, zc]], 0.065, mPVC, 'Colector del efluente tratado Ø 100 mm', 'Une las 3 salidas', 'canos');
const pz = [0.8, 6.8];
pipe([[pz[0], B[0].yOut - 0.05, zc], [pz[0], B[0].yOut - 0.15, pz[1] - 1.25]], 0.065, mPVC, 'Efluente al pozo ciego existente', 'PVC Ø 100 mm · pendiente 2 %', 'canos');
const pc = new T.Mesh(new T.CylinderGeometry(1.2, 1.2, 3.0, 40, 1, true), M('#6f4a35', { transparent: true, opacity: 0.6, side: T.DoubleSide })); pc.position.set(pz[0], yF - 1.6, pz[1]); reg(pc, 'Pozo ciego existente', 'Bajo el piso del estacionamiento · recibe el efluente ya tratado · no se modifica', 'equipos', 'Ø 2,40 m');
cyl(1.2, 1.2, 0.2, pz[0], yF - 3.0, pz[1], M('#8a7a62', { roughness: 1 }), 'Fondo del pozo ciego · infiltración', '', 'equipos');
box(2.6, 0.15, 2.6, pz[0], yS - 0.075, pz[1], M('#8a8580', { map: tHorm }), 'Tapa del pozo ciego existente', 'Al ras del piso del estacionamiento', 'tapas');

if (!conCg) pick.filter(m => /caja de grasa|Tabique deflector/i.test(m.userData.n)).forEach(m => m.visible = false);
// ---------- leyenda, capas y vistas
const LY = [['torre', 'Edificio (5 pisos · 15 deptos)', '#ece6da'], ['losa', 'Losa planta baja', '#c9c5bc'], ['subsuelo', 'Muros y columnas del subsuelo', '#b1ada4'], ['autos', 'Vehículos', '#8b1e1e'], ['piso', 'Piso del estacionamiento', '#8d8c87'], ['tapas', 'Tapas H°A°, bases y relleno', '#9a978f'], ['equipos', 'Biodigestores y cámaras', '#24332b'], ['canos', 'Cañerías y válvulas', '#e8e3d4']];
$('hd').innerHTML = '<b>Instalación de biodigestores · ' + PERS + ' personas</b><span style="color:#5f5a52">' + nB + (nB === 1 ? ' biodigestor' : ' biodigestores') + ' de 1.800 L' + (conSec ? ' con sistema de secado' : '') + ' bajo el piso del estacionamiento</span>' + LY.map(([k, t, c]) => '<label><input type="checkbox" data-k="' + k + '" checked style="margin:0"><i style="background:' + c + '"></i>' + t + '</label>').join('');
const setCapa = (k, v) => { capas[k].visible = v; const el = document.querySelector('#hd input[data-k="' + k + '"]'); if (el) el.checked = v; };
document.querySelectorAll('#hd input').forEach(i => i.onchange = () => setCapa(i.dataset.k, i.checked));
const pisoVisto = (op) => { mPiso.opacity = op; mPiso.depthWrite = op > 0.9; };
const marcar = (id) => document.querySelectorAll('#bt button').forEach(b => b.classList.toggle('on', b.id === id));
const vista = (n) => {
  ['torre', 'losa', 'subsuelo', 'autos', 'piso', 'tapas', 'equipos', 'canos', 'terreno'].forEach(k => setCapa(k, true)); pisoVisto(1);
  if (n === 1) { ctl.target.set(0, 4, 0); cam.position.set(30, 20, 36); marcar('b1'); }
  else if (n === 2) { setCapa('torre', false); setCapa('losa', false); ctl.target.set(0, yS + 0.5, -0.5); cam.position.set(14, 7, 17); marcar('b2'); }
  else if (n === 3) { setCapa('torre', false); setCapa('losa', false); setCapa('autos', false); setCapa('terreno', false); pisoVisto(0.22); ctl.target.set(0, yS - 1.4, 0.3); cam.position.set(7, yS + 1.2, 6.5); marcar('b3'); }
  else { setCapa('torre', false); setCapa('losa', false); ctl.target.set(0, yS, 0); cam.position.set(0.01, 26, 0.6); marcar('b4'); }
  ctl.update(); };
let panel = true; $('bP').onclick = () => { panel = !panel; $('hd').style.display = panel ? 'flex' : 'none'; $('e').style.display = panel ? 'block' : 'none'; $('bP').textContent = panel ? 'Ocultar panel' : 'Mostrar panel'; };
$('b1').onclick = () => vista(1); $('b2').onclick = () => vista(2); $('b3').onclick = () => vista(3); $('b4').onclick = () => vista(4); vista(PROP ? 3 : 1); if (PROP) { setCapa('subsuelo', false); capas.torre.visible = false; capas.losa.visible = false; capas.canos.children.forEach(o => { if (o.geometry) { o.updateMatrixWorld(true); o.geometry.computeBoundingBox(); const b2 = o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld); if (b2.min.y > yS + 0.2) o.visible = false; } }); }
if (PROP) { ['hd', 'bt', 'e'].forEach(i => $(i).style.display = 'none');
  // encuadre automático: toma todo lo instalado (equipos, tapas y cañerías) y lo ajusta al cuadro
  sc.updateMatrixWorld(true);
  const bb = new T.Box3(); [capas.equipos, capas.tapas].forEach(gp => gp.traverse(o => { if (o.isMesh && o.visible && o.userData && !/^Pozo ciego|^Fondo del pozo|^Tapa del pozo/.test(o.userData.n || '')) { o.geometry.computeBoundingBox(); const b2 = o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld); if (b2.max.y <= yS + 0.05) bb.union(b2); } }));
  const c = bb.getCenter(new T.Vector3()), sz = bb.getSize(new T.Vector3()), dir = new T.Vector3(0.35, 0.55, 1.0).normalize();
  const fovV = cam.fov * Math.PI / 180, fovH = 2 * Math.atan(Math.tan(fovV / 2) * cam.aspect), rad = sz.length() / 2;
  const d = Math.max(rad / Math.sin(fovV / 2), rad / Math.sin(fovH / 2)) * 1.12;
  ctl.target.copy(c); cam.position.copy(c).addScaledVector(dir, d); ctl.update();
  r.setPixelRatio(2); fit(); setTimeout(() => { r.render(sc, cam); try { parent.postMessage({ bio3d: 'snap', key: QS.get('k') || '', url: r.domElement.toDataURL('image/jpeg', 0.88) }, '*'); } catch (x) {} }, 900); }
// tooltip con nombre, función y medida
const ray = new T.Raycaster(), mp = new T.Vector2(); let hov = null;
const visible = (o) => { for (let q = o; q; q = q.parent) if (!q.visible) return false; return true; };
r.domElement.addEventListener('pointermove', (e) => { mp.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); ray.setFromCamera(mp, cam);
  const h = ray.intersectObjects(pick, false).find(x => visible(x.object) && x.object.userData.n && !(x.object.material.opacity < 0.4 && !/Relleno|Pozo/.test(x.object.userData.n)));
  if (hov && (!h || h.object !== hov.o)) { hov.o.material = hov.m; hov = null; }
  const t = $('tip'); if (!h) { t.style.display = 'none'; return; }
  if (/^(Piso del estacionamiento|Losa sobre|Muro perimetral)/.test(h.object.userData.n) && mPiso.opacity < 0.5) { t.style.display = 'none'; return; }
  if (!hov && h.object.material.emissive) { const m0 = h.object.material, m1 = m0.clone(); m1.emissive = new T.Color('#ffb300'); m1.emissiveIntensity = 0.25; h.object.material = m1; hov = { o: h.object, m: m0 }; }
  const u = h.object.userData; t.innerHTML = '<b>' + u.n + '</b>' + (u.d ? u.d : '') + (u.x ? '<br><span>' + u.x + '</span>' : ''); t.style.display = 'block';
  t.style.left = Math.min(innerWidth - 300, e.clientX + 14) + 'px'; t.style.top = (e.clientY + 12) + 'px'; });
r.domElement.addEventListener('pointerleave', () => { $('tip').style.display = 'none'; if (hov) { hov.o.material = hov.m; hov = null; } });
</script></body></html>
