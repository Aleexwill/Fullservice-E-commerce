<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Fundaciones 3D</title>
<style>html,body{margin:0;height:100%;background:#eeece8;overflow:hidden;font-family:'IBM Plex Sans',system-ui,sans-serif}#v{position:absolute;inset:0}
#ley{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.95);border:1px solid #dedbd5;border-radius:8px;padding:8px 10px;font-size:11.5px;display:flex;flex-direction:column;gap:4px;max-width:300px}
#ley label{display:flex;align-items:center;gap:6px;cursor:pointer}#ley i{width:12px;height:12px;border-radius:2px;flex:none;border:1px solid rgba(0,0,0,.2)}
#tip{position:absolute;pointer-events:none;background:#1b1a18;color:#fff;font-size:11.5px;line-height:1.45;padding:6px 9px;border-radius:5px;display:none;white-space:nowrap}
#est{position:absolute;right:10px;bottom:8px;font-size:11px;color:#6f6b64;background:rgba(255,255,255,.88);padding:3px 8px;border-radius:5px}
#ayu{position:absolute;left:10px;bottom:8px;font-size:11px;color:#6f6b64;background:rgba(255,255,255,.88);padding:3px 8px;border-radius:5px}#bt{position:absolute;right:10px;top:10px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}#bt button{font:600 11.5px system-ui;padding:5px 9px;border:1px solid #c9c5bd;background:#fff;border-radius:5px;cursor:pointer}
.lb{font:600 10.5px 'IBM Plex Mono',monospace;color:#1b1a18;background:rgba(255,255,255,.92);border:1px solid #c9c5bd;border-radius:4px;padding:2px 5px;white-space:nowrap;pointer-events:none;line-height:1.35}
.lb.t{border-color:#d9731a;color:#8a3d00}.lb b{font-weight:700}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><div id="v"></div><div id="ley"></div><div id="tip"></div><div id="est">Cargando…</div><div id="ayu">Clic izq.: girar · rueda: acercar/alejar · clic der.: mover · doble clic: centrar</div>
<div id="bt"><button data-v="iso">Isométrica</button><button data-v="planta">Planta</button><button data-v="frente">Frente</button><button data-v="lado">Lateral</button><button data-v="bajo">Desde abajo</button></div>
<script type="module">
import * as T from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
const $ = (i) => document.getElementById(i), est = (s) => $('est').textContent = s;
const f2 = (v) => (Math.round(v * 100) / 100).toFixed(2).replace('.', ',');
const ren = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); ren.setPixelRatio(Math.min(2, devicePixelRatio || 1)); $('v').appendChild(ren.domElement);
const lr = new CSS2DRenderer(); lr.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none;overflow:hidden'; $('v').appendChild(lr.domElement);
const sc = new T.Scene(); sc.background = new T.Color('#eeece8');
const cam = new T.PerspectiveCamera(40, 1, 0.02, 3000); const ctl = new OrbitControls(cam, ren.domElement);
ctl.enableDamping = true; ctl.dampingFactor = 0.12; ctl.zoomToCursor = true; ctl.screenSpacePanning = true; ctl.minDistance = 0.3; ctl.maxDistance = 600; ctl.zoomSpeed = 1.2; ctl.rotateSpeed = 0.8; ctl.panSpeed = 1.0;
ctl.mouseButtons = { LEFT: T.MOUSE.ROTATE, MIDDLE: T.MOUSE.DOLLY, RIGHT: T.MOUSE.PAN }; ctl.touches = { ONE: T.TOUCH.ROTATE, TWO: T.TOUCH.DOLLY_PAN };
ren.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
// doble clic: centra la vista en el punto
ren.domElement.addEventListener('dblclick', (e) => { const r = ren.domElement.getBoundingClientRect(); const m = new T.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); const rc = new T.Raycaster(); rc.setFromCamera(m, cam); const h = rc.intersectObjects(G.children, true).find(x => x.object.isMesh && x.object.visible); if (!h) return; const d = cam.position.clone().sub(ctl.target); ctl.target.copy(h.point); cam.position.copy(h.point).add(d.multiplyScalar(0.6)); ctl.update(); });
sc.add(new T.HemisphereLight('#ffffff', '#8f8a83', 1.0)); const dl = new T.DirectionalLight('#ffffff', 1.1); dl.position.set(30, 60, 20); sc.add(dl);
const G = new T.Group(); sc.add(G);
let DATA = null, BAR = null, verTerr = true, verEst = true, verMed = false, cx = 0, cy = 0, z0 = 0;
const fit = () => { const w = innerWidth, h = innerHeight; ren.setSize(w, h); lr.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); }; addEventListener('resize', fit); fit();
const V = (x, y, z) => new T.Vector3(x - cx, z - z0, -(y - cy));
const pick = [];
function armar() {
  if (!DATA) return;
  while (G.children.length) { const o = G.children.pop(); o.traverse(q => { if (q.geometry) q.geometry.dispose(); if (q.element) q.element.remove(); }); }
  pick.length = 0;
  const B = DATA.bases, xs = B.map(b => b.x), ys = B.map(b => b.y);
  cx = (Math.min(...xs) + Math.max(...xs)) / 2; cy = (Math.min(...ys) + Math.max(...ys)) / 2; z0 = DATA.NPT;
  // terreno natural
  const tw = Math.max(...xs) - Math.min(...xs) + 16, td = Math.max(...ys) - Math.min(...ys) + 16, nx = 40, ny = 60;
  const pg = new T.PlaneGeometry(tw, td, nx, ny), pos = pg.attributes.position, col = [];
  const tmin = DATA.TNmin, tmax = DATA.TNmax;
  for (let i = 0; i < pos.count; i++) { const px = pos.getX(i) + cx, py = -pos.getY(i) + cy; const z = DATA.tn(px, py); pos.setZ(i, z - z0); const k = (z - tmin) / Math.max(0.01, tmax - tmin); const c = new T.Color().setHSL(0.1 + 0.18 * k, 0.42, 0.62); col.push(c.r, c.g, c.b); }
  pg.setAttribute('color', new T.Float32BufferAttribute(col, 3)); pg.computeVertexNormals();
  const terr = new T.Mesh(pg, new T.MeshStandardMaterial({ vertexColors: true, transparent: true, opacity: 0.45, side: T.DoubleSide, depthWrite: false, roughness: 1 }));
  terr.rotation.x = -Math.PI / 2; terr.visible = verTerr; terr.userData.terr = 1; G.add(terr);
  const ed = new T.LineSegments(new T.WireframeGeometry(pg), new T.LineBasicMaterial({ color: '#9a8f7a', transparent: true, opacity: 0.25 })); ed.rotation.x = -Math.PI / 2; ed.visible = verTerr; ed.userData.terr = 1; G.add(ed);
  // nivel de piso terminado
  const np = new T.Mesh(new T.PlaneGeometry(tw - 10, td - 10), new T.MeshBasicMaterial({ color: '#1f4e79', transparent: true, opacity: 0.07, side: T.DoubleSide, depthWrite: false })); np.rotation.x = -Math.PI / 2; np.position.y = 0.002; G.add(np);
  const mZ = new T.MeshStandardMaterial({ color: '#b7b1a6', roughness: 0.9 }), mZT = new T.MeshStandardMaterial({ color: '#e59a55', roughness: 0.85 }), mP = new T.MeshStandardMaterial({ color: '#cfc9bf', roughness: 0.85 }), mPT = new T.MeshStandardMaterial({ color: '#f0b67e', roughness: 0.85 }), mL = new T.MeshStandardMaterial({ color: '#8e887d', roughness: 1 }), mA = new T.MeshStandardMaterial({ color: '#3a3a3a', metalness: 0.7, roughness: 0.35 }), mPl = new T.MeshStandardMaterial({ color: '#1f4e79', metalness: 0.6, roughness: 0.4 });
  const box = (w, h, d, c, m, ud) => { const o = new T.Mesh(new T.BoxGeometry(w, h, d), m); o.position.copy(c); o.userData = ud || {}; G.add(o); if (ud) pick.push(o); return o; };
  B.forEach(b => {
    const ten = b.tipo === 'Z2', zf = b.fondo, ud = { b };
    box(b.B + 0.1, 0.05, b.B + 0.1, V(b.x, b.y, zf - 0.025), mL);
    box(b.B, b.h, b.B, V(b.x, b.y, zf + b.h / 2), ten ? mZT : mZ, ud);
    const hp = b.top - (zf + b.h); box(b.a, hp, b.a, V(b.x, b.y, zf + b.h + hp / 2), ten ? mPT : mP, ud);
    box(b.a + 0.06, 0.02, b.a + 0.06, V(b.x, b.y, b.top + 0.01), mPl, ud);
    [-0.12, 0.12].forEach(dx => [-0.12, 0.12].forEach(dy => { const r = new T.Mesh(new T.CylinderGeometry(0.012, 0.012, 0.75, 8), mA); r.position.copy(V(b.x + dx, b.y + dy, b.top - 0.3)); G.add(r); }));
    // excavación en alambre
    const ex = new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(b.B + 0.3, b.tn - zf, b.B + 0.3)), new T.LineBasicMaterial({ color: '#8a7a5a', transparent: true, opacity: 0.45 })); ex.position.copy(V(b.x, b.y, zf + (b.tn - zf) / 2)); ex.userData.terr = 1; ex.visible = verTerr; G.add(ex);
    if (ten) { const dir = new T.Vector3(DATA.tensorDir[0], 0.9, -DATA.tensorDir[1]).normalize(); const st = V(b.x, b.y, b.top + 7.5), a = new T.ArrowHelper(dir, st, 4.5, 0xd9731a, 0.6, 0.3); G.add(a);
      const lt = document.createElement('div'); lt.className = 'lb t'; lt.innerHTML = '<b>Tensor elevador</b> ' + f2(DATA.Tt) + ' kN'; const o2 = new CSS2DObject(lt); o2.position.copy(V(b.x, b.y, b.top + 8.2)); G.add(o2); }
    const el = document.createElement('div'); el.className = 'lb' + (ten ? ' t' : ''); el.innerHTML = '<b>' + b.id + ' · ' + b.tipo + '</b><br>' + f2(b.B) + '×' + f2(b.B) + '×' + f2(b.h) + ' m<br>ped. ' + f2(b.a) + '×' + f2(b.a) + ' · H ' + f2(hp) + '<br>fondo ' + f2(zf);
    const lo = new CSS2DObject(el); lo.position.copy(V(b.x, b.y, zf - 0.35)); lo.visible = verMed; lo.userData.med = 1; G.add(lo);
  });
  // Refuerzo de estructura en los pilares con tensor: pilares, cordones y diagonales cercanos en naranja.
  const Z2 = B.filter(b => b.tipo === 'Z2');
  if (BAR && Z2.length) { const mR = new T.MeshStandardMaterial({ color: '#e0701a', emissive: '#7a3200', emissiveIntensity: 0.35, roughness: 0.5, metalness: 0.4 });
    BAR.barras.forEach(q => { const mx = (q.a[0] + q.b[0]) / 2, my = (q.a[1] + q.b[1]) / 2; const zb = Z2.find(b => Math.hypot(mx - b.x, my - b.y) < 3.2); if (!zb) return;
      const A = V(q.a[0], q.a[1], q.a[2] + DATA.NPT + 0.2), C2 = V(q.b[0], q.b[1], q.b[2] + DATA.NPT + 0.2), d = C2.clone().sub(A), L = d.length(); if (L < 0.05) return;
      const vert = Math.abs(q.a[2] - q.b[2]) > L * 0.8, m = new T.Mesh(new T.CylinderGeometry(vert ? 0.07 : 0.04, vert ? 0.07 : 0.04, L, 8), mR);
      m.position.copy(A.clone().add(C2).multiplyScalar(0.5)); m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), d.normalize()); m.userData = { refz: zb, p: q.p, L }; G.add(m); pick.push(m); });
    Z2.forEach(b => { const ring = new T.Mesh(new T.RingGeometry(b.B * 0.85, b.B * 0.95, 48), new T.MeshBasicMaterial({ color: '#e0701a', transparent: true, opacity: 0.55, side: T.DoubleSide })); ring.rotation.x = -Math.PI / 2; ring.position.copy(V(b.x, b.y, b.tn + 0.03)); G.add(ring); }); }
  if (BAR && verEst) { const p = []; BAR.barras.forEach(q => { const a = V(q.a[0], q.a[1], q.a[2] + DATA.NPT + 0.2), c = V(q.b[0], q.b[1], q.b[2] + DATA.NPT + 0.2); p.push(a.x, a.y, a.z, c.x, c.y, c.z); });
    const g2 = new T.BufferGeometry(); g2.setAttribute('position', new T.Float32BufferAttribute(p, 3)); const ls = new T.LineSegments(g2, new T.LineBasicMaterial({ color: '#4a6f95', transparent: true, opacity: 0.22 })); ls.userData.est = 1; G.add(ls); }
  const nT = B.filter(b => b.tipo === 'Z2').length;
  $('ley').innerHTML = '<b style="font-size:12px">Fundaciones · ' + B.length + ' bases</b>' +
    '<div style="display:flex;align-items:center;gap:6px"><i style="background:#b7b1a6"></i>Z1 · zapata tipo (' + (B.length - nT) + ')</div>' +
    '<div style="display:flex;align-items:center;gap:6px"><i style="background:#e59a55"></i>Z2 · base con tensor del elevador (' + nT + ')</div>' +
    '<div style="display:flex;align-items:center;gap:6px"><i style="background:#e0701a"></i>Estructura reforzada en pilares con tensor</div>' + '<div style="display:flex;align-items:center;gap:6px"><i style="background:#1f4e79"></i>Placa base y NPT ' + f2(DATA.NPT) + '</div>' +
    '<label><input type="checkbox" id="cT" ' + (verTerr ? 'checked' : '') + ' style="margin:0">Terreno natural y excavación</label>' +
    '<label><input type="checkbox" id="cE" ' + (verEst ? 'checked' : '') + ' style="margin:0">Estructura metálica</label>' +
    '<label><input type="checkbox" id="cM" ' + (verMed ? 'checked' : '') + ' style="margin:0">Mostrar todos los rótulos</label>' +
    '<span style="color:#6f6b64">TN de ' + f2(tmin) + ' a ' + f2(tmax) + ' m</span>';
  $('cT').onchange = (e) => { verTerr = e.target.checked; G.children.forEach(o => { if (o.userData.terr) o.visible = verTerr; }); };
  $('cE').onchange = (e) => { verEst = e.target.checked; armar(); };
  $('cM').onchange = (e) => { verMed = e.target.checked; G.children.forEach(o => { if (o.userData.med) o.visible = verMed; }); };
  est(B.length + ' bases · hormigón ' + f2(DATA.vol) + ' m³ · NPT ' + f2(DATA.NPT));
}
const R0 = () => { const B = DATA.bases, W = Math.max(...B.map(b => b.x)) - Math.min(...B.map(b => b.x)), L = Math.max(...B.map(b => b.y)) - Math.min(...B.map(b => b.y)); return Math.max(W, L); };
const vista = (k) => { const R = R0(); ctl.target.set(0, -1, 0); const p = { iso: [R * 0.7, R * 0.45, R * 0.8], planta: [0.001, R * 1.4, 0.001], frente: [0, 0.5, R * 1.2], lado: [R * 1.2, 0.5, 0], bajo: [R * 0.6, -R * 0.5, R * 0.6] }[k]; cam.position.set(...p); cam.lookAt(ctl.target); ctl.update(); };
document.querySelectorAll('#bt button').forEach(b => b.onclick = () => vista(b.dataset.v));
const ray = new T.Raycaster(), mo = new T.Vector2();
let _hv = 0; ren.domElement.addEventListener('pointermove', (e) => { if (!DATA || e.buttons) { $('tip').style.display = 'none'; return; } const now = performance.now(); if (now - _hv < 40) return; _hv = now; const r = ren.domElement.getBoundingClientRect(); mo.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(mo, cam);
  const h = ray.intersectObjects(pick, false)[0], tip = $('tip'); if (!h) { tip.style.display = 'none'; return; }
  if (h.object.userData.refz) { const u = h.object.userData; tip.innerHTML = '<b>Zona reforzada · tensor del elevador</b><br>Pilar sobre ' + u.refz.id + ' · ' + String(u.p || '').replace(' /y /z', '') + '<br>Largo ' + f2(u.L) + ' m · refuerzo con 2C 180, orejas de 19 mm y cartelas'; tip.style.display = 'block'; const r2 = ren.domElement.getBoundingClientRect(); tip.style.left = (e.clientX - r2.left + 14) + 'px'; tip.style.top = (e.clientY - r2.top + 10) + 'px'; return; }
  const b = h.object.userData.b;
  tip.innerHTML = '<b>' + b.id + ' · ' + (b.tipo === 'Z2' ? 'Base con tensor del elevador' : 'Zapata tipo') + '</b><br>Zapata ' + f2(b.B) + ' × ' + f2(b.B) + ' × ' + f2(b.h) + ' m<br>Pedestal ' + f2(b.a) + ' × ' + f2(b.a) + ' m · alto ' + f2(b.top - b.fondo - b.h) + ' m<br>TN ' + f2(b.tn) + ' · fondo ' + f2(b.fondo) + ' · prof. ' + f2(b.tn - b.fondo) + ' m<br>Hormigón ' + f2(b.vol) + ' m³ · acero ' + Math.round(b.kg) + ' kg';
  tip.style.display = 'block'; tip.style.left = (e.clientX - r.left + 14) + 'px'; tip.style.top = (e.clientY - r.top + 10) + 'px'; });
function cargar() { try { const d = JSON.parse(localStorage.getItem('twg-fund3d-misericordia') || 'null'); if (!d) { est('Abrí la pestaña Fundaciones del estudio para generar el modelo'); return; }
  const g = d.terreno; d.tn = (x, y) => g.a + g.bx * x + g.by * y; DATA = d; armar(); if (!cargar.v) { vista('iso'); cargar.v = 1; } } catch (e) { est('Error: ' + e.message); } }
try { BAR = await (await fetch('estructuras/misericordia/barras.json', { cache: 'no-store' })).json(); } catch (e) {}
cargar(); addEventListener('storage', (e) => { if (e.key === 'twg-fund3d-misericordia') cargar(); });
addEventListener('message', (e) => { if (e.data && e.data.fund3d) cargar(); });
(function loop() { requestAnimationFrame(loop); ctl.update(); ren.render(sc, cam); lr.render(sc, cam); })();
</script></body></html>
