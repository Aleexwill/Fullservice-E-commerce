<script type="module">
import * as T from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const $ = (i) => document.getElementById(i);
const QS = new URLSearchParams(location.search), PROP = QS.get('prop') === '1';
const r = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setPixelRatio(Math.min(2, devicePixelRatio || 1)); r.shadowMap.enabled = true; r.shadowMap.type = T.PCFSoftShadowMap;
r.toneMapping = T.ACESFilmicToneMapping; r.outputColorSpace = T.SRGBColorSpace; $('v').appendChild(r.domElement);
const sc = new T.Scene(); sc.background = new T.Color('#dfe4e8');
sc.environment = new T.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const cam = new T.PerspectiveCamera(38, 1, 0.03, 500);
sc.add(new T.HemisphereLight('#ffffff', '#7d8a80', 0.6));
const sun = new T.DirectionalLight('#fff6e8', 1.6); sun.position.set(9, 14, 7); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 50 }); sun.shadow.bias = -0.0004; sc.add(sun);
const ctl = new OrbitControls(cam, r.domElement); ctl.enableDamping = true; ctl.screenSpacePanning = true; ctl.minDistance = 1; ctl.maxDistance = 60;
const fit = () => { const w = innerWidth || 800, h = innerHeight || 560; r.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); };
addEventListener('resize', fit); fit();

const texCanvas = (w, h, draw, rep) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new T.CanvasTexture(c); t.wrapS = t.wrapT = T.RepeatWrapping; if (rep) t.repeat.set(...rep); t.colorSpace = T.SRGBColorSpace; return t; };
const ruido = (x, w, h, base, v) => { x.fillStyle = base; x.fillRect(0, 0, w, h); for (let i = 0; i < w * h / 6; i++) { const g = Math.random() * v; x.fillStyle = 'rgba(' + (g > v / 2 ? '255,255,255' : '0,0,0') + ',' + (Math.abs(g - v / 2) / v * 0.18) + ')'; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); } };
const tHorm = texCanvas(256, 256, (x, w, h) => ruido(x, w, h, '#b3afa6', 60), [2, 2]);
const tTierra = texCanvas(256, 256, (x, w, h) => ruido(x, w, h, '#9a6b45', 90), [3, 3]);
const tPasto = texCanvas(256, 256, (x, w, h) => ruido(x, w, h, '#6f8f4a', 90), [8, 8]);
const tMad = texCanvas(256, 64, (x, w, h) => { ruido(x, w, h, '#c79a5e', 50); x.strokeStyle = 'rgba(80,50,20,.45)'; for (let i = 0; i < 4; i++) { x.beginPath(); x.moveTo(0, i * 16); x.lineTo(w, i * 16); x.stroke(); } }, [2, 4]);
const M = (c, o) => new T.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.8 }, o || {}));

const capas = {}, pick = [];
['terreno', 'excav', 'limpieza', 'camara', 'acero', 'encofrado', 'canos', 'tapa'].forEach(k => { capas[k] = new T.Group(); sc.add(capas[k]); });
const reg = (m, n, d, cap, x) => { m.userData = { n, d, x: x || '' }; m.castShadow = true; m.receiveShadow = true; if (n) pick.push(m); (typeof cap === 'string' ? capas[cap] : cap).add(m); return m; };

const pipe = (a, b, rr, mat, n, ds, cap) => { const A = new T.Vector3(...a), B = new T.Vector3(...b), v = B.clone().sub(A), L = v.length(); const m = new T.Mesh(new T.CylinderGeometry(rr, rr, L, 20), mat); m.position.copy(A).add(B).multiplyScalar(0.5); m.quaternion.setFromUnitVectors(new T.Vector3(0, 1, 0), v.normalize()); return reg(m, n, ds, cap); };

// Según plano AXIS (Desengrasador, hoja 03): 5,20 × 2,50 × 2,80 m con losa de tapa · 1 tabique · fundación a −3,00 m
const L = 5.2, W = 2.5, H = 2.8, e = 0.2, ef = 0.2, ET = 0.15, et = 0.15, hT = 2.0, SOB = 0.3, yTop = 0.2, yBot = yTop - H, yW = yTop - ET, LIM = 0.05;
const XE = L + 2 * SOB, ZE = W + 2 * SOB, PROF = H - yTop + LIM, hi = H - ef - ET;
const C1 = 3.0, xb1 = -L / 2 + e + C1 + et / 2, C2 = L - 2 * e - C1 - et, xi = L - 2 * e;
const gsh = new T.Shape(); gsh.moveTo(-14, -10); gsh.lineTo(14, -10); gsh.lineTo(14, 10); gsh.lineTo(-14, 10); gsh.lineTo(-14, -10);
const hole = new T.Path(); hole.moveTo(-XE / 2, -ZE / 2); hole.lineTo(XE / 2, -ZE / 2); hole.lineTo(XE / 2, ZE / 2); hole.lineTo(-XE / 2, ZE / 2); hole.lineTo(-XE / 2, -ZE / 2); gsh.holes.push(hole);
const ter = new T.Mesh(new T.ShapeGeometry(gsh), M('#7a9450', { map: tPasto, roughness: 1 })); ter.rotation.x = -Math.PI / 2; ter.receiveShadow = true; capas.terreno.add(ter);
const mT = M('#9a6b45', { map: tTierra, roughness: 1, side: T.DoubleSide });
const yEx = -PROF / 2;
box(XE, PROF, 0.02, 0, yEx, -ZE / 2, mT, 'Excavación manual · pared perfilada', 'Hasta la cota de fundación: 3,00 m bajo el terreno natural', 'excav', '5,80 × 3,10 × 3,05 m');
box(0.02, PROF, ZE, -XE / 2, yEx, 0, mT, 'Excavación manual · pared perfilada', 'Sobreancho de 30 cm por lado', 'excav');
box(0.02, PROF, ZE, XE / 2, yEx, 0, mT, 'Excavación manual · pared perfilada', 'Sobreancho de 30 cm por lado', 'excav');
const parFrente = box(XE, PROF, 0.02, 0, yEx, ZE / 2, mT, 'Excavación manual · pared perfilada', '', 'excav');
box(XE, 0.02, ZE, 0, -PROF, 0, mT, 'Fondo de excavación perfilado y compactado', 'Cota de fundación −3,00 m del terreno natural', 'excav');
box(XE, LIM, ZE, 0, yBot - LIM / 2, 0, M('#8f8c85', { map: tHorm }), 'Hormigón de limpieza (sellado) · 5 cm', 'Elaborado y colocado in situ sobre el fondo perfilado', 'limpieza');
const mH = M('#c3bfb6', { map: tHorm, roughness: 0.9 });
const dsC = 'Hormigón 210 kg/cm² · acero 5000 kg/cm² · recubrimiento 2,5 cm', exC = '5,20 × 2,50 × 2,80 m exterior';
box(L, ef, W, 0, yBot + ef / 2, 0, mH, 'Losa de fondo de H°A° · 20 cm', 'Armadura inferior y superior · recubrimiento 3 cm', 'camara', exC);
box(L, hi, e, 0, yBot + ef + hi / 2, -W / 2 + e / 2, mH, 'Muro de H°A° · 20 cm', dsC, 'camara', exC);
const muroFrente = box(L, hi, e, 0, yBot + ef + hi / 2, W / 2 - e / 2, mH, 'Muro de H°A° · 20 cm', dsC, 'camara', exC);
box(e, hi, W - 2 * e, -L / 2 + e / 2, yBot + ef + hi / 2, 0, mH, 'Muro de H°A° · 20 cm · lado entrada', dsC, 'camara', exC);
box(e, hi, W - 2 * e, L / 2 - e / 2, yBot + ef + hi / 2, 0, mH, 'Muro de H°A° · 20 cm · lado salida', dsC, 'camara', exC);
box(et, hT, W - 2 * e, xb1, yBot + ef + hT / 2, 0, M('#b8b4ab', { map: tHorm }), 'Tabique de H°A° · 15 cm', 'Desde el fondo, deja 0,45 m libres bajo la tapa: separa la cámara de retención (3,00 m) de la de salida (1,65 m)', 'camara', 'Alto 2,00 m');
const yAg = yW - 0.45;
const agua = box(xi - 0.02, yAg - (yBot + ef), W - 2 * e - 0.02, 0, (yAg + yBot + ef) / 2, 0, M('#6f8a8f', { transparent: true, opacity: 0.35, roughness: 0.1, depthWrite: false }), 'Nivel de líquido', '', 'camara');
const grasa = box(C1 - 0.02, 0.06, W - 2 * e - 0.02, -L / 2 + e + C1 / 2, yAg + 0.03, 0, M('#c9a227', { transparent: true, opacity: 0.8 }), 'Grasa retenida en superficie', 'Se retira en la limpieza periódica por el hueco de la cámara 1', 'camara');
agua.visible = grasa.visible = false;
const mA = M('#7a4a2a', { metalness: 0.6, roughness: 0.45 });
for (let i = 0; i <= 26; i++) { const x = -L / 2 + 0.1 + i * (L - 0.2) / 26; pipe([x, yBot + 0.06, W / 2 - 0.03], [x, yW - 0.03, W / 2 - 0.03], 0.006, mA, 'Armadura vertical de muros', 'Doble malla · según planilla del plano', 'acero'); pipe([x, yBot + 0.06, W / 2 - 0.17], [x, yW - 0.03, W / 2 - 0.17], 0.006, mA, 'Armadura vertical de muros', 'Malla interior', 'acero'); }
for (let j = 0; j <= 12; j++) { const y = yBot + 0.08 + j * (H - ET - 0.14) / 12; pipe([-L / 2 + 0.05, y, W / 2 - 0.04], [L / 2 - 0.05, y, W / 2 - 0.04], 0.006, mA, 'Armadura horizontal de muros', 'Doble malla · según planilla del plano', 'acero'); pipe([-L / 2 + 0.05, y, W / 2 - 0.16], [L / 2 - 0.05, y, W / 2 - 0.16], 0.006, mA, 'Armadura horizontal de muros', 'Malla interior', 'acero'); }
capas.acero.visible = false;
const mMad = M('#c79a5e', { map: tMad });
box(L + 0.06, hi, 0.03, 0, yBot + ef + hi / 2, -W / 2 - 0.03, mMad, 'Encofrado exterior · tablas y puntales', 'Doble encofrado: cara exterior e interior de cada muro', 'encofrado');
box(xi, hi - 0.05, 0.03, 0, yBot + ef + hi / 2, -W / 2 + e + 0.03, mMad, 'Encofrado interior · tablas y puntales', 'Se retira después del curado', 'encofrado');
for (let i = 0; i < 6; i++) { const x = -L / 2 + 0.3 + i * (L - 0.6) / 5; const p = new T.Mesh(new T.BoxGeometry(0.07, 0.07, 0.62), mMad); p.position.set(x, yBot + 1.2, -W / 2 - 0.33); p.rotation.x = 0.55; reg(p, 'Puntal del encofrado exterior', 'Apoyado contra la pared de excavación', 'encofrado'); }
capas.encofrado.visible = false;
const mPVC = M('#e8e3d4', { roughness: 0.35 });
pipe([-L / 2 - SOB - 1.2, yW - 0.3, 0], [-L / 2 + e + 0.05, yW - 0.3, 0], 0.08, mPVC, 'Entrada Ø 160 mm', 'Cañería y conexión a cargo del cliente', 'canos');
pipe([L / 2 - e - 0.05, yW - 0.4, 0], [L / 2 + SOB + 1.2, yW - 0.4, 0], 0.08, mPVC, 'Salida Ø 160 mm', 'Cañería y conexión a cargo del cliente', 'canos');

// Losa de tapa de H°A° 15 cm con un hueco de 0,60 × 0,60 por cámara, reforzado con 2 Ø 12 superior e inferior
const BOC = 0.6, CX = [-L / 2 + e + C1 / 2, xb1 + et / 2 + C2 / 2];
const tapaG = new T.Group(); capas.tapa.add(tapaG);
const sh = new T.Shape(); sh.moveTo(-L / 2, -W / 2); sh.lineTo(L / 2, -W / 2); sh.lineTo(L / 2, W / 2); sh.lineTo(-L / 2, W / 2); sh.closePath();
CX.forEach(cx => { const p = new T.Path(); p.moveTo(cx - BOC / 2, -BOC / 2); p.lineTo(cx - BOC / 2, BOC / 2); p.lineTo(cx + BOC / 2, BOC / 2); p.lineTo(cx + BOC / 2, -BOC / 2); p.closePath(); sh.holes.push(p); });
const gT = new T.ExtrudeGeometry(sh, { depth: ET, bevelEnabled: false }); gT.rotateX(-Math.PI / 2);
reg(new T.Mesh(gT, M('#bdb9b0', { map: tHorm })), 'Losa de tapa de H°A° · 15 cm', 'Armadura inferior y superior · huecos reforzados con 2 Ø 12 arriba y abajo', tapaG, '5,20 × 2,50 m');
const mMet = M('#6b6f72', { metalness: 0.7, roughness: 0.4 });
CX.forEach(cx => { [-1, 1].forEach(s => { pipe([cx - BOC / 2 - 0.45, ET + 0.004, s * (BOC / 2 + 0.05)], [cx + BOC / 2 + 0.45, ET + 0.004, s * (BOC / 2 + 0.05)], 0.008, mA, 'Refuerzo de hueco 2 Ø 12', 'Superior e inferior, 45 cm más allá del hueco', tapaG); pipe([cx + s * (BOC / 2 + 0.05), ET + 0.004, -BOC / 2 - 0.45], [cx + s * (BOC / 2 + 0.05), ET + 0.004, BOC / 2 + 0.45], 0.008, mA, 'Refuerzo de hueco 2 Ø 12', 'Superior e inferior, 45 cm más allá del hueco', tapaG); }); });
const tapas = CX.map((cx, i) => { const g = new T.Group(); g.userData.cx = cx;
  reg(new T.Mesh(new T.BoxGeometry(0.7, 0.06, 0.7), M('#cbc7be', { map: tHorm })), 'Tapa del hueco ' + (i + 1) + ' · 0,70 × 0,70 m', 'Tapa removible sobre el hueco de 0,60 × 0,60 m (no incluida)', g);
  [-0.2, 0.2].forEach(dx => { const a = new T.Mesh(new T.TorusGeometry(0.06, 0.008, 8, 16, Math.PI), mMet); a.position.set(dx, 0.03, 0); a.rotation.y = Math.PI / 2; reg(a, '', '', g); });
  tapaG.add(g); return g; });
let tT = 1, tGoal = 1, bT = 0, bGoal = 0, last = performance.now();
const ease = (u) => u * u * (3 - 2 * u), ZOFF = -(W / 2 + SOB + 1.7);
const aplicar = () => { const u = ease(tT), v = ease(bT); tapaG.position.set(0, u * yW + Math.sin(Math.PI * u) * 2.2, (1 - u) * ZOFF); tapas.forEach(g => g.position.set(g.userData.cx, ET + 0.03 + Math.sin(Math.PI * v) * 0.35, v * 0.85)); };
aplicar();
(function loop() { requestAnimationFrame(loop); const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  const mv = (c, g, s) => c + Math.sign(g - c) * Math.min(Math.abs(g - c), s); const t0 = tT, b0 = bT; tT = mv(tT, tGoal, dt / 1.8); bT = mv(bT, bGoal, dt / 1.0); if (t0 !== tT || b0 !== bT) aplicar();
  ctl.update(); r.render(sc, cam); })();
const txtBtns = () => { $('bT').textContent = tGoal ? 'Sacar losa de tapa' : 'Colocar losa de tapa'; $('bB').textContent = bGoal ? 'Cerrar huecos' : 'Abrir huecos'; };
$('bT').onclick = () => { tGoal = tGoal ? 0 : 1; setCapa('tapa', true); txtBtns(); };
$('bB').onclick = () => { bGoal = bGoal ? 0 : 1; setCapa('tapa', true); txtBtns(); };
txtBtns();

// Cotas 3D
const gCot = new T.Group(); sc.add(gCot); capas.cotas = gCot; const gCE = new T.Group(), gCI = new T.Group(); gCot.add(gCE, gCI); let gDst = gCE;
const mCot = new T.LineBasicMaterial({ color: '#c8102e', depthTest: false, transparent: true });
const etiq = (txt, p, chico) => { const c = document.createElement('canvas'); const w = 64 + txt.length * 30; c.width = w; c.height = 64; const g = c.getContext('2d'); g.fillStyle = 'rgba(255,255,255,.95)'; g.fillRect(0, 0, w, 64); g.strokeStyle = '#c8102e'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, w - 3, 61); g.fillStyle = '#9b0d23'; g.font = 'bold 38px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, w / 2, 34); const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; const s = new T.Sprite(new T.SpriteMaterial({ map: t, depthTest: false })); const k = chico ? 0.0034 : 0.0046; s.scale.set(w * k, 64 * k, 1); s.position.copy(p); s.renderOrder = 11; gDst.add(s); };
const dim3 = (a, b, txt, off, perp, chico) => { const A = new T.Vector3(...a), B = new T.Vector3(...b), P = new T.Vector3(...perp).multiplyScalar(0.07); const pts = [A, B, A.clone().add(P), A.clone().sub(P), B.clone().add(P), B.clone().sub(P)];
  const g = new T.BufferGeometry().setFromPoints(pts); const ln = new T.LineSegments(g, mCot); ln.renderOrder = 10; gDst.add(ln); etiq(txt, A.clone().add(B).multiplyScalar(0.5).add(new T.Vector3(...off)), chico); };
const zF = W / 2 + 0.02;
dim3([-L / 2, yTop + 0.4, zF], [L / 2, yTop + 0.4, zF], '5,20 m', [0, 0.17, 0], [0, 1, 0]);
dim3([L / 2 + 0.35, yTop + 0.4, -W / 2], [L / 2 + 0.35, yTop + 0.4, W / 2], '2,50 m', [0, 0.17, 0], [1, 0, 0]);
dim3([-L / 2 - 0.3, yBot, zF], [-L / 2 - 0.3, yTop, zF], '2,80 m', [-0.42, 0, 0], [1, 0, 0]);
dim3([L / 2 - e, yTop + 0.04, zF], [L / 2, yTop + 0.04, zF], '0,20', [0, 0.16, 0], [0, 1, 0], true);
dim3([-L / 2, yTop + 0.04, zF], [-L / 2 + e, yTop + 0.04, zF], '0,20', [0, 0.16, 0], [0, 1, 0], true);
dim3([L / 2 + 0.15, yW, zF], [L / 2 + 0.15, yTop, zF], '0,15 tapa', [0.38, 0, 0], [1, 0, 0], true);
gDst = gCI;
dim3([-L / 2 + e, yBot + ef + 0.06, zF], [L / 2 - e, yBot + ef + 0.06, zF], '4,80 m interior', [0, 0.16, 0], [0, 1, 0]);
dim3([L / 2 + 0.15, yBot, zF], [L / 2 + 0.15, yBot + ef, zF], '0,20', [0.3, 0, 0], [1, 0, 0], true);
dim3([-L / 2 + e, yBot + ef + 0.5, zF], [xb1 - et / 2, yBot + ef + 0.5, zF], '3,00', [0, 0.14, 0], [0, 1, 0], true);
dim3([xb1 + et / 2, yBot + ef + 0.5, zF], [L / 2 - e, yBot + ef + 0.5, zF], '1,65', [0, 0.14, 0], [0, 1, 0], true);
